<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>采集控制台 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<style>
.blog{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.brow{display:grid;grid-template-columns:104px 66px 84px 1fr 158px;gap:10px;align-items:center;
  padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border-subtle)}
.brow:last-child{border-bottom:0}
.brow.head{background:var(--surface-soft);font-size:12px;color:var(--text-secondary);font-weight:600}
.bnum{font-variant-numeric:tabular-nums;text-align:right}
.bdate{font-weight:600;font-variant-numeric:tabular-nums}
.iss{font-size:12px;color:var(--text-tertiary);line-height:1.6}
.cmd{border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-soft);
  padding:10px 14px;margin-bottom:8px}
.cmd .cl{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.cmd code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border-subtle);
  border-radius:6px;padding:7px 10px;overflow-x:auto;white-space:pre}
.cmd .cn{font-size:12px;color:var(--text-tertiary);margin-top:4px}
.warnbox{border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-soft);
  padding:12px 14px;font-size:13px;color:var(--text-secondary);line-height:1.8}
.warnbox b{color:var(--text)}
/* 采集控制 */
.ctl{border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-soft);padding:14px 16px}
.ctlrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ctlrow label{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.ctlrow input[type=number]{width:76px}
.ctlrow .cn{font-size:11px;color:var(--text-tertiary)}
.cstat{font-size:12.5px;color:var(--text-secondary);margin-left:4px}
.cstale{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.7;
  background:var(--warn-soft);color:var(--warn-ink)}
.cstale code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.clogwrap{margin-top:12px}
.clog-h{font-size:12px;color:var(--text-tertiary);margin-bottom:6px}
.clog{margin:0;max-height:300px;overflow:auto;background:var(--bg);border:1px solid var(--border-subtle);
  border-radius:6px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;line-height:1.6;color:var(--text-secondary);white-space:pre-wrap}
@media (max-width:900px){ .brow{grid-template-columns:1fr 1fr} .brow.head{display:none} .bhide{display:none} }
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <div class="main">
    <div class="wrap">
      <div class="card" id="content"><div class="loading">正在加载采集状态…</div></div>
    </div>
  </div>
</div>
<script src="v3chart.js"></script>
<script src="v3nav.js"></script>
<script>
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

function batches(d){
  return '<div class="blog"><div class="brow head">' +
    '<span>批次</span><span class="bnum">视频</span><span class="bnum">弹幕</span>' +
    '<span class="bhide">已知问题 / 覆盖率</span><span class="bhide">采集时间</span></div>' +
    d.batches.map(function(b){
      return '<div class="brow">' +
        '<span class="bdate">' + esc(b.batch_date) + '</span>' +
        '<span class="bnum">' + b.n_videos + ' 支</span>' +
        '<span class="bnum">' + b.n_danmaku.toLocaleString() + '</span>' +
        '<span class="iss bhide">' + esc(b.known_issues || ('覆盖率 ' + b.coverage)) + '</span>' +
        '<span class="iss bhide">' + esc((b.list_fetched_at || '—').slice(0, 19).replace('T', ' ')) + '</span>' +
      '</div>';
    }).join('') + '</div>';
}


/* ── 采集控制：真的能启停（后端跑 collect/bili.py）── */
var POLL = null;
function ctlHTML(st){
  var dis = st.running ? ' disabled' : '';
  return '<div class="ctl">' +
    '<div class="ctlrow">' +
      '<label>每次采集 <input id="cCount" type="number" min="1" max="300" value="10"' + dis + '> 支</label>' +
      '<label class="ck"><input id="cFresh" type="checkbox" checked' + dis + '> 刷新榜单（开新批次）</label>' +
      '<label class="ck"><input id="cSkip" type="checkbox"' + dis + '> 跳过初始冷却' +
        '<span class="cn">（仅演示；正常流程有 5 分钟冷却用来避开反爬）</span></label>' +
    '</div>' +
    '<div class="ctlrow">' +
      '<button class="btn primary" id="cStart"' + dis + '>▶ 开始采集</button>' +
      '<button class="btn" id="cStop"' + (st.running ? '' : ' disabled') + '>■ 停止</button>' +
      '<span class="cstat" id="cStat">' + statusText(st) + '</span>' +
    '</div>' +
    (st.snapshot_stale
      ? '<div class="cstale">⚠ 产物比快照新：新采的数据还没有进 v3 快照，前端暂时看不到。' +
        '在宿主机跑 <code>make v3-snapshot</code> 后刷新。</div>' : '') +
    '<div class="clogwrap"><div class="clog-h">采集日志' +
      (st.log_path ? '（' + esc(st.log_path) + '）' : '') + '</div>' +
      '<pre class="clog" id="cLog">' + (st.log_tail && st.log_tail.length
        ? esc(st.log_tail.join('\n')) : '（还没有采集日志）') + '</pre></div>' +
  '</div>';
}
function statusText(st){
  if (!st.available) return '采集脚本没有挂进容器 —— 检查 compose 的 volumes';
  if (st.running) return '● 正在采集（已跑 ' + st.elapsed_sec + ' 秒，pid ' + st.pid + '）';
  if (st.exit_code != null && st.exit_code !== 0) return '上次采集退出码 ' + st.exit_code + '（看日志）';
  return '空闲。最近产物：' + (st.newest_csv || '—') + (st.newest_csv_at ? '（' + st.newest_csv_at + '）' : '');
}
function refresh(){
  return fetch('/api/collect/status', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(j){
      var st = j.data, box = document.getElementById('ctlbox');
      if (box) {
        box.innerHTML = ctlHTML(st);
        wireCtl(st);
      }
      if (POLL) { clearTimeout(POLL); POLL = null; }
      if (st.running) POLL = setTimeout(refresh, 3000);   // 跑着才轮询，空闲不打扰
    });
}
function wireCtl(st){
  var b = document.getElementById('cStart');
  if (b && !st.running) b.onclick = function(){
    var body = 'count=' + encodeURIComponent(document.getElementById('cCount').value) +
      '&fresh=' + (document.getElementById('cFresh').checked ? '1' : '0') +
      '&skip_cooldown=' + (document.getElementById('cSkip').checked ? '1' : '0');
    b.disabled = true; b.textContent = '正在启动…';
    fetch('/api/collect/start', { method: 'POST', body: body })
      .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }); })
      .then(function(o){
        if (o.s !== 200) { alert('启动失败：' + ((o.j && o.j.detail) || o.s)); }
        refresh();
      });
  };
  var s2 = document.getElementById('cStop');
  if (s2 && st.running) s2.onclick = function(){
    s2.disabled = true; s2.textContent = '正在停止…';
    fetch('/api/collect/stop', { method: 'POST' })
      .then(function(r){ return r.json(); })
      .then(function(){ refresh(); });
  };
}

function draw(d){
  $('#content').innerHTML =
    '<div class="verdict"><span class="tone ok">⚙ 后台</span>' +
      '<div class="vmain"><div class="vproblem">' + esc(d.headline) + '</div>' +
      '<div class="vdetail">快照生成于 ' + esc((d.snapshot.generated_at || '').replace('T', ' ')) +
        '　（采集完要重导快照，前端才看得到新数据）</div></div></div>' +
    '<div class="sec"><div class="sechead"><span class="secno">①</span><span class="sectitle">总量</span></div>' +
      '<div class="kpis">' + d.stats.map(function(s, i){
        return '<div class="kpi' + (i === 2 ? ' accent' : '') + '"><div class="kl">' + esc(s.label) + '</div>' +
          '<div class="kv">' + esc(s.value) + '<span class="ku">' + esc(s.unit) + '</span></div>' +
          '<div class="kn">' + esc(s.note) + '</div></div>';
      }).join('') + '</div></div>' +
    '<div class="sec"><div class="sechead"><span class="secno">②</span><span class="sectitle">批次明细</span>' +
      '<span class="secnote">按榜单快照日期分批</span></div>' + batches(d) + '</div>' +
    '<div class="sec"><div class="sechead"><span class="secno">③</span><span class="sectitle">怎么接着采</span>' +
      '<span class="secnote">在宿主机项目根目录执行</span></div>' +
      d.commands.map(function(c){
        return '<div class="cmd"><div class="cl">' + esc(c.label) + '</div><code>' + esc(c.cmd) + '</code>' +
          '<div class="cn">' + esc(c.note) + '</div></div>';
      }).join('') + '</div>' +
    '<div class="sec"><div class="sechead"><span class="secno">④</span><span class="sectitle">采集控制</span>' +
      '<span class="secnote">真的会跑起来：后端执行 collect/bili.py hotlist</span></div>' +
      '<div id="ctlbox"><div class="clog">正在读采集状态…</div></div></div>';
  refresh();          // 控件是真的：进页面就把状态拉起来；跑着时每 3 秒刷
}
function fail(m){
  var cb = document.getElementById('ctlbox');
  if (cb) cb.innerHTML = '<div class="clog">采集状态取不到：' + esc(m) + '</div>';

  $('#content').innerHTML = '<div class="empty"><h2>采集状态没取到</h2><p>' + esc(m) + '</p>' +
    '<div class="row"><button class="btn primary" id="rt">重试</button></div></div>';
  $('#rt').onclick = load;
}
function load(){
  $('#content').innerHTML = '<div class="loading">正在加载采集状态…</div>';
  fetch('/api/v3/collect').then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ draw(j.data); }).catch(function(e){ fail(e.message); });
}
load();
</script>
</body>
</html>
