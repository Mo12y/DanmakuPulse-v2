<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>/* 默认深色，与全站一致；切过以 localStorage 为准。放在这里避免首帧闪一下浅色 */try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>为什么用 Spark · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<style>
/* 本页专有（共用外壳见 v3.css） */
.tlist{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.trow{display:grid;grid-template-columns:110px 112px 104px 104px 92px;gap:10px;align-items:baseline;
  padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border-subtle)}
.trow:last-child{border-bottom:0}
.trow.head{background:var(--surface-soft);font-size:12px;color:var(--text-secondary);font-weight:600}
.trow.raw{grid-template-columns:120px 82px 82px 104px 1fr}
.tname{font-weight:600}
.tnum{font-variant-numeric:tabular-nums;text-align:right;color:var(--text-secondary)}
.tnum b{color:var(--text);font-weight:700}
.tbar{height:7px;background:var(--surface-soft);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tscale{border:1px solid var(--border);border-radius:8px;background:var(--surface-soft);padding:12px 14px;
  font-size:13px;line-height:1.8;margin-top:12px}
.lim{margin:0;padding-left:20px;font-size:12.5px;color:var(--text-secondary);line-height:1.9}
.lim li{margin-bottom:5px}
.lim b{color:var(--text)}
@media (max-width:900px){
  .trow{grid-template-columns:1fr 1fr;gap:6px} .trow.head{display:none} .thide{display:none}
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <div class="main">
    <div class="wrap">
      <p class="pagesub"><b>这一页解决什么 · 给答辩组：</b>回答「为什么用 Spark」——把 12 条实测墙钟摆出来，证明分布式不是挂名</p>
      <div class="card" id="content"><div class="loading">正在加载性能实测…</div></div>
    </div>
  </div>
</div>
<script src="v3nav.js"></script>
<script>
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var bold = function(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); };
var f2 = function(v){ return v == null ? '—' : Number(v).toFixed(2); };
var int = function(v){ return v == null ? '—' : Number(v).toLocaleString(); };

function verdictHTML(d){
  return '<div class="verdict">' +
    '<span class="tone ok">● 证据</span>' +
    '<div class="vmain">' +
      '<div class="vproblem">' + esc(d.headline) + '</div>' +
      '<div class="vhead">' + esc(d.sub) + '</div>' +
      '<div class="vdetail">数据来源：' + esc(d.source) + '（' + d.n_records + ' 条实测，导出于 ' +
        esc(d.snapshot_at) + '）——由 tools/make_perf_snapshot.py 导出，页面不手抄数字。</div>' +
    '</div></div>';
}

/* ① 规模放大：同一份作业，数据量按 1/4/8 倍放大，各跑 1 路与 2 路并行 */
function scalingHTML(d){
  var rows = d.scaling.map(function(s){
    var w = function(v, mx){ return '<span class="tbar"><i style="width:' +
      (v == null || !mx ? 0 : (100 * v / mx).toFixed(1)) + '%"></i></span>'; };
    var mx = Math.max.apply(null, d.scaling.map(function(x){ return x.wall_par1 || 0; }).concat([1]));
    return '<div class="trow">' +
      '<span class="tname">放大 ' + esc(s.label) + '</span>' +
      '<span class="tnum">' + int(s.n_out) + '<span class="thide"> 条</span></span>' +
      '<span class="tnum">1 路 <b>' + f2(s.wall_par1) + 's</b>' + w(s.wall_par1, mx) + '</span>' +
      '<span class="tnum">2 路 <b>' + f2(s.wall_par2) + 's</b>' + w(s.wall_par2, mx) + '</span>' +
      '<span class="tnum">' + (s.speedup == null ? '—' : s.speedup + '×') + '</span>' +
    '</div>';
  }).join('');
  return '<div class="sec"><div class="sechead"><span class="secno">①</span>' +
      '<span class="sectitle">数据量放大 8 倍，墙钟涨多少</span>' +
      '<span class="secnote">同一份密度作业；条数 = 输出行数</span></div>' +
    '<div class="tlist"><div class="trow head"><span>倍率</span><span class="tnum">输出条数</span>' +
      '<span class="tnum">墙钟</span><span class="tnum">墙钟</span><span class="tnum">2 路加速比</span></div>' +
      rows + '</div>' +
    '<div class="tscale">' + bold(d.scaling_note) +
      '<br>换句话说：把数据放大到 8 倍，时间只涨到 ' + f2(d.wall_x_par1) +
      ' 倍（单并行）/' + f2(d.wall_x_par2) + ' 倍（双并行）—— Spark 的增量成本远低于数据增量。</div>' +
  '</div>';
}

/* ② 并行加速比：1 路 → 2 路 */
function speedupHTML(d){
  var best = d.best_speedup;
  var mx = Math.max.apply(null, d.speedups.map(function(s){ return s.x || 0; }).concat([1]));
  var rows = d.speedups.map(function(s){
    return '<div class="trow">' +
      '<span class="tname">' + esc(s.name) + '</span>' +
      '<span class="tnum">' + (s.kind === 'hawkes' ? '串行 ' : '1 路 ') + f2(s.one) + 's</span>' +
      '<span class="tnum">' + (s.kind === 'hawkes' ? '并行 ' : '2 路 ') + '<b>' + f2(s.two) + 's</b></span>' +
      '<span class="tnum"><span class="tbar"><i style="width:' +
        (s.x == null ? 0 : (100 * s.x / mx).toFixed(1)) + '%"></i></span></span>' +
      '<span class="tnum">' + (s.x == null ? '—' : s.x + '×') + '</span>' +
    '</div>';
  }).join('');
  return '<div class="sec"><div class="sechead"><span class="secno">②</span>' +
      '<span class="sectitle">并行真的省时间</span>' +
      '<span class="secnote">同一份输入，1 路 vs 2 路</span></div>' +
    '<div class="tlist"><div class="trow head"><span>作业</span><span class="tnum">基准</span>' +
      '<span class="tnum">并行后</span><span class="tnum">加速条</span><span class="tnum">加速比</span></div>' +
      rows + '</div>' +
    '<div class="tscale">加速比不是 2.00 —— 因为集群只有 **2 个核**，还有固定开销（启动、调度、写盘）。' +
      (best ? '<br>最好的一条是「' + esc(best.name) + '」：' + f2(best.one) + 's → ' + f2(best.two) +
        's，快 ' + best.x + ' 倍。' : '') +
    '</div></div>';
}

/* ③ 事件网格：事件表在不同放大下的墙钟 */
function eventsHTML(d){
  if (!d.events || !d.events.length) return '';
  var mx = Math.max.apply(null, d.events.map(function(e){ return e.wall || 0; }).concat([1]));
  var rows = d.events.map(function(e){
    return '<div class="trow" style="grid-template-columns:110px 112px 132px 132px 1fr">' +
      '<span class="tname">放大 ' + esc(e.label) + '</span>' +
      '<span class="tnum">' + f2(e.wall) + 's</span>' +
      '<span class="tnum">' + int(e.n_events) + ' 个事件</span>' +
      '<span class="tnum">' + int(e.n_series) + ' 条序列</span>' +
      '<span class="tnum"><span class="tbar"><i style="width:' +
        (100 * (e.wall || 0) / mx).toFixed(1) + '%"></i></span></span>' +
    '</div>';
  }).join('');
  return '<div class="sec"><div class="sechead"><span class="secno">③</span>' +
      '<span class="sectitle">事件检测随规模变多</span>' +
      '<span class="secnote">这一档只跑了 2 路并行</span></div>' +
    '<div class="tlist"><div class="trow head"><span>倍率</span><span class="tnum">墙钟</span>' +
      '<span class="tnum">检出事件</span><span class="tnum">序列数</span><span class="tnum">相对条</span></div>' +
      rows + '</div>' +
    '<div class="tscale">事件数随数据量同步变多（' + int(d.events[0].n_events) + ' → ' +
      int(d.events[d.events.length - 1].n_events) + ' 个），墙钟却没有同比例上涨 —— ' +
      '这说明分区并行在起效，不是把工作堆在单点上。</div></div>';
}

/* ④ 数据倾斜：加盐两阶段 */
function skewHTML(d){
  if (!d.skew) return '';
  var s = d.skew;
  return '<div class="sec"><div class="sechead"><span class="secno">④</span>' +
      '<span class="sectitle">数据倾斜：加盐两阶段</span>' +
      '<span class="secnote">分区数 ' + (s.parts == null ? '—' : s.parts) + '</span></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><div class="kl">直算</div><div class="kv">' + f2(s.plain_s) +
        '<span class="ku">s</span></div><div class="kn">单个 shuffle 阶段</div></div>' +
      '<div class="kpi accent"><div class="kl">加盐两阶段</div><div class="kv">' + f2(s.salted_s) +
        '<span class="ku">s</span></div><div class="kn">快了 ' + (s.x == null ? '—' : s.x) + ' 倍</div></div>' +
    '</div>' +
    '<div class="tscale">' + esc(s.note) + '</div></div>';
}

/* ⑤ 诚实边界 + 逐条轨迹 */
function limitsHTML(d){
  var rows = d.records.map(function(r){
    return '<div class="trow raw">' +
      '<span class="tname">' + esc(r.mode) + '</span>' +
      '<span class="tnum">amp ' + esc(r.amp == null ? '—' : r.amp) + '</span>' +
      '<span class="tnum">par ' + esc(r.par == null ? '—' : r.par) + '</span>' +
      '<span class="tnum">' + f2(r.wall_s) + 's</span>' +
      '<span class="tnum thide">' + esc(r.ts) + '</span>' +
    '</div>';
  }).join('');
  return '<div class="sec"><div class="sechead"><span class="secno">⑤</span>' +
      '<span class="sectitle">诚实边界（先读这段，再看数字）</span></div>' +
    '<ul class="lim">' + (d.limits || []).map(function(x){ return '<li>' + bold(x) + '</li>'; }).join('') +
      '<li>本页所有数字来自 <b>' + esc(d.suite) + '</b>；不重跑、不挑好看的。</li></ul>' +
    '<div class="sechead" style="margin-top:18px"><span class="secno">⑥</span>' +
      '<span class="sectitle">逐条实测轨迹</span>' +
      '<span class="secnote">' + esc(d.records_note) + '</span></div>' +
    '<div class="tlist"><div class="trow raw head"><span>作业</span><span class="tnum">倍率</span>' +
      '<span class="tnum">并行</span><span class="tnum">墙钟</span>' +
      '<span class="tnum thide">记录时间</span></div>' + rows + '</div></div>';
}

function draw(d){
  $('#content').innerHTML =
    verdictHTML(d) + scalingHTML(d) + speedupHTML(d) + eventsHTML(d) + skewHTML(d) + limitsHTML(d);
}

function fail(msg){
  $('#content').innerHTML = '<div class="empty"><h2>性能实测没取到</h2>' +
    '<p>' + esc(msg) + '</p>' +
    '<div class="row"><button class="btn primary" id="rt">重试</button></div></div>';
  var b = $('#rt');
  if (b) b.onclick = load;
}

function load(){
  $('#content').innerHTML = '<div class="loading">正在加载性能实测…</div>';
  fetch('/api/v3/spark')
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ draw(j.data); })
    .catch(function(e){ fail('接口没有返回可用数据（' + e.message + '）。'); });
}
load();
</script>
</body>
</html>
