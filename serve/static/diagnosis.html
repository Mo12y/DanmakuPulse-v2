<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>/* 默认深色，与全站一致；切过以 localStorage 为准。放在这里避免首帧闪一下浅色 */try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频节奏诊断卡 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<script src="vendor/echarts.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="v3chart.js"></script>
<script src="v3nav.js"></script>
<link rel="stylesheet" href="v3.css">
<style>
/* 页面专有样式（共用外壳见 v3.css） */
#shot{padding:0}
.poshero{font-size:17px;font-weight:700;margin-bottom:4px}
.possub{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.posrow{display:grid;grid-template-columns:96px 1fr 96px 150px;gap:12px;align-items:center;
  padding:7px 0;font-size:13px}
.posrow+.posrow{border-top:1px dashed var(--border)}
.poslab{font-weight:600;font-size:13px}
.postrack{position:relative;height:7px;background:var(--surface-soft);border-radius:4px}
.postrack i{position:absolute;top:-3px;width:3px;height:13px;border-radius:2px;background:var(--accent)}
.postrack b{position:absolute;left:50%;top:-2px;width:1px;height:11px;background:var(--text-tertiary)}
.posval{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.poshuman{color:var(--text-secondary);font-size:12.5px}
#chart{height:400px;width:100%}
.chartcap{font-size:13.5px;color:var(--text);background:var(--accent-soft);border-radius:10px;
  padding:10px 14px;margin-top:6px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin-bottom:8px}
.legend i{display:inline-block;width:22px;height:0;border-top-width:3px;border-top-style:solid;
  vertical-align:middle;margin-right:6px}
.legend .sw{display:inline-block;width:16px;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}
.peaks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;
  background:var(--card);transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease}
.chip:hover,.chip.on{border-color: var(--accent-ink);color: var(--accent-ink);background:var(--accent-soft)}
.dmpanel{margin-top:12px;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface-soft)}
.dmpanel h4{font-size:13px;margin-bottom:8px;font-weight:700}
.dmpanel ul{margin-left:18px;font-size:13px;color:var(--text)}
.dmpanel li{margin:2px 0}
.dev{border:1px solid var(--border);border-radius:13px;padding:15px 17px;margin-bottom:11px;background:var(--card);
  cursor:pointer;transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease}
.dev:hover{border-color: var(--accent-ink);box-shadow:var(--shadow)}
.dev.dim{border-color: var(--accent-ink);background:var(--accent-soft)}
.devtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.devname{font-size:15px;font-weight:700}
.cmp{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.cmp>span:last-child{display:block;background:var(--surface-soft);border-radius:5px;height:16px;overflow:hidden}
.cmp .b{display:block;height:16px;border-radius:5px;min-width:3px}
.cmp .bl{color:var(--text-secondary);text-align:right}
.cmp .mid{background:var(--text-secondary);opacity:.45}
.cmp .you{background:var(--accent)}
.devtext{font-size:14px;margin:8px 0 6px}
.devadv{font-size:13.5px;color:var(--text);background:var(--surface-soft);border-left:3px solid var(--accent);
  border-radius:0 9px 9px 0;padding:9px 13px;margin-top:8px}
.devadv b{color: var(--accent-ink)}
.devfoot{font-size:12px;color:var(--text-tertiary);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bcard{border:1px solid var(--border);border-radius:13px;padding:15px 16px;background:var(--card);
  display:flex;flex-direction:column;cursor:pointer;transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease}
.bcard:hover{border-color: var(--accent-ink);box-shadow:var(--shadow)}
.bcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.btitle{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bsim{font-size:12px;color: var(--accent-ink);font-weight:700;margin-bottom:8px}
.blike{font-size:13px;color:var(--text);margin-bottom:9px;flex:1}
.bout{font-size:13.5px;font-weight:700;color:var(--success)}
.bout.none{color:var(--text-tertiary);font-weight:500;font-size:12.5px}
.blearn{font-size:12.5px;color:var(--text-secondary);border-top:1px dashed var(--border);padding-top:9px;margin-top:9px}
.bgo{font-size:12.5px;color: var(--accent-ink);font-weight:700;margin-top:9px}
.act{display:flex;gap:13px;padding:12px 0}
.act+.act{border-top:1px dashed var(--border)}
.actn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.actt{flex:1;font-size:14.5px;line-height:1.6}
.actb{font-size:12.5px;color:var(--text-tertiary);margin-top:4px}
.caveat{font-size:12.5px;color:var(--text-secondary);background:var(--surface-soft);border-radius:10px;
  padding:11px 14px;margin-top:14px}
/* 可点关键词：结论 → 证据 */
.jump{color: var(--accent-ink);cursor:pointer;border-bottom:1px dashed var(--accent);transition: color .12s ease, border-color .12s ease}
.jump:hover{background:var(--accent-soft);border-radius:4px}
.vproblem .jump{border-bottom-width:2px}
.jumphint{font-size:12.5px;color:var(--text-tertiary);margin-top:6px}
/* 在线诊断徽章（库外视频）：把"这是现采的、与库内差在哪"摆在最上面 */
.livebar{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;
  padding:10px 14px;font-size:13px;color:var(--text);margin-bottom:8px;line-height:1.7}
.ltag{display:inline-block;background:var(--accent);color:var(--on-accent);font-size:11px;
  font-weight:700;border-radius:999px;padding:2px 8px;margin-right:8px;vertical-align:1px}
.livenotes{margin:0 0 12px;padding:0 0 0 18px;font-size:12px;color:var(--text-secondary);line-height:1.85}
.livenotes li{margin-bottom:2px}
/* 对标细节面板：贴着对标区，不占用下面的弹幕证据位 */
.bdpanel{margin-top:12px;border:1px solid var(--accent-line);border-radius:8px;
  background:var(--accent-soft);padding:12px 14px;font-size:13px;line-height:1.85}
.bdhead{font-weight:600;margin-bottom:6px}
.bdrow{color:var(--text-secondary)}
.bdk{display:inline-block;min-width:64px;color:var(--text-tertiary);font-size:12px}
.bdnote{color:var(--text-tertiary);font-size:12px;margin-left:10px}

/* 点击互动：滚过去的区块闪一下，让"跳到哪了"看得见（§1.2.3 C4：只动 opacity/背景，不动布局） */
.flash{border-radius:8px;animation:v3flash 1.4s ease-out}
@keyframes v3flash{
  0%,26%{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-line)}
  100%{background:transparent;box-shadow:0 0 0 0 transparent}
}

/* ML 可信度三签名（精确 / 出处 / 诚实）——都在主视图，不藏技术层 */
.devnum{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;margin:8px 0 4px;
  font-size:13px;color:var(--text-secondary)}
.devnum b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.devnum .du{font-size:12px;color:var(--text-tertiary)}
.devbadges{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.bdg{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;
  background:var(--surface-soft);color:var(--text-secondary);border:1px solid var(--border-subtle);
  cursor:help}
.honest{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--surface-soft);
  border:1px solid var(--border-subtle);font-size:12px;line-height:1.9;color:var(--text-secondary)}
.honest b{color:var(--text);margin-right:8px}
.honest span{display:block}

/* 证据面板：该时段的弹幕 */
.dmcmp{display:flex;gap:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;margin-bottom:10px;font-size:13px;align-items:baseline}
.dmcmp b{font-size:19px;font-variant-numeric:tabular-nums}
.dmcmp .u b{color: var(--accent-ink)} .dmcmp .p b{color:var(--text-secondary)}
.dmwhy{font-size:12.5px;color:var(--text-secondary);margin-bottom:10px}
.dmlist{max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:10px;
  background:var(--card);padding:6px 12px}
.dmline{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13px;padding:4px 0;
  border-bottom:1px dashed var(--border)}
.dmline:last-child{border-bottom:0}
.dmline .dt{color:var(--text-tertiary);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.dmempty{font-size:13px;color:var(--text-secondary);padding:14px 4px}
/* 行动建议可点 */
.act{cursor:pointer;border-radius:8px;transition: background-color .12s ease, border-color .12s ease}
.act:hover{background:var(--accent-soft)}
.act.dim{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);border-radius:8px}
.actmore{font-size:12px;color: var(--accent-ink);font-weight:700;margin-top:5px}
/* 空状态 */
.empty{padding:56px 24px;text-align:center}
.empty h2{font-size:23px;font-weight:800;margin-bottom:10px}
.empty p{color:var(--text-secondary);font-size:14px;margin-bottom:20px;line-height:1.9}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty .eg{margin-top:22px;font-size:12.5px;color:var(--text-tertiary)}
.hideWhenEmpty{display:none!important}
/* ── 滚动叙事：顶部导轨（我在看第几段）+ 逐段展开 ──
   为什么要有：诊断卡很长，"我在哪一段"本身就是可读性的一部分；
   导轨同时是跳转入口（§1#10 可点元素键盘可达 —— 用的是 <a>）。
   ⚠️ 逐段展开只在 JS 接管且未开启 reduced-motion 时启用（见 initNarrative），
   否则默认全可见 —— 不许出现"JS 挂了整页空白"。 */
.rail{position:sticky;top:8px;z-index:6;display:flex;gap:2px;flex-wrap:wrap;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 6px;
  margin-bottom:12px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.rail[hidden]{display:none}
.rail a{font-size:12px;color:var(--text-secondary);padding:3px 10px;border-radius:999px;
  text-decoration:none;transition:color .15s ease,background-color .15s ease}
.rail a:hover{color:var(--text);background:var(--surface-hover);text-decoration:none}
.rail a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.reveal{opacity:0;transform:translateY(12px)}
.reveal.in{opacity:1;transform:none;
  transition:opacity .4s ease-out,transform .4s ease-out}
/* 技术层里的参数敏感性控件（主卡绝不出现） */
.sensrow{display:grid;grid-template-columns:150px 150px 1fr;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.sensrow:last-child{border-bottom:0}
.sensrow input[type=range]{width:140px;accent-color: var(--accent-ink)}
.sensrow .sl{color:var(--text);font-weight:600}
.sensrow .sl b{color: var(--accent-ink);font-variant-numeric:tabular-nums}
.sensout{color:var(--text-secondary)}
.sensout b{color:var(--text)}
.sensout .cur{color: var(--accent-ink);font-weight:700}
@media (max-width:720px){ .sensrow{grid-template-columns:1fr;gap:6px} }
@media (max-width:720px){
  .posrow{grid-template-columns:74px 1fr 84px;gap:9px}
  .poshuman{display:none}
  #chart{height:300px}
}

/* ── AI 报告解读（基于这张诊断卡给出可执行建议）──
   闸与提示词约束都在后端（serve/ai_report.py）；界面只显示状态与**已用量**。 */
.aicard{margin-top:var(--card-gap);border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);box-shadow:var(--shadow);padding:20px 22px}
.aihead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.aititle{font-size:15px;font-weight:600}
.aistate{font-size:12px;color:var(--text-tertiary)}
.airep{font-size:14.5px;line-height:1.95;margin:8px 0 14px;white-space:pre-wrap}
.aiadv{background:var(--surface-soft);border-left:3px solid var(--accent-line);
  border-radius:0 8px 8px 0;padding:11px 14px;font-size:13.5px;line-height:1.9}
.aiadv b{color:var(--accent-ink)}
.aiadv ol{margin:6px 0 0 20px}
.aiadv li{margin:3px 0}
.aigate{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);
  margin-top:12px;line-height:1.8}
.aigate b{color:var(--text);font-variant-numeric:tabular-nums}
.aibar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ══════════════════════════════════════════════════════════════
   精彩时刻检测（2026-10-19 转向）：主视图五块 + 旧诊断折叠层
   只用既有 token（v3.css）；不新增 token、不新增页面。
   ══════════════════════════════════════════════════════════════ */
.hlhead{padding:22px 24px 14px;border-bottom:1px solid var(--border-subtle)}
.hlhead .vtitle{margin-bottom:6px}
.hlhead .vmeta{margin-bottom:10px}
.hlbadges{display:flex;gap:6px;flex-wrap:wrap}
.hlnotice{font-size:12.5px;color:var(--text-secondary);background:var(--surface-soft);
  border:1px solid var(--border-subtle);border-radius:8px;padding:9px 13px;margin-bottom:12px;line-height:1.8}
.hlempty{font-size:13px;color:var(--text-secondary);padding:12px 0 4px;line-height:1.9}
.hllegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);
  margin-bottom:8px;align-items:center}
.hllegend i{display:inline-block;vertical-align:middle;margin-right:6px}
.hllegend .swl{width:20px;height:0;border-top:3px solid var(--primary)}
.hllegend .swt{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:10px solid var(--accent)}
.hllegend .swb{width:16px;height:10px;border-radius:3px;background:var(--primary-tint);
  border:1px solid var(--primary-line)}
#hlchart{height:230px;width:100%}
.hljumps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;max-height:120px;overflow:auto}
.hljump{border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:12px;
  cursor:pointer;background:var(--card);color:var(--text-secondary);font-family:inherit;
  transition:border-color .15s ease,color .15s ease,background-color .15s ease}
.hljump:hover,.hljump.on{border-color:var(--accent-ink);color:var(--accent-ink);background:var(--accent-soft)}
.hljump.crit:hover,.hljump.crit.on{border-color:var(--primary-strong);color:var(--primary-strong);
  background:var(--primary-soft)}
#hlpanel{margin-top:4px}
/* ② 从众 / 中性 / 批判 占比条 */
.ratio{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-soft);
  border:1px solid var(--border-subtle)}
.ratio i{display:block;height:100%}
.ratio .herd{background:var(--chart-axis)}
.ratio .neutral{background:var(--text-tertiary);opacity:.4}
.ratio .crit{background:var(--accent)}
.ratioline{font-size:14.5px;font-weight:600;margin:12px 0 6px;line-height:1.7}
.ratioline b{color:var(--accent-ink)}
.ratiolegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin-top:6px}
.ratiolegend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;
  vertical-align:middle}
.ratiolegend .sw.herd{background:var(--chart-axis)}
.ratiolegend .sw.neutral{background:var(--text-tertiary);opacity:.4}
.ratiolegend .sw.crit{background:var(--accent)}
/* ③ 切片建议 / 高光定位 */
.hlslices{display:grid;gap:8px}
.hlslice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;text-align:left;
  background:var(--surface-soft);border:1px solid var(--border-subtle);border-radius:10px;
  padding:11px 14px;font-family:inherit;color:var(--text);cursor:pointer;font-size:13.5px;
  transition:border-color .15s ease,background-color .15s ease}
.hlslice:hover,.hlslice.on{border-color:var(--accent-line);background:var(--accent-tint)}
.hlsn{flex:0 0 24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hlst{font-weight:600;font-size:14px}
.hlsm{color:var(--text-secondary);font-size:12.5px}
.hlstime{color:var(--text-tertiary);font-size:12px;font-variant-numeric:tabular-nums;margin-left:auto}
.hlrep{flex:1 1 100%;font-size:12px;color:var(--text-secondary);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hlrep b{color:var(--text);font-weight:600}
.hlpanelnote{font-size:12px;color:var(--text-tertiary);margin-top:9px}
.hlsen{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary)}
.hlsen b{color:var(--text);font-variant-numeric:tabular-nums}
/* ④ 共振强度对标 */
.hlpbar{position:relative;height:10px;border-radius:6px;background:var(--surface-soft);
  border:1px solid var(--border-subtle);margin:16px 0 6px}
.hlpbar i{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:var(--accent)}
.hlpbar b{position:absolute;left:50%;top:-3px;width:1px;height:16px;background:var(--text-tertiary)}
.hlpaxis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-tertiary)}
/* 诚实边界（常驻主视图，不折叠） */
.hlhonestwrap{padding:0 24px 22px}
.hlhonestwrap .honest{margin-top:16px}
/* 仅供读屏的 h1（视觉上不占位；页面主标题是功能名，不是装饰） */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* 旧诊断卡折叠层：默认收起，展开后原有交互照旧 */
.oldcard{border-top:1px solid var(--border)}
.oldcard>summary{cursor:pointer;padding:16px 24px;font-size:13.5px;font-weight:600;
  color:var(--text-secondary);background:var(--surface-soft);
  border-bottom:1px solid var(--border-subtle);
  transition:color .15s ease,background-color .15s ease}
.oldcard>summary:hover{color:var(--text);background:var(--surface-hover)}
.oldcard[open]>summary{color:var(--text)}
.oldcard .oldbody>.verdict{padding-top:20px}
@media (max-width:720px){
  .hlhead{padding:16px}
  .hlhonestwrap{padding:0 16px 16px}
  .hlstime{display:none}
  #hlchart{height:200px}
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <main class="main">
    <div class="wrap">
      <h1 class="sr-only">精彩时刻检测 · 视频节奏诊断</h1>
      <p class="pagesub"><b>精彩时刻检测</b> · 弹幕共振峰与质疑段的秒级定位，长视频出切片、短视频出高光</p>

  <div class="toolbar">
    <input id="search" placeholder="输入 BV 号诊断任意视频（库外的自动在线采集）" style="flex:1 1 260px;min-width:200px" autocomplete="off">
    <select id="picker" style="flex:1 1 280px;min-width:190px" hidden></select>
    <button class="btn" id="randBtn" title="随机换一支同类视频">随机一支</button>
    <button class="btn" id="favBtn" title="收藏这支视频，之后在「我的收藏」里能直接点开">☆ 收藏这支</button>
    <button class="btn primary" id="shotBtn" title="把这张诊断卡存成图片">存为图片</button>
    <button class="btn" id="printBtn" title="按 A4 打印或导出 PDF（工具栏与技术层不印）">打印 / 导出 PDF</button>
    <button class="btn" id="aiBtn" title="基于这张诊断卡给出可执行建议">✦ AI 解读</button>
  </div>

  <div id="livebadge" hidden></div>

  <nav class="rail" id="rail" aria-label="诊断卡段落导航" hidden></nav>

  <div class="card" id="shot">
    <div id="content"><div class="loading">正在加载诊断快照…</div></div>
  </div>

  <!-- AI 报告解读面板：放在诊断卡之外，避免与卡片内容互相挤占 -->
  <div id="aipanel" hidden></div>
</div>

<script>
const $ = s => document.querySelector(s);

/* ══════════════════════════════════════════════════════════════
   在线诊断（库外 bvid）：真的去采集这支视频，而不是加载别的视频
   ══════════════════════════════════════════════════════════════ */
var LIVE = null;          // 在线元信息（采集条数/时间/诚实说明）；库内视频为 null
var liveTimer = null;

function isBv(s){ return /^BV[0-9A-Za-z]{10}$/.test(s); }

function setLiveBadge(meta){
  LIVE = meta;
  var el = document.getElementById('livebadge');
  if (!el) return;
  if (!meta || !meta.live) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '<div class="livebar"><span class="ltag">在线采集</span>' +
    '这不是库内视频：本次实时采到 <b>' + meta.n_collected + '</b> 条弹幕（' + meta.segments + ' 段）' +
    '，采集于 ' + esc(meta.collected_at) + '。</div>' +
    '<ul class="livenotes">' + (meta.notes || []).map(function(n){
      return '<li>' + n.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</li>'; }).join('') + '</ul>';
}

function loadLive(bvid){
  $('#content').innerHTML = '<div class="loading">正在采集这支视频的弹幕并算节奏…' +
    '<br><span style="font-size:12px">库外视频走在线采集（几秒到十几秒），采完再与库内基线比对</span></div>';
  document.getElementById('rail') && (document.getElementById('rail').hidden = true);
  resetAI();
  fetch('/api/live_diagnose?bvid=' + encodeURIComponent(bvid), { cache: 'no-store' })
    .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }); })
    .then(function(o){
      if (o.s !== 200 || o.j.code !== 0) {
        liveFail(bvid, (o.j && (o.j.detail || o.j.error)) || ('HTTP ' + o.s));
        return;
      }
      CUR = o.j.data;
      setName(true);
      var u = new URLSearchParams(location.search);
      u.set('bvid', bvid); u.delete('drill'); u.delete('bench'); u.delete('act');
      history.replaceState(null, '', '?' + u.toString());
      LIVE = o.j.meta;
      DIGEST = null;
      HL = null; HLMETA = null;
      HLERR = {status: 404, live: true, detail: '库外在线采集的视频不在精彩时刻检测快照里（检测按采集批次计算）'};
      api('/api/danmaku_digest?bvid=' + encodeURIComponent(bvid)).then(function(x){ DIGEST = x; }).catch(function(){});
      render();
      setLiveBadge(o.j.meta);
    })
    .catch(function(e){ liveFail(bvid, e.message); });
}

function liveFail(bvid, msg){
  LIVE = null;
  $('#content').innerHTML =
    '<div class="empty">' +
      '<h2>这支视频诊断不了</h2>' +
      '<p><b>' + esc(bvid) + '</b><br>' + esc(msg) + '</p>' +
      '<p style="font-size:13px;color:var(--text-secondary)">在线诊断需要现场采集弹幕；' +
      '采不到就没有节奏可算。<b>不会拿别的视频冒充它。</b></p>' +
      '<div class="row">' +
        '<button class="btn primary" id="lfRetry">重试一次</button>' +
        '<button class="btn" id="lfRand">随机一支</button>' +
      '</div></div>';
  document.getElementById('lfRetry').onclick = function(){ loadLive(bvid); };
  document.getElementById('lfRand').onclick = loadRandom;
}


/* 点击互动：平滑滚动 + 闪一下（视觉强引导）。点了不动是 bug，不是"设计克制"。 */
function focusSection(id){
  var el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('flash');
  void el.offsetWidth;                    // 强制回流，保证连续点击也能重放动画
  el.classList.add('flash');
  setTimeout(function(){ el.classList.remove('flash'); }, 1400);
}

const api = async p => { const r = await fetch(p);
  if (!r.ok) { const j = await r.json().catch(() => ({}));
    const e = new Error(j.detail || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return (await r.json()).data; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => { if (s == null) return ''; s = Math.round(s); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const TONE = { warn:['需要调整','warn'], ok:['节奏健康','ok'] };
const DMCOLOR = { good:'var(--success)', bad:'var(--danger-ink)', neutral:'var(--text-secondary)' };

let IDX = [], CUR = null, CHART = null, FOCUS = null, BENCH = null, PEAK = null, DIGEST = null;
/* 精彩时刻检测载荷（新端点 /api/video/{bvid}/highlights）。
   用 var 声明：验收/调试时可在控制台注入 mock 再 render()，不必改文件。 */
var HL = null, HLERR = null, HLMETA = null, HCHART = null;

/* ── 启动 ── */
const EXAMPLE = {bvid: 'BV1PJpE6QEx6', why: '电子竞技区，开场吸引力只有同类的 42%——正好用来演示"点结论 → 看这一段观众在刷什么"'};

(async function init(){
  const usp = new URLSearchParams(location.search);
  try {
    IDX = await api('/api/diagnosis/index');
    fillPicker();
    const want = usp.get('bvid');
    if (want && IDX.some(x => x.bvid === want)) {
      $('#picker').value = want;
      setName(true);
      await load(want);
    } else if (want) {
      // 库外 BV 号：走**在线采集**真的诊断它（P0 核心修复）。
      // 旧行为是回一句「没找到」或（更早）默默加载一支无关的库内视频。
      setName(true);
      await loadLive(want);
    } else {
      emptyState();
    }
  } catch(e) {
    failState((e && e.message) || String(e), null);   // 列表没取到 -> 错误态，不是空白页
  }
})();

/* 工具条上的按钮只在真的有卡片时才出现 */
function setName(has){
  var lb = document.getElementById('livebadge'); if (lb && !has) { lb.hidden = true; lb.innerHTML = ''; }
  ['#favBtn', '#shotBtn', '#randBtn', '#aiBtn'].forEach(function(k){
    const el = $(k); if (el) el.classList.toggle('hideWhenEmpty', !has);
  });
}

/* 空状态：没给 bvid 时给一个"试试这个视频"，降低试用门槛 */
/* 空态与错误态：接口没结果 / 接口挂了，都必须给明确交代，不许停在"正在算…" */
function notFound(bvid){
  $('#content').innerHTML =
    '<div class="empty">' +
      '<h2>没找到这个视频</h2>' +
      '<p><b>' + esc(bvid) + '</b> 不在节奏诊断快照里。<br>' +
      '只覆盖已采集并跑完节奏分析的视频（当前 803 支），不是所有 B 站视频都在里面。</p>' +
      '<div class="row">' +
        '<button class="btn primary" id="nfTry">换一支试试</button>' +
        '<button class="btn" id="nfRand">随机一支</button>' +
      '</div>' +
      '<div class="eg">也可以直接搜标题 / 分区，或点「随机一支」。</div>' +
    '</div>';
  $('#nfTry').onclick = function(){ setName(true); load(EXAMPLE.bvid); };
  $('#nfRand').onclick = loadRandom;
}

function failState(msg, bvid){
  $('#content').innerHTML =
    '<div class="empty">' +
      '<h2>诊断卡没能加载出来</h2>' +
      '<p>接口返回：' + esc(msg) + '<br>' +
      '这不是"这支视频没问题"，而是"这次没取到数据"——请重试；' +
      '若持续失败，多半是后端服务或快照没起来。</p>' +
      '<div class="row"><button class="btn primary" id="fsRetry">重试</button></div>' +
    '</div>';
  $('#fsRetry').onclick = function(){ if (bvid) load(bvid); };
}

function emptyState(){
  setName(false);
  const r = document.getElementById('rail'); if (r) r.hidden = true;
  $('#content').innerHTML =
    '<div class="empty">' +
      '<h2>输入 BV 号，开始节奏诊断</h2>' +
      '<p>诊断卡给四样东西：<b>市场定位</b>（你在同类里排第几）、<b>偏离</b>（哪几维和同类不一样）、' +
      '<b>对标视频</b>（节奏最像的几支，以及它们后来的表现）、<b>建议</b>（照着哪一支的哪一段做）。<br>' +
      '没有目标视频就用下面这个例子——它是真实采集的。</p>' +
      '<div class="row">' +
        '<button class="btn primary" id="tryBtn" style="padding:11px 22px;font-size:14.5px">试试这个视频</button>' +
        '<button class="btn" id="pickBtn" style="padding:11px 22px;font-size:14.5px">随机一支</button>' +
      '</div>' +
      '<div class="eg">例：' + esc(EXAMPLE.bvid) + '　' + esc(EXAMPLE.why) + '</div>' +
    '</div>';
  $('#tryBtn').onclick = function(){ $('#picker').value = EXAMPLE.bvid; setName(true); load(EXAMPLE.bvid); };
  $('#pickBtn').onclick = loadRandom;
}

function fillPicker(){
  const groups = {};
  IDX.forEach(x => { (groups[x.tname || '未知分区'] = groups[x.tname || '未知分区'] || []).push(x); });
  let h = '';
  Object.keys(groups).sort().forEach(t => {
    h += '<optgroup label="' + esc(t) + '（' + groups[t].length + '）">';
    groups[t].forEach(x => {
      h += '<option value="' + x.bvid + '">' + esc((x.title || '').slice(0, 40)) + '</option>';
    });
    h += '</optgroup>';
  });
  $('#picker').innerHTML = h;
}
$('#picker').onchange = e => load(e.target.value);
/* 输入处理（2026-10-16 重写）
   ⚠️ 旧实现的 bug：拿输入当**子串**去模糊匹配库内 bvid ——
      输一个库外 BV 号，find 返回空、什么都不发生；输 'BV1' 这种前缀，
      会默默加载库里第一支含 'BV1' 的视频。看起来像"诊断了"，其实诊断的不是它。
   现在：完整 BV 号 → 库内直读 / 库外**在线采集**；非 BV 号 → 按标题/分区模糊匹配。 */
$('#search').oninput = e => {
  const raw = e.target.value.trim();
  const q = raw.toLowerCase();
  if (liveTimer) { clearTimeout(liveTimer); liveTimer = null; }
  if (!q) return;
  if (isBv(raw)) {
    if (IDX.some(x => x.bvid === raw)) { $('#picker').value = raw; setName(true); load(raw); }
    else { liveTimer = setTimeout(() => loadLive(raw), 500); }   // 打字中途别每键都发采集请求
    return;
  }
  const hit = IDX.find(x => (x.title || '').toLowerCase().includes(q) ||
                            (x.tname || '').toLowerCase().includes(q));
  if (hit) { $('#picker').value = hit.bvid; setName(true); load(hit.bvid); }
};
/* 「随机一支」：库内随机抽一支看诊断卡。工具栏 / 空态 / 错误态共用同一个入口。
   （2026-10-16：按用户要求去掉「从列表里挑」—— 再弹一个下拉列表是多余的一步。） */
function loadRandom(){
  if (!IDX.length) return;
  const x = IDX[Math.floor(Math.random() * IDX.length)];
  $('#picker').value = x.bvid;
  setName(true);
  load(x.bvid);
}
$('#randBtn').onclick = loadRandom;
// 主题由统一顶栏（v3nav.js）管；切完通知本页重画图表
V3.onTheme = () => {
  if (HCHART) { HCHART.dispose(); HCHART = null; }
  if (HL) drawHLChart();
  if (CHART) { CHART.dispose(); CHART = null; drawChart(); }
};

// 收藏（登录后才有意义；接口 401 时按钮自己隐藏）
function refreshFav(){
  const b = $('#favBtn'); if (!b || !CUR) return;
  fetch('/api/favorites/status?bvid=' + encodeURIComponent(CUR.video.bvid), {credentials:'same-origin'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { b.textContent = j.data.favorited ? '★ 已收藏' : '☆ 收藏这支'; })
    .catch(() => { b.style.display = 'none'; });
}
$('#favBtn').onclick = () => {
  if (!CUR) return;
  fetch('/api/favorites', {method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({bvid: CUR.video.bvid})})
    .then(r => r.json()).then(j => {
      if (j.data) { $('#favBtn').textContent = j.data.favorited ? '★ 已收藏' : '☆ 收藏这支'; }
      if (window.V3 && V3.toast) V3.toast(j.data && j.data.favorited ? '已加入我的收藏' : '已取消收藏');
    }).catch(() => {});
};
$("#printBtn").onclick = function(){ window.print(); };

$('#shotBtn').onclick = async () => {
  const btn = $('#shotBtn'); btn.textContent = '生成中…'; btn.disabled = true;
  try {
    const node = $('#shot');
    const canvas = await html2canvas(node, {backgroundColor: getComputedStyle(document.body).backgroundColor,
      scale: 2, useCORS: true, windowWidth: node.scrollWidth});
    const a = document.createElement('a');
    a.download = '节奏诊断卡_' + (CUR ? CUR.video.bvid : 'video') + '.png';
    a.href = canvas.toDataURL('image/png'); a.click();
  } catch(e) { alert('存图失败：' + e.message); }
  btn.textContent = '存为图片'; btn.disabled = false;
};

/* 原始响应（要状态码与 meta）：诊断侧沿用 api() 会丢 meta；精彩时刻要靠状态码决定空态文案 */
function apiFull(p){
  return fetch(p, {cache: 'no-store', credentials: 'same-origin'}).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      return {ok: r.ok, status: r.status, j: j};
    });
  });
}

/* ── 加载一支视频 ──
   同时取两张卡：① /diagnosis 既有节奏诊断（收进折叠层）② /highlights 精彩时刻（新）。
   两者独立失败：诊断取不到才报错；精彩时刻取不到只在主视图显示明确空态，整页照常可用。 */
async function load(bvid){
  $('#content').innerHTML = '<div class="loading">正在算精彩时刻与节奏诊断…</div>';
  FOCUS = null; BENCH = null; PEAK = null;
  HL = null; HLERR = null; HLMETA = null;
  LIVE = null; setLiveBadge(null);
  const rail0 = document.getElementById('rail'); if (rail0) rail0.hidden = true;
  resetAI();
  let dp, hp;
  try {
    const rs = await Promise.allSettled([
      apiFull('/api/video/' + encodeURIComponent(bvid) + '/diagnosis'),
      apiFull('/api/video/' + encodeURIComponent(bvid) + '/highlights')
    ]);
    dp = rs[0]; hp = rs[1];
  } catch (e) {
    failState((e && e.message) || String(e), bvid);
    return;
  }
  if (dp.status === 'rejected') {
    failState((dp.reason && dp.reason.message) || '网络错误', bvid);
    return;
  }
  const rd = dp.value;
  if (!rd.ok) {
    if (rd.status === 404) notFound(bvid);
    else failState((rd.j && (rd.j.detail || rd.j.error)) || ('HTTP ' + rd.status), bvid);
    return;
  }
  CUR = rd.j.data;
  if (hp.status === 'fulfilled') {
    const rh = hp.value;
    if (rh.ok && rh.j && rh.j.code === 0 && rh.j.data) {
      HL = rh.j.data;
      HLMETA = rh.j.meta || null;
    } else {
      HLERR = {status: rh.status, detail: (rh.j && (rh.j.detail || rh.j.error)) || ('HTTP ' + rh.status)};
    }
  } else {
    HLERR = {status: 0, detail: (hp.reason && hp.reason.message) || '网络错误'};
  }
  // 悬停要即时：弹幕摘要一次取回（≤101 行），不在 hover 里发请求
  DIGEST = null;
  api('/api/danmaku_digest?bvid=' + encodeURIComponent(bvid)).then(x => { DIGEST = x; }).catch(() => {});
  // 只改 bvid，保留 drill/bench/act —— 直接写 '?bvid=...' 会把深链接参数洗掉
  var u = new URLSearchParams(location.search);
  u.set('bvid', bvid);
  history.replaceState(null, '', '?' + u.toString());
  render();
}


/* ══════════════════════════════════════════════════════════════
   精彩时刻检测（2026-10-19 转向）—— 主视图五块
   数据：/api/video/{bvid}/highlights（新端点）；/diagnosis 只提供密度曲线与旧诊断卡。
   ⚠️ 图表配色一律走 dmChart()（canvas 不认 CSS 变量）；页面 HTML/CSS 只用 var(--token)。
   ══════════════════════════════════════════════════════════════ */

/* ── 小工具 ── */
function hlDur(){
  if (HL && HL.duration) return HL.duration;
  if (CUR && CUR.video && CUR.video.duration) return CUR.video.duration;
  if (CUR && CUR.curve && CUR.curve.duration) return CUR.curve.duration;
  return 0;
}
function numOr(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
function fmtN(n){ return (n == null || isNaN(n)) ? '—' : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function pctOfSec(sec, dur){ if (!dur || sec == null) return 0; return Math.max(0, Math.min(100, sec / dur * 100)); }
function roundSec(s){ return s == null ? 0 : Math.round(s); }
function ratioToPct(v){
  var n = numOr(v);
  if (n == null) return null;
  return n <= 1.0001 ? n * 100 : n;
}
function hlRatioText(v){
  var p = ratioToPct(v);
  return p == null ? '—' : Math.round(p) + '%';
}
function isLongHL(){
  if (HL && typeof HL.is_long === 'boolean') return HL.is_long;
  return hlDur() > 1800;
}

/* 地址栏状态：?peak=N 共振峰 / ?seg=N 质疑段 / ?slice=N 切片 / ?high=N 高光 */
function markHL(k, v){
  var u = new URLSearchParams(location.search);
  ['peak', 'seg', 'slice', 'high'].forEach(function(x){ u.delete(x); });
  if (k) u.set(k, v);
  history.replaceState(null, '', '?' + u.toString());
}
/* 旧诊断曲线图在折叠层里：展开后才画（收起时容器宽高为 0） */
function openOldcard(){
  var old = document.getElementById('oldcard');
  if (!old) return;
  if (!old.open) old.open = true;
  drawChart();
}

/* ── 主视图头部：这是哪支视频（BV 号对人是乱码，标题才是） ── */
function hlHeadHTML(d){
  var v = (d && d.video) || {};
  var meta = [v.up_name, v.tname,
    v.duration_text ? '时长 ' + v.duration_text : '',
    v.n_danmaku ? '弹幕 ' + fmtN(v.n_danmaku) + ' 条' : '',
    v.play_text ? '播放 ' + v.play_text : ''].filter(Boolean).join(' · ');
  var badges = '';
  if (HL) {
    badges += '<span class="pill lv">' + (isLongHL() ? '长视频 · 给切片位置' : '短视频 · 给高光位置') + '</span>';
    if (HL.batch_date) badges += '<span class="pill lv">批次 ' + esc(HL.batch_date) + '</span>';
    var np = (HL.peaks || []).length;
    badges += '<span class="pill lv">共振峰 ' + np + ' 个</span>';
    var ns = (HL.critique && HL.critique.segments) ? HL.critique.segments.length : 0;
    badges += '<span class="pill lv">质疑段 ' + ns + ' 段</span>';
  }
  return '<div class="hlhead">' +
    '<div class="vtitle">' + esc(v.title || v.bvid || '') + '</div>' +
    '<div class="vmeta">' + esc(meta) +
      (v.url ? '　<a href="' + esc(v.url) + '" target="_blank" rel="noopener">B站 ↗</a>' : '') + '</div>' +
    (badges ? '<div class="hlbadges">' + badges + '</div>' : '') +
  '</div>';
}

/* ① 精彩时刻图谱：密度曲线 + 共振峰红三角 + 质疑段蓝色区带 */
function graphHTML(d){
  var c = (d && d.curve) || null;
  var hasCurve = !!(c && c.you && c.you.length);
  var peaks = (HL && HL.peaks) || [];
  var crit = (HL && HL.critique) || {};
  // detected=false 时绝不画蓝色带（未检出就如实写未检出）
  var crits = (crit.detected === false) ? [] : (crit.segments || []);
  var notice = '';
  if (!peaks.length) notice += '<div class="hlnotice">未检出共振峰：这段弹幕的复读聚集没有达到检测阈值（5 秒内复读量——同一文本多出来的条数之和——≥3，且至少一种文本在 5 秒内被刷 ≥3 次）。</div>';
  var openingN = peaks.filter(function(p){ return p.in_opening; }).length;
  if (openingN) notice += '<div class="hlnotice">有 ' + openingN + ' 个共振峰落在片头 60 秒内，标为<b>片头打卡噪声</b>——照画，但别当精彩时刻读。</div>';
  if (!crits.length) {
    notice += '<div class="hlnotice">未检出质疑段：未检出就是未检出，不放宽阈值凑数。</div>';

  var legend = '<div class="hllegend">' +
    '<span><i class="swl"></i>弹幕密度（101 个 1% 时段）</span>' +

    (crits.length ? '<span><i class="swb"></i>质疑段（蓝色区带）</span>' : '') +

    '<div class="sechead"><span class="secno">①</span><span class="sectitle">精彩时刻图谱</span>' +
      '<span class="secnote">横轴 = 播放进度 0–100% ｜ 点红三角或下方标签，看那一刻观众在刷什么</span></div>' +
    legend + notice +
    (hasCurve ? '<div id="hlchart"></div>' :
      '<div class="hlempty">这支视频没有密度曲线数据，图谱只列可点的共振峰与质疑段标签。</div>') +
    '<div class="hljumps" id="hljumps">' + hlJumpsHTML() + '</div>' +

/* ② 从众复读 / 中性 / 认真批判 占比条 */
function feedbackHTML(){
  var f = (HL && HL.feedback) || {};
  var head = '<div class="sechead"><span class="secno">②</span><span class="sectitle">弹幕构成：从众复读 / 中性 / 认真批判</span>' +
    '<span class="secnote">一条横向堆叠条 = 全片弹幕的三种角色</span></div>';
  var n = numOr(f.n_danmaku);
  var ch = numOr(f.n_herd), cn = numOr(f.n_neutral), cc = numOr(f.n_critique);
  var rh = null, rn = null, rc = null;
  var sumC = (ch || 0) + (cn || 0) + (cc || 0);
  if (n != null && n > 0 && sumC > 0) {
    rh = (ch || 0) / n * 100; rn = (cn || 0) / n * 100; rc = (cc || 0) / n * 100;
  } else {
    rh = ratioToPct(f.herd); rn = ratioToPct(f.neutral); rc = ratioToPct(f.critique);
  }
  var s = (rh || 0) + (rn || 0) + (rc || 0);
  if (s <= 0) {
    return '<div class="sec" id="sec-hlfeedback">' + head +
      '<div class="hlempty">这支视频没有弹幕构成数据（检测尚未覆盖或全片无弹幕）。</div></div>';
  }
  var wH = (rh || 0) / s * 100, wN = (rn || 0) / s * 100, wC = (rc || 0) / s * 100;
  var sentence = '本视频弹幕：从众复读 ' + Math.round(rh) + '% ｜ 中性 ' + Math.round(rn) +
    '% ｜ 认真批判 ' + Math.round(rc) + '%';
  return '<div class="sec" id="sec-hlfeedback">' + head +
    '<div class="ratio" role="img" aria-label="' + esc(sentence) + '">' +
      '<i class="herd" style="width:' + wH.toFixed(2) + '%"></i>' +
      '<i class="neutral" style="width:' + wN.toFixed(2) + '%"></i>' +
      '<i class="crit" style="width:' + wC.toFixed(2) + '%"></i>' +
    '</div>' +
    '<div class="ratioline">' + esc(sentence) + '</div>' +
    '<div class="ratiolegend">' +
      '<span><i class="sw herd"></i>从众复读 ' + fmtN(ch) + ' 条</span>' +
      '<span><i class="sw neutral"></i>中性 ' + fmtN(cn) + ' 条</span>' +
      '<span><i class="sw crit"></i>认真批判 ' + fmtN(cc) + ' 条</span>' +
      (n != null ? '<span>共 ' + fmtN(n) + ' 条弹幕</span>' : '') +
    '</div>' +
    '<div class="hlnotice" style="margin:12px 0 0">从众复读 = 同一文本 5 秒内被刷 ≥2 次，或文本 ≤4 字，或命中「哈 / 666 / 前排 / 打卡 / 空降」这类语气词；认真批判 = 命中质疑词、长度 ≥8 且情感分为负。分类是规则判定，只看弹幕文字，不看内容。</div>' +
  '</div>';
}

/* ③ 切片建议（长视频）/ 高光定位（短视频） */
/* 卡片上的原始弹幕：不判定情绪，让弹幕自己说话（2026-10-19 用户拍板） */
function hlRepInline(list, maxN){
  list = list || [];
  if (!list.length) return '';
  maxN = maxN || 2;
  var parts = [];
  for (var i = 0; i < list.length && parts.length < maxN; i++) {
    var it = list[i];
    var text = (typeof it === 'string') ? it : ((it && it.text != null) ? it.text : '');
    if (!text) continue;
    var n = (typeof it === 'string') ? null : (it && it.n);
    parts.push('<b>' + esc(text) + '</b>' + (n != null ? '×' + fmtN(n) : ''));
  }
  if (!parts.length) return '';
  return '<span class="hlrep">观众集中刷：' + parts.join(' ｜ ') + '</span>';
}

function outHTML(){ return isLongHL() ? sliceHTML() : highlightHTML(); }

  var list = (HL && HL.slice_suggestions) || [];

var HL_CAVEATS = [
  '只测「情绪共振」与「质疑」，不测「内容质量」——量大 ≠ 内容好。',
  '不判定情绪：弹幕情绪词语义随内容语境漂移，系统只标「哪里起了反应 / 观众在刷什么」，不猜「这是什么情绪」。',
  '批判层可能很薄：未检出 = 未检出，不放宽阈值凑数。',
  '「该切 / 该看」= 情绪共振最强处，不是内容最好处。',
  '复读近似 = 文本完全相等（变体可能漏检）；弹幕只反映观众反应，不解释内容含义。'
];
function hlCaveatList(){

      else out.push(fb[i]);
    }
    return out;
  }
  return fb;
}
function honestHLHTML(){

}

/* ── ① 图谱绘制 ── */
function drawHLChart(){
  var el = $('#hlchart'); if (!el || !CUR) return;
  var c = CUR.curve || null;
  var youRaw = (c && c.you) || [];
  if (!youRaw.length) return;
  if (HCHART) { HCHART.dispose(); HCHART = null; }
  HCHART = echarts.init(el, null, {renderer: 'canvas'});
  var C = dmChart();
  var dur = hlDur();
  var you = youRaw.map(function(v){ return +(v * 100).toFixed(3); });
  var xs = you.map(function(_, i){ return i; });
  var ymax = Math.max.apply(null, you.concat([1])) * 1.3;
  var peaks = (HL && HL.peaks) || [];
  var crit0 = (HL && HL.critique) || {};
  var crits = (crit0.detected === false) ? [] : (crit0.segments || []);
  var last = you.length - 1;
  var peakData = [];
  peaks.forEach(function(p, i){
    var sec = (p.peak_sec != null) ? p.peak_sec : ((p.start_sec + p.end_sec) / 2);
    var idx = Math.max(0, Math.min(last, Math.round(pctOfSec(sec, dur) / 100 * last)));
    peakData.push({value: [idx, you[idx] || 0], peakIdx: i, name: '共振峰'});
  });
  var areas = crits.map(function(s){
    var b0 = Math.max(0, Math.min(last, Math.round(pctOfSec(s.start_sec, dur) / 100 * last)));
    var b1 = Math.max(b0, Math.min(last, Math.round(pctOfSec(s.end_sec, dur) / 100 * last)));
    return [{xAxis: b0}, {xAxis: b1}];
  });
  var lineSeries = {
    name: '弹幕密度', type: 'line', data: you, showSymbol: false, smooth: false, z: 4,
    lineStyle: {width: 2.5, color: C.primary}, itemStyle: {color: C.primary},
    areaStyle: {color: C.band}
  };
  if (areas.length) {
    lineSeries.markArea = {silent: true,
      itemStyle: {color: C.band, borderColor: C.primary, borderWidth: 1},
      data: areas};
  }
  var series = [lineSeries];
  if (peakData.length) {
    series.push({name: '共振峰', type: 'scatter', data: peakData, symbol: 'triangle',
      symbolSize: 13, z: 6, itemStyle: {color: C.accent}, label: {show: false}});
  }
  HCHART.setOption({
    backgroundColor: 'transparent',
    grid: {left: 50, right: 18, top: 18, bottom: 62},
    tooltip: {trigger: 'axis', axisPointer: {type: 'line'},
      backgroundColor: C.tipBg, borderColor: C.tipBorder,
      textStyle: {color: C.text, fontSize: 12, fontFamily: C.font},
      formatter: function(ps){
        if (!ps || !ps.length) return '';
        var i = ps[0].dataIndex;
        var html = '<b>播放进度 ' + i + '%' + (dur ? '（' + mmss(i / 100 * dur) + '）' : '') + '</b><br>' +
          '弹幕密度：' + (you[i] != null ? you[i].toFixed(2) : '—') + '%（该 1% 时段占全片弹幕的比例）';
        for (var k = 0; k < peakData.length; k++) {
          if (peakData[k].value[0] === i) {
            var p = peaks[peakData[k].peakIdx];
            html += '<div style="margin-top:7px;padding-top:7px;border-top:1px solid ' + C.tipBorder + '">' +
              '共振峰' +
              (p.n_repeat != null ? '　复读 ' + p.n_repeat + ' 条' : '') +
              (p.top_danmaku && p.top_danmaku.length
                ? '<br>观众刷：<b>' + esc(p.top_danmaku[0].text) + '</b>×' + fmtN(p.top_danmaku[0].n) : '') +
              (p.in_opening ? '<br>片头打卡噪声（片头 60 秒内，可能是打卡弹幕）' : '') + '</div>';
            break;
          }
        }
        for (var j = 0; j < crits.length; j++) {
          var s = crits[j];
          if (i >= Math.round(pctOfSec(s.start_sec, dur) / 100 * last) - 0.5 &&
              i <= Math.round(pctOfSec(s.end_sec, dur) / 100 * last) + 0.5) {
            html += '<div style="margin-top:5px;color:' + C.textTertiary + '">质疑段：第 ' +
              roundSec(s.start_sec) + '–' + roundSec(s.end_sec) + ' 秒</div>';
            break;
          }
        }
        return html;
      }},
    xAxis: {type: 'category', data: xs, boundaryGap: false, name: '播放进度',
      nameLocation: 'middle', nameGap: 44, nameTextStyle: {color: C.axis, fontSize: 12},
      axisLine: {lineStyle: {color: C.split}}, axisTick: {show: false},
      axisLabel: {color: C.axis, fontSize: 11, interval: 9,
        formatter: function(v){ return v + '%' + (dur ? '\n' + mmss(v / 100 * dur) : ''); }}},
    yAxis: {type: 'value', min: 0, max: ymax, name: '弹幕占比',
      nameTextStyle: {color: C.axis, fontSize: 12},
      axisLine: {show: false}, axisTick: {show: false},
      axisLabel: {color: C.axis, fontSize: 11, formatter: function(v){ return v.toFixed(1) + '%'; }},
      splitLine: {lineStyle: {color: C.split}}},
    series: series
  });
  HCHART.on('click', function(p){
    if (p.seriesName === '共振峰' && p.data && p.data.peakIdx != null) openPeak(p.data.peakIdx);
  });
  if (!window.__v3resizeBound) {
    window.__v3resizeBound = 1;
    window.addEventListener('resize', function(){ if (HCHART) HCHART.resize(); if (CHART) CHART.resize(); });
  }
}

/* ── 弹幕列表与情感占比（面板复用） ── */
function hlTopHTML(list){
  list = list || [];
  if (!list.length) return '<div class="reso-empty">这一段没有可展示的代表弹幕。</div>';
  return list.map(function(it){
    var text = (typeof it === 'string') ? it : ((it && it.text != null) ? it.text : '');
    var n = (typeof it === 'string') ? null : (it && it.n);
    return '<div class="reso-item"><span class="t">' + esc(text) + '</span>' +
      (n != null ? '<span class="c">×' + fmtN(n) + '</span>' : '') + '</div>';
  }).join('');
}
function hlSentHTML(sent){
  if (!sent) return '<div class="reso-empty">没有情感占比数据。</div>';
  var pos = numOr(sent.pos), neg = numOr(sent.neg), neu = numOr(sent.neu);
  if (pos == null && neg == null && neu == null) return '<div class="reso-empty">没有情感占比数据。</div>';
  var tot = (pos || 0) + (neg || 0) + (neu || 0);
  function fmt(v){
    if (v == null) return '—';
    var p = (tot > 0.0001) ? (v / tot * 100) : (v <= 1 ? v * 100 : v);
    return Math.round(p) + '%';
  }
  return '<div class="hlsen"><span>正向 <b>' + fmt(pos) + '</b></span>' +
    '<span>中性 <b>' + fmt(neu) + '</b></span>' +
    '<span>负向 <b>' + fmt(neg) + '</b></span></div>';
}

/* ── 点峰 / 点段 / 点切片卡片 → 面板 ── */
function openPeak(i){
  var p = ((HL && HL.peaks) || [])[i]; if (!p) return;
  markHL('peak', i);
  var box = $('#hlpanel'); if (!box) return;
  var meta = [];
  if (p.pctl != null) meta.push('强度超过同分区 ' + Math.round(p.pctl) + '% 的峰（峰级百分位）');
  if (p.partition_n != null) meta.push('同分区参比峰 ' + p.partition_n + ' 个');
  if (p.in_opening) meta.push('片头打卡噪声（位于片头 60 秒内，可能是打卡弹幕）');
  if (p.n_rep_texts != null) meta.push('复读文本 ' + p.n_rep_texts + ' 种');
  var sec = (p.peak_sec != null) ? p.peak_sec : ((p.start_sec + p.end_sec) / 2);
  box.innerHTML = '<div class="dmpanel">' +
    '<h4>共振峰 · 第 ' + roundSec(p.start_sec) + '–' + roundSec(p.end_sec) + ' 秒（' +
      mmss(p.start_sec) + '–' + mmss(p.end_sec) + '，播放进度第 ' + Math.round(pctOfSec(sec, hlDur())) + '%）</h4>' +
    (meta.length ? '<div class="dmwhy">' + esc(meta.join(' ｜ ')) + '</div>' : '') +
    '<div class="reso"><div class="reso-h">这一刻观众在刷什么' +
      '<span class="n">' + (p.n_repeat != null ? '复读 ' + fmtN(p.n_repeat) + ' 条' : '') + '</span></div>' +
      '<div class="reso-cols">' +
        '<div><div class="reso-sub">复读最多</div>' + hlTopHTML(p.top_danmaku) + '</div>' +
        '<div><div class="reso-sub">情感占比（参考）</div>' + hlSentHTML(p.sentiment) + '</div>' +
      '</div></div>' +
    '<div class="hlpanelnote">弹幕原文未做筛选或改写；情感占比为情感词典打分，仅参考，不判定具体情绪。</div>' +
  '</div>';
  document.querySelectorAll('.hljump').forEach(function(el){ el.classList.remove('on'); });
  var on = document.querySelector('.hljump[data-peakhl="' + i + '"]');
  if (on) on.classList.add('on');
  focusSection('hlpanel');
}

function openCritique(i){
  var c = (HL && HL.critique) || {};
  var s = (c.segments || [])[i]; if (!s) return;
  markHL('seg', i);
  var box = $('#hlpanel'); if (!box) return;
  var meta = [];
  if (s.n != null) meta.push('批判弹幕 ' + s.n + ' 条');
  if (s.score != null) meta.push('批判权重得分 ' + s.score);
  if (s.neg_ratio != null) meta.push('负向占比 ' + hlRatioText(s.neg_ratio));
  box.innerHTML = '<div class="dmpanel">' +
    '<h4>质疑段 · 第 ' + roundSec(s.start_sec) + '–' + roundSec(s.end_sec) + ' 秒（' +
      mmss(s.start_sec) + '–' + mmss(s.end_sec) + '）</h4>' +
    '<div class="dmwhy">' + esc('观众在这里认真质疑（命中质疑词 + 长度 ≥8 + 情感为负）。' +
      (meta.length ? '　' + meta.join(' ｜ ') : '')) + '</div>' +
    '<div class="reso"><div class="reso-h">这一段观众在质疑什么</div>' +
      '<div class="reso-cols">' +
        '<div><div class="reso-sub">代表质疑弹幕</div>' + hlTopHTML(s.top_danmaku) + '</div>' +
        '<div><div class="reso-sub">怎么读</div><div class="reso-empty">段数少不代表视频没人质疑，只代表命中了检测规则；反讽、谐音可能漏检。</div></div>' +
      '</div></div>' +
    '<div class="hlpanelnote">质疑段按「质疑词 + 否定情感」规则检出，不代表内容质量结论。</div>' +
  '</div>';
  document.querySelectorAll('.hljump').forEach(function(el){ el.classList.remove('on'); });
  var on = document.querySelector('.hljump[data-seghl="' + i + '"]');
  if (on) on.classList.add('on');
  focusSection('hlpanel');
}

function selectHLCard(sel){
  document.querySelectorAll('.hlslice').forEach(function(el){ el.classList.remove('on'); });
  var el = document.querySelector(sel); if (el) el.classList.add('on');
}

function openSlice(i){
  var s = ((HL && HL.slice_suggestions) || [])[i]; if (!s) return;
  markHL('slice', i);
  var note = [];
  if (s.pctl != null) note.push('共振强度超过同分区 ' + Math.round(s.pctl) + '% 的峰');
  if (s.score != null) note.push('得分 ' + s.score);
  if (s.opening_only) note.push('片头打卡段，仅供参考');
  showHLRange('slicePanel',
    '切片 ' + (s.rank || (i + 1)) + ' · 第 ' + roundSec(s.start_sec) + '–' + roundSec(s.end_sec) + ' 秒',
    note.join(' ｜ '), s.start_sec, s.end_sec, s.top_danmaku);
  selectHLCard('.hlslice[data-slice="' + i + '"]');
}

function openHighlight(i){
  var s = ((HL && HL.highlight_positions) || [])[i]; if (!s) return;
  markHL('high', i);
  var t0 = (s.start_sec != null) ? s.start_sec : s.sec;
  var t1 = (s.end_sec != null) ? s.end_sec : s.sec;
  var note = (s.pctl != null) ? ('共振强度超过同分区 ' + Math.round(s.pctl) + '% 的峰') : '';
  if (s.opening_only) note += (note ? ' ｜ ' : '') + '片头打卡段，仅供参考';
  showHLRange('slicePanel',
    '高光 · 第 ' + roundSec(t0) + '–' + roundSec(t1) + ' 秒',
    note, t0, t1, s.top_danmaku);
  selectHLCard('.hlhigh[data-high="' + i + '"]');
}

/* 切片/高光面板：有代表弹幕就直接列；没有再按秒区间取真实弹幕补上 */
function showHLRange(boxid, title, note, t0, t1, items){
  var box = document.getElementById(boxid); if (!box) return;
  var hasItems = !!(items && items.length);
  box.innerHTML = '<div class="dmpanel">' +
    '<h4>' + esc(title) + '</h4>' +
    (note ? '<div class="dmwhy">' + esc(note) + '</div>' : '') +
    '<div class="reso"><div class="reso-h">这一刻观众在刷什么' +
      '<span class="n">第 ' + roundSec(t0) + '–' + roundSec(t1) + ' 秒</span></div>' +
      '<div class="reso-cols">' +
        '<div><div class="reso-sub">复读最多</div><div id="' + boxid + '-top">' +
          (hasItems ? hlTopHTML(items) : '<div class="reso-empty">正在取这一段弹幕…</div>') + '</div></div>' +
        '<div><div class="reso-sub">代表弹幕（按时间）</div><div id="' + boxid + '-samples">' +
          '<div class="reso-empty">正在取这一段弹幕…</div></div></div>' +
      '</div></div>' +
    '<div class="hlpanelnote">弹幕原文未做筛选或改写；「代表弹幕」按时间顺序取这一段内的真实弹幕。</div>' +
  '</div>';
  focusSection(boxid);
  api('/api/danmaku_at?bvid=' + encodeURIComponent(CUR.video.bvid) +
      '&t0=' + Number(t0).toFixed(1) + '&t1=' + Number(t1).toFixed(1) + '&limit=60')
    .then(function(d){
      var top = document.getElementById(boxid + '-top');
      if (top && !hasItems) {
        top.innerHTML = hlTopHTML((d.top_repeat || []).map(function(r){ return {text: r.txt, n: r.n}; }));
      }
      var smp = document.getElementById(boxid + '-samples');
      if (smp) {
        var its = (d.items || []).slice(0, 8);
        smp.innerHTML = its.length ? its.map(function(it){
          return '<div class="reso-s"><span class="dt">' + mmss(it.t) + '</span>' + esc(it.txt) + '</div>';
        }).join('') : '<div class="reso-empty">这一段时间里没有弹幕。</div>';
      }
    })
    .catch(function(e){
      var top = document.getElementById(boxid + '-top');
      if (top && !hasItems) top.innerHTML = '<div class="reso-empty">取这一段弹幕失败：' + esc(e.message) + '</div>';
      var smp = document.getElementById(boxid + '-samples');
      if (smp) smp.innerHTML = '<div class="reso-empty">取这一段弹幕失败：' + esc(e.message) + '</div>';
    });
}

/* ── 渲染主流程 ── */
function render(){
  const d = CUR;
  $('#content').innerHTML = hlHeadHTML(d) +
    (HL ? hlViewHTML(d) : hlEmptyHTML(d)) +
    oldcardHTML(d);
  bind();
  if (HL) drawHLChart();

  refreshFav();
  initNarrative();   // 必须在深链接分支之前 —— 否则 ?drill=/?bench= 进来时导轨不出现

  // 旧诊断曲线图在折叠层里：展开后才画（收起时容器宽高为 0，ECharts 只会得到空画布）
  const old = $('#oldcard');
  if (old) {
    old.addEventListener('toggle', function(){
      if (!old.open) return;
      if (!CHART) drawChart(); else CHART.resize();
    });
  }

  // 深链接：?peak / ?seg / ?slice / ?high 落到精彩时刻交互态；
  // ?drill / ?bench / ?act / ?old 落到折叠层里的旧交互（自动展开折叠层）
  const usp = new URLSearchParams(location.search);
  const oldDeep = usp.get('drill') != null || usp.get('bench') != null ||
                  usp.get('act') != null || usp.get('old') != null;
  if (oldDeep) openOldcard();
  if (usp.get('peak') != null) { setTimeout(function(){ openPeak(+usp.get('peak')); }, 200); return; }
  if (usp.get('seg') != null) { setTimeout(function(){ openCritique(+usp.get('seg')); }, 200); return; }
  if (usp.get('slice') != null) { setTimeout(function(){ openSlice(+usp.get('slice')); }, 200); return; }
  if (usp.get('high') != null) { setTimeout(function(){ openHighlight(+usp.get('high')); }, 200); return; }
  if (usp.get('drill') != null) { setTimeout(() => drillDeviation(+usp.get('drill'), true), 260); return; }
  if (usp.get('bench') != null) { selectBench(+usp.get('bench')); return; }
  if (usp.get('act') != null) { setTimeout(() => runAction(+usp.get('act')), 260); return; }
  // ?ai=1 → 直接把 AI 解读面板打开（与 drill/bench/act 同约定：状态可分享、可被自动核验）
  if (usp.get('ai') != null) { setTimeout(runAI, 260); return; }
  // 军规 7：永远"你 vs 同类 vs 对标对象"三线对照 —— 默认叠上最像的那支
  if ((d.benchmarks || []).length) selectBench(0);
}

/* 把当前交互状态写进地址栏，便于分享与复现 */
function markUrl(k, v){
  const u = new URLSearchParams(location.search);
  ['drill', 'bench', 'act'].forEach(x => u.delete(x));
  if (k) u.set(k, v);
  history.replaceState(null, '', '?' + u.toString());
}

/* 选中一支对标对象 → 上图叠它的曲线 */
function selectBench(i, toggle){
  if (toggle && BENCH === i) {
    BENCH = null;

    BENCH = i;
  }
  document.querySelectorAll('.bcard').forEach((y, k) => y.classList.toggle('on', k === BENCH));
  if (toggle) markUrl(BENCH == null ? null : 'bench', BENCH);
  const bseg = (BENCH != null) ? (CUR.benchmarks[BENCH].learn_seg || null) : null;

    '<div class="bdrow"><span class="bdk">后来表现</span>' + esc(b.outcome_text) + '</div>' +

      '（第 ' + b.learn_seg[0] + '–' + b.learn_seg[1] + '%）：这一段它更接近同类中位。' +
      '<b>上图已把它的曲线叠上去、并高亮这一段。</b></div>' : '') +
    '<div class="bdrow"><a class="btn" href="/diagnosis.html?bvid=' + encodeURIComponent(b.bvid) +
      '" target="_blank" rel="noopener">在新标签页打开它的诊断卡 ↗</a>' +
      '<span class="bdnote">新开一页，免得把你正在看的这支顶掉</span></div></div>';

/* ① 一句话结论 */
function verdictHTML(d){
  const v = d.verdict, t = TONE[v.tone] || TONE.ok;
  const vi = d.video;
  const devs = d.deviations || [];
  // 结论 → 证据：大字问题与结论里的【维度】都做成可点，点了就落到那一维的证据段
  const byLabel = {};
  devs.forEach((x, i) => { byLabel[x.label] = i; });
  const ci = devs.findIndex(x => x._dim && x._dim === v._concern_dim);
  const jump = (i, txt) => '<span class="jump" data-jump="' + i + '" title="查看证据：该时段的弹幕原文">' + txt + '</span>';
  const problem = ci >= 0 ? jump(ci, esc(v.problem_5s)) : esc(v.problem_5s);
  const head = esc(v.headline).replace(/【([^】]{2,14})】/g, function(m, lab){
    return byLabel[lab] != null ? jump(byLabel[lab], '【' + lab + '】') : m;
  });
  const meta = [vi.up_name, vi.tname,
    (vi.duration_text ? '时长 ' + vi.duration_text : ''),
    (vi.play_text ? '播放 ' + vi.play_text : '')].filter(Boolean).join(' · ');
  return '<div class="verdict" id="sec-verdict">' +
    // 第一信息 = 这是哪支视频。BV 号对人是乱码，标题才是（2026-10-16 定的）
    '<div class="vtitle">' + esc(vi.title || vi.bvid) + '</div>' +
    '<div class="vmeta">' + esc(meta) +
      (vi.url ? '　<a href="' + vi.url + '" target="_blank" rel="noopener">B站 ↗</a>' : '') + '</div>' +
    '<div class="vbody">' +
      '<span class="tone ' + t[1] + '">' + (v.tone === 'ok' ? '●' : '▲') + ' ' + t[0] + '</span>' +
      '<div class="vmain">' +
        '<div class="vproblem">' + problem + '</div>' +
        '<div class="vhead">' + head + '</div>' +
        (v.detail ? '<div class="vdetail">' + esc(v.detail) + '</div>' : '') +
      '</div></div></div>';
}

function drawChart(){
  const c = CUR.curve; if (!c) return;
  const el = $('#chart'); if (!el) return;
  // 折叠层收起时 #chart 宽高为 0：先不画，展开时由 toggle 重画（否则 ECharts 只得到空画布）
  const oldBox = document.getElementById('oldcard');
  if (oldBox && !oldBox.open) return;
  if (CHART) { CHART.dispose(); CHART = null; }
  CHART = echarts.init(el, null, {renderer: 'canvas'});
  // canvas 不认 CSS 变量 —— 一律走 dpVar（DESIGN.md §1#1），fallback 由 token 测试核对
  const C = dmChart();
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const axis = C.axis, spl = C.split;
  const xs = c.you.map((_, i) => i);
  const dur = c.duration || 0;
  // 偏离段 = "该看的地方" ⇒ --accent；冲出/掉出同属偏离段，方向由图注文字说明（§1#12 不许用状态色编码数据）
  const bandArea = (c.bands || []).map(b => ([
    {xAxis: b.from, itemStyle: {color: C.accentTint}}, {xAxis: b.to}
  ]));
  const focusArea = FOCUS != null ? [[{xAxis: FOCUS[0], itemStyle: {color: C.accentTint}}, {xAxis: FOCUS[1]}]] : [];
  const bch = BENCH != null ? (CUR.benchmarks[BENCH].curve || null) : null;
  // 这张图按「体检报告的参考范围」来画：灰色带 = 同类参考范围（中间一半的视频落在里面），
  // 带里那条粗线 = 分区中位，蓝线 = 你。参考范围是**内联主体**，不是背景虚线。
  // 为什么敢给这么足的权重：它是"市场参照系"的可视证明——评委看的是"这个结果可不可信"。
  const series = [
    // 下沿（p25）：可见的边界线，让"范围"有边
    {name: '_p25', type: 'line', stack: 'env', data: c.p25, showSymbol: false, silent: true,
     lineStyle: {width: 1, color: axis, opacity: .55}, areaStyle: {opacity: 0},
     tooltip: {show: false}, z: 1},
    // 上沿（p75）：stack 差值 + 填充 = 参考范围带
    {name: '同类参考范围（中间一半）', type: 'line', stack: 'env',
     data: c.p75.map((v, i) => Math.max(0, v - c.p25[i])),
     showSymbol: false, silent: true,
     lineStyle: {width: 1, color: axis, opacity: .55},
     areaStyle: {color: axis, opacity: .12}, z: 1},
    // 分区中位：粗线 —— 参考范围的中心线，权重必须够
    {name: '同类中位', type: 'line', data: c.median, showSymbol: false, z: 3,
     lineStyle: {width: 3, color: axis}},
    {name: '你', type: 'line', data: c.you, showSymbol: false, z: 5, smooth: 0,
     lineStyle: {width: 3, color: C.primary}, itemStyle: {color: C.primary},
     areaStyle: {color: C.band},
     markArea: {silent: true, data: bandArea.concat(focusArea)},
     markPoint: {symbol: 'triangle', symbolSize: 11, itemStyle: {color: C.accent},
       label: {show: false},
       data: (c.peaks || []).map(p => ({name: '爆点', coord: [p.pct, c.you[p.pct]], value: p.pct,
         peakIdx: (c.peaks || []).indexOf(p)}))}}
  ];
  // 对标对象也是"参照系"（可比组）⇒ 同为 --chart-axis，靠线型（点线 vs 虚线）与图例区分
  if (bch) series.push({name: '对标对象', type: 'line', data: bch, showSymbol: false, z: 4,
    lineStyle: {width: 2, type: 'dotted', color: axis}, itemStyle: {color: axis}});
  const fmt = v => dur ? mmss(v / 100 * dur) : '';
  CHART.setOption({
    backgroundColor: 'transparent',
    grid: {left: 52, right: 18, top: 16, bottom: 46},
    tooltip: {trigger: 'axis', axisPointer: {type: 'line'},
      backgroundColor: C.tipBg, borderColor: C.tipBorder,
      textStyle: {color: C.text, fontSize: 12, fontFamily: C.font},
      formatter: ps => {
        const i = ps[0].dataIndex;
        const pct = i + '%';
        const r = c.median[i] ? Math.round(c.you[i] / c.median[i] * 100) : null;
        const dg = DIGEST && DIGEST.buckets ? DIGEST.buckets[i] : null;
        return '<b>播放进度 ' + pct + (dur ? '（' + mmss(i / 100 * dur) + '）' : '') + '</b><br>' +
          '你：' + (c.you[i] * 100).toFixed(2) + '%　同类中位：' + (c.median[i] * 100).toFixed(2) + '%<br>' +
          '同类常见区间：' + (c.p25[i] * 100).toFixed(2) + '% ~ ' + (c.p75[i] * 100).toFixed(2) + '%' +
          (r != null ? '<br>你 = 同类中位的 <b>' + r + '%</b>' : '') +
          (bch ? '<br>对标对象：' + (bch[i] * 100).toFixed(2) + '%' : '') +
          // 悬停就看见"这一刻观众在刷什么"——数字变人话，不用点开
          (dg && dg.n
            ? '<div style="margin-top:7px;padding-top:7px;border-top:1px solid ' + C.tipBorder + '">' +
              '这一刻的弹幕：<b>' + dg.n + ' 条</b><br>' +
              '<span style="color:' + C.textTertiary + '">「' + esc(dg.rep) + '」</span></div>'
            : '<div style="margin-top:7px;padding-top:7px;border-top:1px solid ' + C.tipBorder +
              ';color:' + C.textTertiary + '">这一刻没有弹幕</div>');
      }},
    xAxis: {type: 'category', data: xs, boundaryGap: false, name: '播放进度', nameLocation: 'middle',
      nameGap: 30, nameTextStyle: {color: axis, fontSize: 12},
      axisLine: {lineStyle: {color: spl}}, axisTick: {show: false},
      axisLabel: {color: axis, fontSize: 11, interval: 9,
        formatter: v => v + '%' + (dur ? '\n' + mmss(v / 100 * dur) : '')}},
    yAxis: {type: 'value', name: '弹幕多少', nameTextStyle: {color: axis, fontSize: 12},
      axisLine: {show: false}, axisTick: {show: false},
      axisLabel: {color: axis, fontSize: 11, formatter: v => (v * 100).toFixed(1) + '%'},
      splitLine: {lineStyle: {color: spl}}},
    series: series
  });
  CHART.on('click', p => {
    if (p.componentType === 'markPoint' && p.data && p.data.peakIdx != null) showPeak(p.data.peakIdx);
  });
  if (!window.__v3resizeBound) { window.__v3resizeBound = 1;
    window.addEventListener('resize', function(){ if (HCHART) HCHART.resize(); if (CHART) CHART.resize(); });
  }
}

/* 诚实边界条：放在主视图可见处（不藏技术层）。
   三签名里的「诚实」——常驻"这是估计值""不做因果承诺"，评委第一眼就能看到。 */
function honestHTML(){
  return '<div class="honest">' +
    '<b>怎么读这张图</b>' +
    '<span>灰色带 = 同类参考范围（中间一半的视频落在里面），带里粗线 = 分区中位，蓝线 = 你。</span>' +
    '<span>「同类中位≈N 条」是<b>估计值</b>——由同分区各视频的曲线占比 × 总条数换算后再取中位，不是逐条精确计数。</span>' +
    '<span>形状差异与后续热度没有稳定关联，<b>不做因果承诺</b>；跨批一致性 99.2%（32 号 P1）。</span>' +
    '</div>';
}

/* ④ 偏离诊断 */
function devHTML(d){
  const list = d.deviations || [];
  if (!list.length) return '<div class="sec"><div class="sechead"><span class="secno">③</span><span class="sectitle">偏离</span></div>' +
    '<div class="dim">这支视频的节奏和同类高度一致，没有值得单独指出的偏离项。</div></div>';
  return '<div class="sec" id="sec-dev">' +
    '<div class="sechead"><span class="secno">③</span><span class="sectitle">偏离</span>' +
      '<span class="secnote">只列最明显的 ' + list.length + ' 项 ｜ 点卡片可在上图看这一段</span></div>' +
    list.map((x, i) => {
      const mx = Math.max(Math.abs(x.value || 0), Math.abs(x.median || 0), 1e-9);
      return '<div class="dev" data-dev="' + i + '">' +
        '<div class="devtop">' +
          '<span class="devname">' + esc(x.label) + '</span>' +
          '<span class="pill ' + (x.color === 'green' ? 'good' : x.color === 'red' ? 'bad' : 'gray') + '">' +
            x.direction_mark + ' ' + esc(x.direction_label) + '</span>' +
          '<span class="pill lv">' + esc(x.level) + ' ｜ ' + esc(x.pole) + '</span>' +
          '<span class="pill lv">' + esc(x.position_text) + '</span>' +
        '</div>' +
        // ML 可信度签名一「精确」：每个数到 2 位小数，单位写清楚
        '<div class="devnum">' +
          '<span>你 <b>' + esc(x.you_text) + '</b></span>' +
          '<span>同类中位 <b>' + esc(x.median_text) + '</b></span>' +
          (x.unit_label ? '<span class="du">' + esc(x.unit_label) + '</span>' : '') +
        '</div>' +
        // 签名二「出处」：关键数字挂徽章，鼠标悬停给出处（样本量 / 跨批一致性 / 控龄偏相关）
        '<div class="devbadges">' + (x.badges || []).map(b =>
          '<span class="bdg" title="' + esc(b.time) + '">' + esc(b.text) + '</span>').join('') + '</div>' +
        '<div class="cmp"><span class="bl">同类中位</span><span><span class="b mid" style="width:' +
          (Math.abs(x.median || 0) / mx * 100).toFixed(1) + '%"></span></span></div>' +
        '<div class="cmp"><span class="bl">你</span><span><span class="b you" style="width:' +
          (Math.abs(x.value || 0) / mx * 100).toFixed(1) + '%"></span></span></div>' +
        '<div class="devtext">' + esc(x.compare_text) + '</div>' +
        '<div class="devadv"><b>建议：</b>' + esc(x.advice) + '</div>' +
        '<div class="devfoot">' +
          '<span class="linkish">▸ 看证据：上图高亮 ' + esc(x.drill_seg_name || x.seg_name) +
            '，并列出该时段的弹幕原文</span>' +
          (x.ref ? '<span>同类参照：《' + esc(x.ref.title) + '》</span>' : '') +
          (x.direction === 'neutral' ? '<span>形状维差异，无好坏证据</span>' : '<span>该维与后续表现有稳定关联</span>') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
}

    '<div class="bench">' + bs.map((b, i) =>

        '<div class="blike">' + esc(b.like_text) + '</div>' +

/* ⑥ 行动 */
function actionHTML(d){

/* 交互绑定 */
function bind(){
  const lg = $('#lgBtn');
  if (lg) lg.onclick = () => {
    const box = document.querySelector('.legend');
    const hidden = box.classList.toggle('lg-off');
    // 只藏图例项，保留按钮本身，否则没法再打开
    Array.prototype.forEach.call(box.children, el => {
      if (el.id !== 'lgBtn') el.style.display = hidden ? 'none' : '';
    });
    lg.textContent = hidden ? '显示图例' : '隐藏图例';
  };
  const mp = $('#morePos');
  if (mp) mp.onclick = () => {
    document.querySelectorAll('.posrow.more').forEach(x => x.classList.toggle('hidden'));
    mp.textContent = mp.textContent.includes('查看其余') ? '收起 ▴' : '查看其余 ' + (CUR.position.dims.length - 6) + ' 项 ▾';
  };
  document.querySelectorAll('.dev').forEach(el => el.onclick = () => drillDeviation(+el.dataset.dev, false));
  document.querySelectorAll('.jump[data-jump]').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    drillDeviation(+el.dataset.jump, true);
  });
  document.querySelectorAll('.act[data-act]').forEach(el => el.onclick = () => runAction(+el.dataset.act));
  document.querySelectorAll('.bcard').forEach(el => el.onclick = () => selectBench(+el.dataset.bench, true));
  // 结论里的关键词（带下划线）：之前**根本没绑事件**，点了不动 —— 这是 bug 不是克制
  document.querySelectorAll('.jump[data-jump]').forEach(el => {
    el.onclick = () => drillDeviation(+el.dataset.jump, true);
    el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); drillDeviation(+el.dataset.jump, true); } };
  });
  document.querySelectorAll('.chip[data-peak]').forEach(el => el.onclick = () => {
    const pct = +el.dataset.peak;
    const i = (CUR.curve.peaks || []).findIndex(p => p.pct === pct);
    showPeak(i);
  });
  // 精彩时刻：图下方标签（键盘可达）与切片/高光卡片，都走原生 button 点击
  document.querySelectorAll('.hljump[data-peakhl]').forEach(el => el.onclick = () => openPeak(+el.dataset.peakhl));
  document.querySelectorAll('.hljump[data-seghl]').forEach(el => el.onclick = () => openCritique(+el.dataset.seghl));
  document.querySelectorAll('.hlslice[data-slice]').forEach(el => el.onclick = () => openSlice(+el.dataset.slice));
  document.querySelectorAll('.hlhigh[data-high]').forEach(el => el.onclick = () => openHighlight(+el.dataset.high));
  const hlRetry = $('#hlRetry');
  if (hlRetry) hlRetry.onclick = () => { if (CUR) load(CUR.video.bvid); };
}

/* 行动卡（旧诊断里点任意一条 → 定位到该照谁 / 哪一段）。
   ⚠️ 2026-10-19 修复：基线页面只绑定/深链了 runAction，但函数从未定义 ——
   点行动卡会抛 ReferenceError（"点了不动"）。这里补上实现，交互按原设计恢复。 */
function runAction(n){
  const acts = (CUR && CUR.verdict && CUR.verdict.actions) || [];
  const a = acts.filter(function(x){ return +x.n === +n; })[0];
  if (!a) return;
  markUrl('act', n);
  openOldcard();
  document.querySelectorAll('.act').forEach(function(y){
    y.classList.toggle('dim', +y.dataset.act === +n);
  });
  let idx = -1;
  if (a.ref && a.ref.bvid) {
    idx = (CUR.benchmarks || []).findIndex(function(b){ return b.bvid === a.ref.bvid; });
  }
  if (idx >= 0) {          // 有对标对象：选中它，上图叠曲线 + 高亮它该照的段
    selectBench(idx);
    setTimeout(function(){ focusSection('sec-bench'); }, 120);
    return;
  }
  if (a.seg) {             // 没有对标对象：高亮这条建议对应的观察窗口
    FOCUS = a.seg;
    drawChart();
    const cap = $('#cap');
    if (cap) cap.innerHTML = '<b>' + esc(a.text) + '</b>　' + esc(a.basis || '') +
      '　<span style="color:var(--text-secondary)">上图高亮段 = 这条建议对应的观察窗口（第 ' +
      a.seg[0] + '–' + a.seg[1] + '%）</span>';
    setTimeout(function(){ focusSection('sec-curve'); }, 120);
    return;
  }
  setTimeout(function(){ focusSection('sec-action'); }, 120);
}

/* ── 证据钻取：点结论关键词或偏离卡 → 高亮该段 + 拉这一段的真实弹幕 ── */
function pctToSec(pct){
  const dur = (CUR.video && CUR.video.duration) || 0;
  return pct / 100 * dur;
}

function drillDeviation(i, scroll){
  const x = CUR.deviations[i]; if (!x) return;
  markUrl('drill', i);
  BENCH = null;
  document.querySelectorAll('.bcard').forEach(y => y.classList.remove('on'));
  document.querySelectorAll('.dev').forEach((y, k) => y.classList.toggle('dim', k === i));
  FOCUS = x.drill_seg || x.seg || null;
  drawChart();
  const seg = FOCUS || [0, 100];
  $('#cap').innerHTML = '<b>' + esc(x.label) + '</b>：' + esc(x.compare_text) +
    '　<span style="color:var(--text-secondary)">高亮段 = 上图的粉色区域（' + esc(x.drill_seg_name || '') + '）</span>';
  // 滚动到**看图看证据的地方**（曲线段），并在弹幕面板出来后把面板也带进视野
  if (scroll) setTimeout(() => { focusSection('sec-curve'); setTimeout(() => focusSection('dmbox'), 520); }, 60);
  setTimeout(() => loadDanmaku(x, seg), scroll ? 420 : 0);
}

async function loadDanmaku(x, seg){
  const box = $('#dmbox'); if (!box) return;
  const dur = (CUR.video && CUR.video.duration) || 0;
  if (!dur) { box.innerHTML = '<div class="dmpanel"><div class="dmempty">这支视频没有时长数据，无法定位时间段。</div></div>'; return; }
  const t0 = pctToSec(seg[0]), t1 = pctToSec(seg[1]);
  box.innerHTML = '<div class="dmpanel"><div class="dmempty">正在取第 ' + seg[0] + '–' + seg[1] +
    '%（' + mmss(t0) + '–' + mmss(t1) + '）的弹幕…</div></div>';
  try {
    const d = await api('/api/danmaku_at?bvid=' + encodeURIComponent(CUR.video.bvid) +
      '&t0=' + t0.toFixed(1) + '&t1=' + t1.toFixed(1) + '&limit=80');
    renderDanmaku(x, seg, d, t0, t1);
  } catch(e) {
    box.innerHTML = '<div class="dmpanel"><div class="dmempty">取弹幕失败：' + esc(e.message) + '</div></div>';
  }
}

function renderDanmaku(x, seg, d, t0, t1){
  const mine = d.n_in_range;
  const peer = x.peer_count;
  const ratio = (peer && mine != null) ? Math.round(mine / peer * 100) : null;
  const reps = d.top_repeat || [];
  const samples = (d.items || []).slice(0, 3);
  const repHTML = reps.length
    ? reps.map(r => '<div class="reso-item"><span class="t">' + esc(r.txt) + '</span>' +
        '<span class="c">×' + r.n + '</span></div>').join('')
    : '<div class="reso-empty">这一段没有被重复发送的弹幕。</div>';
  const smpHTML = samples.length
    ? samples.map(it => '<div class="reso-s"><span class="dt">' + mmss(it.t) + '</span>' +
        esc(it.txt) + '</div>').join('')
    : '<div class="reso-empty">这一段时间里没有弹幕。</div>';
  const cmp = peer ? '<div class="dmcmp" style="margin-top:10px">' +
      '<span class="u">你这一段：<b>' + mine + '</b> 条</span>' +
      '<span class="p">同类中位：<b>' + peer + '</b> 条</span>' +
      (ratio != null ? '<span>你 = 同类的 <b>' + ratio + '%</b></span>' : '') +
    '</div>' : '';
  $('#dmbox').innerHTML = '<div class="dmpanel">' +
    '<h4>' + esc(x.label) + '｜第 ' + seg[0] + '–' + seg[1] + '%（' + mmss(t0) + '–' + mmss(t1) + '）</h4>' +
    '<div class="dmwhy">' + esc(x.drill_why || '') + '　' + esc(x.compare_text) + '</div>' +
    '<div class="reso">' +
      '<div class="reso-h">这一刻在刷什么<span class="n">共 ' + (mine || 0) + ' 条弹幕</span></div>' +
      '<div class="reso-cols">' +
        '<div><div class="reso-sub">复读最多</div>' + repHTML + '</div>' +
        '<div><div class="reso-sub">代表弹幕（按时间）</div>' + smpHTML + '</div>' +
      '</div>' + cmp +
    '</div>' +
    '<div style="font-size:12px;color:var(--text-tertiary);margin-top:9px">' +
      '弹幕原文未做任何筛选或改写；「同类中位」由同分区各视频的曲线换算，是估计值。' +
      (d.truncated ? '（只显示前 ' + d.returned + ' 条）' : '') +
    '</div></div>';
}

/* 钻取：点爆点 → 看当时弹幕 */
function showPeak(i){
  const p = (CUR.curve.peaks || [])[i]; if (!p) return;
  PEAK = i;
  document.querySelectorAll('.chip[data-peak]').forEach(y => y.classList.toggle('on', +y.dataset.peak === p.pct));
  $('#dmbox').innerHTML = '<div class="dmpanel">' +
    '<h4>爆点 ' + mmss(p.t0) + ' – ' + mmss(p.t1) + '（播放进度第 ' + p.pct + '%）当时的弹幕</h4>' +
    (p.danmaku && p.danmaku.length ? '<ul>' + p.danmaku.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>'
      : '<div>这一时间段没有可展示的弹幕文本。</div>') +
    '<div style="font-size:12px;color:var(--text-tertiary);margin-top:8px">共检出 ' + (CUR.curve.peaks || []).length +
      ' 个反应最集中的时间段；这里是其中最集中的一个。</div></div>';
}

/* ── 滚动叙事：结论 → 证据 → 对标 → 行动 逐步展开 ──
   安全约定：默认全部可见；只有 JS 接管且用户没开 reduced-motion 时才做逐段展开。
   任一前提不满足就只是没有动画，内容一个都不少。 */
function initNarrative(){
  // 主视图四段（五块里切片卡与高光卡互斥，同一个 id）
  const nodes = ['sec-hlgraph', 'sec-hlfeedback', 'sec-hlout', 'sec-hlbench']
    .map(id => document.getElementById(id)).filter(Boolean);
  const rail = document.getElementById('rail');
  if (!nodes.length || !rail) return;
  const names = {'sec-hlgraph': '① 图谱', 'sec-hlfeedback': '② 弹幕构成',
                 'sec-hlout': '③ 切片 / 高光', 'sec-hlbench': '④ 对标'};
  rail.innerHTML = nodes.map(n =>
    '<a href="#' + n.id + '" data-t="' + n.id + '">' + names[n.id] + '</a>').join('');
  rail.hidden = false;
  const links = {};
  rail.querySelectorAll('a').forEach(a => { links[a.dataset.t] = a; });
  const setOn = id => Object.keys(links).forEach(k => links[k].classList.toggle('on', k === id));

  // 不做逐段淡入：主视图区块必须默认全可见 ——
  // 否则没滚到的区块是 opacity:0，整页截图 / 「存为图片」会把它们拍成空白。
  if (!('IntersectionObserver' in window)) { setOn(nodes[0].id); return; }

  // 导轨高亮"我现在读到哪"（判定带放在视口中部，避免来回抖）
  const rio = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); });
  }, {rootMargin: '-45% 0px -45% 0px', threshold: 0});
  nodes.forEach(n => rio.observe(n));
  setOn(nodes[0].id);
}

/* 技术层的敏感性滑块：拖一下看结论稳不稳（只在这里，主卡没有） */

/* ══════════════════════════════════════════════════════════════
   AI 报告解读 —— 基于这张诊断卡给出可执行建议。
   · 定位口径（答辩别说"别人都有所以我们也做"，也别说"全新的创新点"）：
     就是上面那一句而已。
   · 它**不是**"去 AI 味"的对象 —— 去 AI 味只指设计层（措辞/视觉），不指"不许有 AI 功能"。
   · 三道闸与提示词约束都在后端（serve/ai_report.py）；界面只显示状态与**已用量**，
     并在被拒绝时**如实说明原因**（不把"没开"说成"诊断失败"）。
   ══════════════════════════════════════════════════════════════ */
var AISTATE = null;
var AITEXT = '';

function aiUsageLine(ai){
  if (!ai) return '用量暂时取不到（接口没返回）。';
  return '已用 <b>' + ai.used_today + ' / ' + ai.day_limit + '</b> 次　｜　累计 <b>¥' +
    Number(ai.spent_cny).toFixed(4) + ' / ¥' + Number(ai.budget_cny).toFixed(2) +
    '</b>　｜　单次上限 ' + ai.max_tokens + ' token' +
    (ai.model ? ('　｜　模型 ' + esc(ai.model)) : '　｜　未配置密钥');
}

function resetAI(){
  var p = document.getElementById('aipanel');
  if (p) { p.hidden = true; p.innerHTML = ''; }
  AITEXT = '';
}

function aiShell(inner, ai){
  var p = document.getElementById('aipanel');
  if (!p) return;
  p.hidden = false;
  p.innerHTML = '<div class="aicard"><div class="aihead">' +
    '<span class="aititle">✦ AI 报告解读</span>' +
    '</div>' + inner + '<div class="aigate">' + aiUsageLine(ai) + '</div></div>';
}


function aiOK(d, ai){
  var sug = d.suggestions || [];
  // 建议是正文（用户要的是「然后我该动哪儿」），解读降为附注。
  var sugHTML = sug.length ? ('<div class="aiadv"><b>可以动的地方</b><ol>' +
    sug.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></div>') :
    '<div class="aiadv"><b>可以动的地方</b><div style="margin-top:6px">这次没有给出可执行建议。</div></div>';
  aiShell(sugHTML + (d.report ? '<div class="airep">' + esc(d.report) + '</div>' : ''), ai);
  focusSection('aipanel');
}

function aiBlocked(msg, ai){
  aiShell('<div class="aiadv"><b>这次没有给出解读</b>' +
    '<div style="margin-top:6px">' + esc(msg) + '</div></div>', ai);
  focusSection('aipanel');
}

function refreshAIState(cb){
  fetch('/api/v3/ai/state', { credentials: 'same-origin', cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ AISTATE = (j && j.data) ? j.data : null; if (cb) cb(AISTATE); })
    .catch(function(){ if (cb) cb(null); });
}

function runAI(){
  if (!CUR) { V3.toast('先选一支视频'); return; }
  var b = document.getElementById('aiBtn');
  if (b) { b.disabled = true; b.textContent = '正在解读…'; }
  aiShell('<div class="loading">正在把这张诊断卡的结构化数据交给模型解读…</div>', AISTATE);
  fetch('/api/v3/ai/report', { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bvid: CUR.video.bvid }) })
    .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }); })
    .then(function(o){
      if (o.s === 200 && o.j && o.j.code === 0) { aiOK(o.j.data, (o.j.meta || {}).ai); }
      else { aiBlocked((o.j && (o.j.detail || o.j.error)) || ('HTTP ' + o.s), null); }
    })
    .catch(function(e){ aiBlocked('请求没发出去：' + ((e && e.message) || e), null); })
    .then(function(){
      if (b) { b.disabled = false; b.textContent = '✦ AI 解读'; }
      refreshAIState(function(ai){
        var g = document.querySelector('.aigate');
        if (g) g.innerHTML = aiUsageLine(ai);
      });
    });
}

(function initAI(){
  var b = document.getElementById('aiBtn');
  if (b) b.onclick = runAI;
  refreshAIState(function(ai){
    if (ai && b) {
      void ai;   // 用量只在管理员页显示，用户侧不露（2026-10-16 用户要求）
    }
  });
})();

/* 折叠技术层 */
