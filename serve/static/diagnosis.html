<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频节奏诊断卡 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<script src="vendor/echarts.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="v3nav.js"></script>
<link rel="stylesheet" href="v3.css">
<style>
/* 本页专有（共用外壳见 v3.css） */
#shot{padding:0}
.poshero{font-size:17px;font-weight:700;margin-bottom:4px}
.possub{font-size:13px;color:var(--dim);margin-bottom:16px}
.posrow{display:grid;grid-template-columns:96px 1fr 96px 150px;gap:12px;align-items:center;
  padding:7px 0;font-size:13px}
.posrow+.posrow{border-top:1px dashed var(--line)}
.poslab{font-weight:600;font-size:13px}
.postrack{position:relative;height:7px;background:var(--neutral-soft);border-radius:4px}
.postrack i{position:absolute;top:-3px;width:3px;height:13px;border-radius:2px;background:var(--acc)}
.postrack b{position:absolute;left:50%;top:-2px;width:1px;height:11px;background:var(--faint)}
.posval{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.poshuman{color:var(--dim);font-size:12.5px}
#chart{height:400px;width:100%}
.chartcap{font-size:13.5px;color:var(--fg);background:var(--acc-soft);border-radius:10px;
  padding:10px 14px;margin-top:6px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-bottom:8px}
.legend i{display:inline-block;width:22px;height:0;border-top-width:3px;border-top-style:solid;
  vertical-align:middle;margin-right:6px}
.legend .sw{display:inline-block;width:16px;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}
.peaks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;
  background:var(--card);transition:.15s}
.chip:hover,.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.dmpanel{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--neutral-soft)}
.dmpanel h4{font-size:13px;margin-bottom:8px;font-weight:700}
.dmpanel ul{margin-left:18px;font-size:13px;color:var(--fg)}
.dmpanel li{margin:2px 0}
.dev{border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:11px;background:var(--card);
  cursor:pointer;transition:.15s}
.dev:hover{border-color:var(--acc);box-shadow:var(--shadow)}
.dev.dim{border-color:var(--acc);background:var(--acc-soft)}
.devtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.devname{font-size:15px;font-weight:700}
.cmp{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.cmp>span:last-child{display:block;background:var(--neutral-soft);border-radius:5px;height:16px;overflow:hidden}
.cmp .b{display:block;height:16px;border-radius:5px;min-width:3px}
.cmp .bl{color:var(--dim);text-align:right}
.cmp .mid{background:var(--neutral);opacity:.45}
.cmp .you{background:var(--acc)}
.devtext{font-size:14px;margin:8px 0 6px}
.devadv{font-size:13.5px;color:var(--fg);background:var(--neutral-soft);border-left:3px solid var(--acc);
  border-radius:0 9px 9px 0;padding:9px 13px;margin-top:8px}
.devadv b{color:var(--acc)}
.devfoot{font-size:12px;color:var(--faint);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.bench{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bcard{border:1px solid var(--line);border-radius:13px;padding:15px 16px;background:var(--card);
  display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.bcard:hover{border-color:var(--acc);box-shadow:var(--shadow)}
.bcard.on{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.15)}
.btitle{font-size:14px;font-weight:700;line-height:1.45;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bsim{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:8px}
.blike{font-size:13px;color:var(--fg);margin-bottom:9px;flex:1}
.bout{font-size:13.5px;font-weight:700;color:var(--good)}
.bout.none{color:var(--faint);font-weight:500;font-size:12.5px}
.blearn{font-size:12.5px;color:var(--dim);border-top:1px dashed var(--line);padding-top:9px;margin-top:9px}
.bgo{font-size:12.5px;color:var(--acc);font-weight:700;margin-top:9px}
.act{display:flex;gap:13px;padding:12px 0}
.act+.act{border-top:1px dashed var(--line)}
.actn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.actt{flex:1;font-size:14.5px;line-height:1.6}
.actb{font-size:12.5px;color:var(--faint);margin-top:4px}
.caveat{font-size:12.5px;color:var(--dim);background:var(--neutral-soft);border-radius:10px;
  padding:11px 14px;margin-top:14px}
/* 可点关键词：结论 → 证据 */
.jump{color:var(--acc);cursor:pointer;border-bottom:1px dashed var(--acc);transition:.12s}
.jump:hover{background:var(--acc-soft);border-radius:4px}
.vproblem .jump{border-bottom-width:2px}
.jumphint{font-size:12.5px;color:var(--faint);margin-top:6px}
/* 证据面板：这一段观众在刷什么 */
.dmcmp{display:flex;gap:22px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:10px;font-size:13px;align-items:baseline}
.dmcmp b{font-size:19px;font-variant-numeric:tabular-nums}
.dmcmp .u b{color:var(--acc)} .dmcmp .p b{color:var(--neutral)}
.dmwhy{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.dmlist{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;
  background:var(--card);padding:6px 12px}
.dmline{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13px;padding:4px 0;
  border-bottom:1px dashed var(--line)}
.dmline:last-child{border-bottom:0}
.dmline .dt{color:var(--faint);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.dmempty{font-size:13px;color:var(--dim);padding:14px 4px}
/* 行动建议可点 */
.act{cursor:pointer;border-radius:8px;transition:.12s}
.act:hover{background:var(--acc-soft)}
.actmore{font-size:12px;color:var(--acc);font-weight:700;margin-top:5px}
/* 空状态 */
.empty{padding:56px 24px;text-align:center}
.empty h2{font-size:23px;font-weight:800;margin-bottom:10px}
.empty p{color:var(--dim);font-size:14px;margin-bottom:20px;line-height:1.9}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty .eg{margin-top:22px;font-size:12.5px;color:var(--faint)}
.hideWhenEmpty{display:none!important}
@media (max-width:720px){
  .posrow{grid-template-columns:74px 1fr 84px;gap:9px}
  .poshuman{display:none}
  #chart{height:300px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar" id="v3top"></div>

  <div class="topbar">
    <input id="search" placeholder="搜标题 / 分区 / BV号" style="flex:1 1 220px;min-width:170px">
    <select id="picker" style="flex:1 1 280px;min-width:190px"></select>
    <button class="btn" id="randBtn" title="随机换一支同类视频">随机一支</button>
    <button class="btn" id="favBtn" title="收藏这支视频，之后在「我的收藏」里能直接点开">☆ 收藏这支</button>
    <button class="btn primary" id="shotBtn" title="把这张诊断卡存成图片">存为图片</button>
  </div>

  <div class="card" id="shot">
    <div id="content"><div class="loading">正在加载诊断快照…</div></div>
  </div>

  <details class="tech" id="techbox">
    <summary>技术详情（口径 / 原始特征 / 算法参数 —— 主视图不显示这些术语）</summary>
    <div class="techbody" id="techbody"></div>
  </details>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async p => { const r = await fetch(p); if (!r.ok) throw new Error((await r.json()).detail || r.status); return (await r.json()).data; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => { if (s == null) return ''; s = Math.round(s); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const TONE = { warn:['需要调整','warn'], ok:['节奏健康','ok'] };
const DMCOLOR = { good:'var(--good)', bad:'var(--warn)', neutral:'var(--neutral)' };

let IDX = [], CUR = null, CHART = null, FOCUS = null, BENCH = null, PEAK = null;

/* ── 启动 ── */
const EXAMPLE = {bvid: 'BV1PJpE6QEx6', why: '电子竞技区，开场吸引力只有同类的 42%——正好用来演示"点结论 → 看这一段观众在刷什么"'};

(async function init(){
  const usp = new URLSearchParams(location.search);
  try {
    IDX = await api('/api/diagnosis/index');
    fillPicker();
    const want = usp.get('bvid');
    if (want && IDX.some(x => x.bvid === want)) {
      $('#picker').value = want;
      setName(true);
      await load(want);
    } else {
      emptyState();
    }
  } catch(e) {
    $('#content').innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>';
  }
})();

/* 工具条上的按钮只在真的有卡片时才出现 */
function setName(has){
  ['#favBtn', '#shotBtn', '#randBtn'].forEach(function(k){
    const el = $(k); if (el) el.classList.toggle('hideWhenEmpty', !has);
  });
}

/* 空状态：没给 bvid 时给一个"试试这个视频"，降低试用门槛 */
function emptyState(){
  setName(false);
  $('#content').innerHTML =
    '<div class="empty">' +
      '<h2>输一个 BV 号，看看这支视频的节奏问题出在哪</h2>' +
      '<p>系统会告诉你四件事：<b>你在同类里排第几</b>、<b>哪几维偏离了同类</b>、' +
      '<b>节奏最像谁以及它后来怎样</b>、<b>一句话该怎么调</b>。<br>' +
      '不知道输什么就用下面这个例子——它是真实采集的视频。</p>' +
      '<div class="row">' +
        '<button class="btn primary" id="tryBtn" style="padding:11px 22px;font-size:14.5px">试试这个视频</button>' +
        '<button class="btn" id="pickBtn" style="padding:11px 22px;font-size:14.5px">从列表里挑一支</button>' +
      '</div>' +
      '<div class="eg">例：' + esc(EXAMPLE.bvid) + '　' + esc(EXAMPLE.why) + '</div>' +
    '</div>';
  $('#tryBtn').onclick = function(){ $('#picker').value = EXAMPLE.bvid; setName(true); load(EXAMPLE.bvid); };
  $('#pickBtn').onclick = function(){ $('#picker').focus(); $('#picker').click(); };
}

function fillPicker(){
  const groups = {};
  IDX.forEach(x => { (groups[x.tname || '未知分区'] = groups[x.tname || '未知分区'] || []).push(x); });
  let h = '';
  Object.keys(groups).sort().forEach(t => {
    h += '<optgroup label="' + esc(t) + '（' + groups[t].length + '）">';
    groups[t].forEach(x => {
      h += '<option value="' + x.bvid + '">' + esc((x.title || '').slice(0, 40)) + '</option>';
    });
    h += '</optgroup>';
  });
  $('#picker').innerHTML = h;
}
$('#picker').onchange = e => load(e.target.value);
$('#search').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  const hit = !q ? IDX[0] : IDX.find(x => x.bvid.toLowerCase().includes(q) ||
      (x.title || '').toLowerCase().includes(q) || (x.tname || '').toLowerCase().includes(q));
  if (hit) { $('#picker').value = hit.bvid; load(hit.bvid); }
};
$('#randBtn').onclick = () => {
  const x = IDX[Math.floor(Math.random() * IDX.length)];
  $('#picker').value = x.bvid; load(x.bvid);
};
// 主题由统一顶栏（v3nav.js）管；切完通知本页重画图表
V3.onTheme = () => { if (CHART) { CHART.dispose(); CHART = null; drawChart(); } };

// 收藏（登录后才有意义；接口 401 时按钮自己隐藏）
function refreshFav(){
  const b = $('#favBtn'); if (!b || !CUR) return;
  fetch('/api/favorites/status?bvid=' + encodeURIComponent(CUR.video.bvid), {credentials:'same-origin'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { b.textContent = j.data.favorited ? '★ 已收藏' : '☆ 收藏这支'; })
    .catch(() => { b.style.display = 'none'; });
}
$('#favBtn').onclick = () => {
  if (!CUR) return;
  fetch('/api/favorites', {method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({bvid: CUR.video.bvid})})
    .then(r => r.json()).then(j => {
      if (j.data) { $('#favBtn').textContent = j.data.favorited ? '★ 已收藏' : '☆ 收藏这支'; }
      if (window.V3 && V3.toast) V3.toast(j.data && j.data.favorited ? '已加入我的收藏' : '已取消收藏');
    }).catch(() => {});
};
$('#shotBtn').onclick = async () => {
  const btn = $('#shotBtn'); btn.textContent = '生成中…'; btn.disabled = true;
  try {
    const node = $('#shot');
    const canvas = await html2canvas(node, {backgroundColor: getComputedStyle(document.body).backgroundColor,
      scale: 2, useCORS: true, windowWidth: node.scrollWidth});
    const a = document.createElement('a');
    a.download = '节奏诊断卡_' + (CUR ? CUR.video.bvid : 'video') + '.png';
    a.href = canvas.toDataURL('image/png'); a.click();
  } catch(e) { alert('存图失败：' + e.message); }
  btn.textContent = '存为图片'; btn.disabled = false;
};

/* ── 加载一支视频 ── */
async function load(bvid){
  $('#content').innerHTML = '<div class="loading">正在算这张诊断卡…</div>';
  FOCUS = null; BENCH = null; PEAK = null;
  const d = await api('/api/video/' + bvid + '/diagnosis');
  CUR = d;
  // 只改 bvid，保留 drill/bench/act —— 直接写 '?bvid=...' 会把深链接参数洗掉
  var u = new URLSearchParams(location.search);
  u.set('bvid', bvid);
  history.replaceState(null, '', '?' + u.toString());
  render();
}

function render(){
  const d = CUR;
  $('#content').innerHTML = verdictHTML(d) + positionHTML(d) + chartHTML(d) + devHTML(d) + benchHTML(d) + actionHTML(d);
  bind();
  drawChart();
  drawTech(d);
  refreshFav();
  // 深链接：?drill=N / ?bench=N / ?act=N 直接落到某个交互状态
  // （用户能把"看这条证据"的链接发给别人；也让自动化截图能核验）
  const usp = new URLSearchParams(location.search);
  if (usp.get('drill') != null) { setTimeout(() => drillDeviation(+usp.get('drill'), true), 260); return; }
  if (usp.get('bench') != null) { selectBench(+usp.get('bench')); return; }
  if (usp.get('act') != null) { setTimeout(() => runAction(+usp.get('act')), 260); return; }
  // 军规 7：永远"你 vs 同类 vs 对标对象"三线对照 —— 默认叠上最像的那支
  if ((d.benchmarks || []).length) selectBench(0);
}

/* 把当前交互状态写进地址栏，便于分享与复现 */
function markUrl(k, v){
  const u = new URLSearchParams(location.search);
  ['drill', 'bench', 'act'].forEach(x => u.delete(x));
  if (k) u.set(k, v);
  history.replaceState(null, '', '?' + u.toString());
}

/* 选中一支对标对象 → 上图叠它的曲线 */
function selectBench(i, toggle){
  if (toggle && BENCH === i) {
    BENCH = null;
  } else {
    BENCH = i;
  }
  document.querySelectorAll('.bcard').forEach((y, k) => y.classList.toggle('on', k === BENCH));
  if (toggle) markUrl(BENCH == null ? null : 'bench', BENCH);
  const bseg = (BENCH != null) ? (CUR.benchmarks[BENCH].learn_seg || null) : null;
  FOCUS = bseg;
  drawChart();
  if (BENCH == null) { $('#cap').textContent = CUR.curve ? CUR.curve.summary : ''; $('#dmbox').innerHTML = ''; return; }
  const b = CUR.benchmarks[BENCH];
  $('#cap').innerHTML = esc(CUR.curve ? CUR.curve.summary : '') +
    '<br><b>对标《' + esc(b.title) + '》</b>：' + esc(b.like_text) +
    '　上图橙色虚线 = 它的曲线（同类中位 = 灰色虚线，你 = 蓝色实线）。' +
    (b.learn_seg ? '<br><b style="color:#f59e0b">它这里比你好</b>：' + esc(b.learn_label || '') +
      '（第 ' + b.learn_seg[0] + '–' + b.learn_seg[1] + '%）——' +
      '它在这一段更接近同类中位，' + esc(b.outcome_text) + '。' : '');
  $('#dmbox').innerHTML = '<div class="dmpanel"><h4>看它的完整诊断卡</h4>' +
    '<button class="btn" onclick="location.search=\'?bvid=' + b.bvid + '\'">打开《' + esc(b.title) + '》的诊断卡 ↗</button>' +
    '<div style="font-size:12.5px;color:var(--dim);margin-top:8px">后来表现：' + esc(b.outcome_text) + '</div></div>';
}

/* ① 一句话结论 */
function verdictHTML(d){
  const v = d.verdict, t = TONE[v.tone] || TONE.ok;
  const vi = d.video;
  const devs = d.deviations || [];
  // 结论 → 证据：大字问题与结论里的【维度】都做成可点，点了就落到那一维的证据段
  const byLabel = {};
  devs.forEach((x, i) => { byLabel[x.label] = i; });
  const ci = devs.findIndex(x => x._dim && x._dim === v._concern_dim);
  const jump = (i, txt) => '<span class="jump" data-jump="' + i + '" title="点这里看证据：这一段观众在刷什么">' + txt + '</span>';
  const problem = ci >= 0 ? jump(ci, esc(v.problem_5s)) : esc(v.problem_5s);
  const head = esc(v.headline).replace(/【([^】]{2,14})】/g, function(m, lab){
    return byLabel[lab] != null ? jump(byLabel[lab], '【' + lab + '】') : m;
  });
  return '<div class="verdict" id="sec-verdict">' +
    '<span class="tone ' + t[1] + '">' + (v.tone === 'ok' ? '●' : '▲') + ' ' + t[0] + '</span>' +
    '<div class="vmain">' +
      '<div class="vproblem">' + problem + '</div>' +
      '<div class="vhead">' + head + '</div>' +
      (ci >= 0 ? '<div class="jumphint">↑ 点上面加下划线的词，直接跳到曲线上的对应段和那一段的真实弹幕</div>' : '') +
      (v.detail ? '<div class="vdetail">' + esc(v.detail) + '</div>' : '') +
      '<div class="video">' +
        '<span>' + esc(vi.title || vi.bvid) + '</span>' +
        '<span>' + esc(vi.up_name || '') + '</span>' +
        '<span>' + esc(vi.tname || '') + '</span>' +
        (vi.duration_text ? '<span>时长 ' + vi.duration_text + '</span>' : '') +
        (vi.play_text ? '<span>播放 ' + vi.play_text + '</span>' : '') +
        '<a href="' + vi.url + '" target="_blank" rel="noopener">去 B站看这支视频 ↗</a>' +
      '</div>' +
    '</div></div>';
}

/* ② 定位 */
function positionHTML(d){
  const p = d.position;
  const rows = p.dims.map((x, i) =>
    '<div class="posrow' + (i >= 6 ? ' more hidden' : '') + '">' +
      '<div class="poslab">' + esc(x.label) + '</div>' +
      '<div class="postrack"><b></b><i style="left:' + Math.max(0, Math.min(100, x.pct == null ? 50 : x.pct)) + '%"></i></div>' +
      '<div class="posval">' + esc(x.position_text) + '</div>' +
      '<div class="poshuman">' + esc(x.human || '') + '</div>' +
    '</div>').join('');
  return '<div class="sec" id="sec-position">' +
    '<div class="sechead"><span class="secno">①</span><span class="sectitle">我在哪</span>' +
      '<span class="secnote">左 = 同类靠后 ｜ 右 = 同类靠前' +
      (d.scope_note ? ' ｜ ' + esc(d.scope_note) : '') + '</span></div>' +
    '<div class="poshero">' + esc(p.headline) + '</div>' +
    '<div class="possub">' + esc(p.detail || '') + '　（同类＝' + esc(p.scope) + '，共 ' + p.n_peers + ' 支）</div>' +
    rows +
    (p.dims.length > 6 ? '<button class="morebtn" id="morePos">查看其余 ' + (p.dims.length - 6) + ' 项 ▾</button>' : '') +
  '</div>';
}

/* ③ 对标对比图 */
function chartHTML(d){
  const c = d.curve;
  if (!c) return '<div class="sec"><div class="sechead"><span class="secno">②</span><span class="sectitle">对标对比图</span></div>' +
    '<div class="dim">这支视频没有密度曲线数据。</div></div>';
  const peaks = (c.peaks || []).map(p =>
    '<span class="chip" data-peak="' + p.pct + '">爆点 ' + (p.label || '') + ' · 第 ' + p.pct + '%</span>').join('');
  return '<div class="sec" id="sec-curve">' +
    '<div class="sechead"><span class="secno">②</span><span class="sectitle">你的曲线 vs 同类</span>' +
      '<span class="secnote">x 轴 = 播放进度 ｜ y 轴 = 该位置上的弹幕多少</span></div>' +
    '<div class="legend">' +
      '<span><i style="border-color:var(--acc)"></i>你</span>' +
      '<span><i style="border-color:var(--neutral);border-top-style:dashed"></i>同类中位（' + c.n_peers + ' 支）</span>' +
      '<span><span class="sw" style="background:var(--envelope);border:1px solid var(--line)"></span>同类常见区间（中间一半）</span>' +
      '<span><i style="border-color:#f59e0b;border-top-style:dotted"></i>对标对象</span>' +
    '</div>' +
    '<div id="chart"></div>' +
    '<div class="chartcap" id="cap">' + esc(c.summary) + '</div>' +
    (peaks ? '<div class="peaks">' + peaks + '</div>' : '') +
    '<div id="dmbox"></div>' +
  '</div>';
}

function drawChart(){
  const c = CUR.curve; if (!c) return;
  const el = $('#chart'); if (!el) return;
  if (CHART) { CHART.dispose(); CHART = null; }
  CHART = echarts.init(el, null, {renderer: 'canvas'});
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const axis = dark ? '#98a1ae' : '#6b7480', spl = dark ? '#262b36' : '#eef0f4';
  // canvas 不认 CSS 变量：同类区间包络色必须给字面 rgba
  const envColor = dark ? 'rgba(91,141,255,.16)' : 'rgba(43,108,255,.12)';
  const xs = c.you.map((_, i) => i);
  const dur = c.duration || 0;
  const bandArea = (c.bands || []).map(b => ([
    {xAxis: b.from, itemStyle: {color: b.kind === 'below' ? 'rgba(224,47,54,.10)' : 'rgba(14,159,110,.10)'}},
    {xAxis: b.to}
  ]));
  const focusArea = FOCUS != null ? [[{xAxis: FOCUS[0], itemStyle: {color: 'rgba(245,158,11,.16)'}}, {xAxis: FOCUS[1]}]] : [];
  const bch = BENCH != null ? (CUR.benchmarks[BENCH].curve || null) : null;
  const series = [
    {name: '_p25', type: 'line', stack: 'env', data: c.p25, showSymbol: false, silent: true,
     lineStyle: {opacity: 0}, areaStyle: {opacity: 0}, tooltip: {show: false}},
    {name: '同类常见区间', type: 'line', stack: 'env', data: c.p75.map((v, i) => Math.max(0, v - c.p25[i])),
     showSymbol: false, silent: true, lineStyle: {opacity: 0}, areaStyle: {color: envColor}},
    {name: '同类中位', type: 'line', data: c.median, showSymbol: false, z: 3,
     lineStyle: {width: 2, type: 'dashed', color: axis}},
    {name: '你', type: 'line', data: c.you, showSymbol: false, z: 5, smooth: 0,
     lineStyle: {width: 3, color: '#2b6cff'}, itemStyle: {color: '#2b6cff'},
     areaStyle: {color: 'rgba(43,108,255,.06)'},
     markArea: {silent: true, data: bandArea.concat(focusArea)},
     markPoint: {symbol: 'triangle', symbolSize: 11, itemStyle: {color: '#f59e0b'},
       label: {show: false},
       data: (c.peaks || []).map(p => ({name: '爆点', coord: [p.pct, c.you[p.pct]], value: p.pct,
         peakIdx: (c.peaks || []).indexOf(p)}))}}
  ];
  if (bch) series.push({name: '对标对象', type: 'line', data: bch, showSymbol: false, z: 4,
    lineStyle: {width: 2, type: 'dotted', color: '#f59e0b'}, itemStyle: {color: '#f59e0b'}});
  const fmt = v => dur ? mmss(v / 100 * dur) : '';
  CHART.setOption({
    backgroundColor: 'transparent',
    grid: {left: 52, right: 18, top: 16, bottom: 46},
    tooltip: {trigger: 'axis', axisPointer: {type: 'line'},
      backgroundColor: dark ? '#171a21' : '#fff', borderColor: dark ? '#262b36' : '#e3e6ec',
      textStyle: {color: dark ? '#e6e9ef' : '#161a22', fontSize: 12},
      formatter: ps => {
        const i = ps[0].dataIndex;
        const pct = i + '%';
        const r = c.median[i] ? Math.round(c.you[i] / c.median[i] * 100) : null;
        return '<b>播放进度 ' + pct + (dur ? '（' + mmss(i / 100 * dur) + '）' : '') + '</b><br>' +
          '你：' + (c.you[i] * 100).toFixed(2) + '%　同类中位：' + (c.median[i] * 100).toFixed(2) + '%<br>' +
          '同类常见区间：' + (c.p25[i] * 100).toFixed(2) + '% ~ ' + (c.p75[i] * 100).toFixed(2) + '%' +
          (r != null ? '<br>你 = 同类中位的 <b>' + r + '%</b>' : '') +
          (bch ? '<br>对标对象：' + (bch[i] * 100).toFixed(2) + '%' : '');
      }},
    xAxis: {type: 'category', data: xs, boundaryGap: false, name: '播放进度', nameLocation: 'middle',
      nameGap: 30, nameTextStyle: {color: axis, fontSize: 12},
      axisLine: {lineStyle: {color: spl}}, axisTick: {show: false},
      axisLabel: {color: axis, fontSize: 11, interval: 9,
        formatter: v => v + '%' + (dur ? '\n' + mmss(v / 100 * dur) : '')}},
    yAxis: {type: 'value', name: '弹幕多少', nameTextStyle: {color: axis, fontSize: 12},
      axisLine: {show: false}, axisTick: {show: false},
      axisLabel: {color: axis, fontSize: 11, formatter: v => (v * 100).toFixed(1) + '%'},
      splitLine: {lineStyle: {color: spl}}},
    series: series
  });
  CHART.on('click', p => {
    if (p.componentType === 'markPoint' && p.data && p.data.peakIdx != null) showPeak(p.data.peakIdx);
  });
  window.addEventListener('resize', () => CHART && CHART.resize());
}

/* ④ 偏离诊断 */
function devHTML(d){
  const list = d.deviations || [];
  if (!list.length) return '<div class="sec"><div class="sechead"><span class="secno">③</span><span class="sectitle">哪里和同类不一样</span></div>' +
    '<div class="dim">这支视频的节奏和同类高度一致，没有值得单独指出的偏离项。</div></div>';
  return '<div class="sec" id="sec-dev">' +
    '<div class="sechead"><span class="secno">③</span><span class="sectitle">哪里和同类不一样</span>' +
      '<span class="secnote">只列最明显的 ' + list.length + ' 项 ｜ 点卡片可在上图看这一段</span></div>' +
    list.map((x, i) => {
      const mx = Math.max(Math.abs(x.value || 0), Math.abs(x.median || 0), 1e-9);
      return '<div class="dev" data-dev="' + i + '">' +
        '<div class="devtop">' +
          '<span class="devname">' + esc(x.label) + '</span>' +
          '<span class="pill ' + (x.color === 'green' ? 'good' : x.color === 'red' ? 'bad' : 'gray') + '">' +
            x.direction_mark + ' ' + esc(x.direction_label) + '</span>' +
          '<span class="pill lv">' + esc(x.level) + ' ｜ ' + esc(x.pole) + '</span>' +
          '<span class="pill lv">' + esc(x.position_text) + '</span>' +
        '</div>' +
        '<div class="cmp"><span class="bl">同类中位</span><span><span class="b mid" style="width:' +
          (Math.abs(x.median || 0) / mx * 100).toFixed(1) + '%"></span></span></div>' +
        '<div class="cmp"><span class="bl">你</span><span><span class="b you" style="width:' +
          (Math.abs(x.value || 0) / mx * 100).toFixed(1) + '%"></span></span></div>' +
        '<div class="devtext">' + esc(x.compare_text) + '</div>' +
        '<div class="devadv"><b>怎么调：</b>' + esc(x.advice) + '</div>' +
        '<div class="devfoot">' +
          '<span class="linkish">▸ 看证据：上图高亮 ' + esc(x.drill_seg_name || x.seg_name) +
            '，并列出这一段观众在刷什么</span>' +
          (x.ref ? '<span>同类参照：《' + esc(x.ref.title) + '》</span>' : '') +
          (x.direction === 'neutral' ? '<span>形状维差异，无好坏证据</span>' : '<span>该维与后续表现有稳定关联</span>') +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
}

/* ⑤ 相似对标 */
function benchHTML(d){
  const bs = d.benchmarks || [];
  if (!bs.length) return '';
  return '<div class="sec" id="sec-bench">' +
    '<div class="sechead"><span class="secno">④</span><span class="sectitle">节奏最像谁，它们后来怎样</span>' +
      '<span class="secnote">同类＝' + esc(d.knn_scope) + ' ｜ 点卡片可把它的曲线叠到上图和看它的诊断卡</span></div>' +
    '<div class="bench">' + bs.map((b, i) =>
      '<div class="bcard" data-bench="' + i + '">' +
        '<div class="btitle">《' + esc(b.title) + '》</div>' +
        '<div class="bsim">' + esc(b.similarity_label) + ' ｜ ' + esc(b.tname || '') + '</div>' +
        '<div class="blike">' + esc(b.like_text) + '</div>' +
        '<div class="bout' + (b.has_outcome ? '' : ' none') + '">后来：' + esc(b.outcome_text) + '</div>' +
        '<div class="blearn">' + esc(b.learn_text) + '</div>' +
        (b.learn_seg ? '<div class="blearn" style="border-top:0;padding-top:2px;color:var(--acc)">' +
          '▸ 点卡片：把它叠到上图，并高亮它比你好的那一段（' + esc(b.learn_seg_name || '') + '）</div>' : '') +
        '<div class="bgo">看它的诊断卡 ↗</div>' +
      '</div>').join('') + '</div>' +
  '</div>';
}

/* ⑥ 行动 */
function actionHTML(d){
  const v = d.verdict;
  return '<div class="sec" id="sec-action">' +
    '<div class="sechead"><span class="secno">⑤</span><span class="sectitle">怎么调</span></div>' +
    '<div class="sechead" style="margin-top:-6px"><span class="secnote">点任意一条：直接定位到该照谁、照哪一段</span></div>' +
    v.actions.map(a =>
      '<div class="act" data-act="' + a.n + '">' +
        '<div class="actn">' + a.n + '</div>' +
        '<div><div class="actt">' + esc(a.text) + '</div>' +
        '<div class="actb">依据：' + esc(a.basis || '') + '</div>' +
        (a.ref ? '<div class="actmore">▸ 点这里：' +
          (a.seg ? '高亮《' + esc(a.ref.title) + '》该照的那一段（第 ' + a.seg[0] + '–' + a.seg[1] + '%）'
                 : '把《' + esc(a.ref.title) + '》叠到上图') + '</div>' : '') +
        '</div>' +
      '</div>').join('') +
    '<div class="caveat">' + esc(v.caveat) + '　' + esc(v.curve_caveat) + '</div>' +
  '</div>';
}

/* 交互绑定 */
function bind(){
  const mp = $('#morePos');
  if (mp) mp.onclick = () => {
    document.querySelectorAll('.posrow.more').forEach(x => x.classList.toggle('hidden'));
    mp.textContent = mp.textContent.includes('查看其余') ? '收起 ▴' : '查看其余 ' + (CUR.position.dims.length - 6) + ' 项 ▾';
  };
  document.querySelectorAll('.dev').forEach(el => el.onclick = () => drillDeviation(+el.dataset.dev, false));
  document.querySelectorAll('.jump[data-jump]').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    drillDeviation(+el.dataset.jump, true);
  });
  document.querySelectorAll('.act[data-act]').forEach(el => el.onclick = () => runAction(+el.dataset.act));
  document.querySelectorAll('.bcard').forEach(el => el.onclick = () => selectBench(+el.dataset.bench, true));
  document.querySelectorAll('.chip[data-peak]').forEach(el => el.onclick = () => {
    const pct = +el.dataset.peak;
    const i = (CUR.curve.peaks || []).findIndex(p => p.pct === pct);
    showPeak(i);
  });
}

/* ── 证据钻取：点结论关键词或偏离卡 → 高亮该段 + 拉这一段的真实弹幕 ── */
function pctToSec(pct){
  const dur = (CUR.video && CUR.video.duration) || 0;
  return pct / 100 * dur;
}

function drillDeviation(i, scroll){
  const x = CUR.deviations[i]; if (!x) return;
  markUrl('drill', i);
  BENCH = null;
  document.querySelectorAll('.bcard').forEach(y => y.classList.remove('on'));
  document.querySelectorAll('.dev').forEach((y, k) => y.classList.toggle('dim', k === i));
  FOCUS = x.drill_seg || x.seg || null;
  drawChart();
  const seg = FOCUS || [0, 100];
  $('#cap').innerHTML = '<b>' + esc(x.label) + '</b>：' + esc(x.compare_text) +
    '　<span style="color:var(--dim)">高亮段 = 上图橙色区域（' + esc(x.drill_seg_name || '') + '）</span>';
  const anchor = scroll ? $('#sec-verdict') : $('#sec-curve');
  if (anchor) anchor.scrollIntoView({behavior: 'smooth', block: 'start'});
  setTimeout(() => loadDanmaku(x, seg), scroll ? 420 : 0);
}

async function loadDanmaku(x, seg){
  const box = $('#dmbox'); if (!box) return;
  const dur = (CUR.video && CUR.video.duration) || 0;
  if (!dur) { box.innerHTML = '<div class="dmpanel"><div class="dmempty">这支视频没有时长数据，无法定位时间段。</div></div>'; return; }
  const t0 = pctToSec(seg[0]), t1 = pctToSec(seg[1]);
  box.innerHTML = '<div class="dmpanel"><div class="dmempty">正在取第 ' + seg[0] + '–' + seg[1] +
    '%（' + mmss(t0) + '–' + mmss(t1) + '）的弹幕…</div></div>';
  try {
    const d = await api('/api/danmaku_at?bvid=' + encodeURIComponent(CUR.video.bvid) +
      '&t0=' + t0.toFixed(1) + '&t1=' + t1.toFixed(1) + '&limit=80');
    renderDanmaku(x, seg, d, t0, t1);
  } catch(e) {
    box.innerHTML = '<div class="dmpanel"><div class="dmempty">取弹幕失败：' + esc(e.message) + '</div></div>';
  }
}

function renderDanmaku(x, seg, d, t0, t1){
  const mine = d.n_in_range;
  const peer = x.peer_count;
  const ratio = (peer && mine != null) ? Math.round(mine / peer * 100) : null;
  const cmp = peer ? '<div class="dmcmp">' +
      '<span class="u">你这一段：<b>' + mine + '</b> 条</span>' +
      '<span class="p">同类中位：<b>' + peer + '</b> 条</span>' +
      (ratio != null ? '<span>你 = 同类的 <b>' + ratio + '%</b></span>' : '') +
    '</div>' : '';
  const list = d.items && d.items.length
    ? '<div class="dmlist">' + d.items.map(it =>
        '<div class="dmline"><span class="dt">' + mmss(it.t) + '</span><span>' + esc(it.txt) + '</span></div>').join('') +
      '</div>' + (d.truncated ? '<div class="dmwhy" style="margin-top:8px">（只显示前 ' + d.returned + ' 条，这一段共 ' + mine + ' 条）</div>' : '')
    : '<div class="dmlist"><div class="dmempty">这一段时间里没有弹幕——' +
      (ratio != null && ratio < 60 ? '这本身就是"这一段没抓住人"的直接证据。' : '可以换个偏离维再看看。') + '</div></div>';
  $('#dmbox').innerHTML = '<div class="dmpanel">' +
    '<h4>' + esc(x.label) + '｜第 ' + seg[0] + '–' + seg[1] + '%（' + mmss(t0) + '–' + mmss(t1) +
      '）这一段，观众在刷什么</h4>' +
    '<div class="dmwhy">' + esc(x.drill_why || '') + '　' + esc(x.compare_text) + '</div>' +
    cmp + list +
    '<div style="font-size:12px;color:var(--faint);margin-top:9px">' +
      '弹幕按发送时间排序，原文未做任何筛选或改写；"同类中位"由同分区各视频的曲线换算，是估计值。' +
    '</div></div>';
}

/* ── 行动落地：点建议 → 定位到该照谁、照哪一段 ── */
function runAction(n){
  const a = (CUR.verdict.actions || []).find(x => x.n === n); if (!a) return;
  markUrl('act', n);
  const bi = a.ref ? (CUR.benchmarks || []).findIndex(b => b.bvid === a.ref.bvid) : -1;
  if (bi >= 0) { selectBench(bi, false); }
  if (a.seg) {
    FOCUS = a.seg;
    drawChart();
    const b = bi >= 0 ? CUR.benchmarks[bi] : null;
    $('#cap').innerHTML = '<b>照着做</b>：' + esc(a.text) +
      '　<span style="color:var(--dim)">上图橙色区域 = 该照的那一段（第 ' + a.seg[0] + '–' + a.seg[1] + '%）' +
      (b ? '；橙色虚线 = 《' + esc(b.title) + '》的曲线' : '') + '</span>';
  }
  document.querySelectorAll('.act').forEach(el => el.classList.toggle('dim', +el.dataset.act === n));
  const anchor = $('#sec-curve'); if (anchor) anchor.scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* 钻取：点爆点 → 看当时弹幕 */
function showPeak(i){
  const p = (CUR.curve.peaks || [])[i]; if (!p) return;
  PEAK = i;
  document.querySelectorAll('.chip[data-peak]').forEach(y => y.classList.toggle('on', +y.dataset.peak === p.pct));
  $('#dmbox').innerHTML = '<div class="dmpanel">' +
    '<h4>爆点 ' + mmss(p.t0) + ' – ' + mmss(p.t1) + '（播放进度第 ' + p.pct + '%）当时的弹幕</h4>' +
    (p.danmaku && p.danmaku.length ? '<ul>' + p.danmaku.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>'
      : '<div>这一时间段没有可展示的弹幕文本。</div>') +
    '<div style="font-size:12px;color:var(--faint);margin-top:8px">共检出 ' + (CUR.curve.peaks || []).length +
      ' 个反应最集中的时间段；这里是其中最集中的一个。</div></div>';
}

/* 折叠技术层 */
function drawTech(d){
  const t = d.tech, m = t.snapshot_meta || {};
  const f = t.raw_features || {}, p = t.percentiles || {}, o = t.outcome_raw || {};
  const rows = Object.keys(f).map(k =>
    '<tr><td>' + esc(k) + '</td><td>' + (f[k] == null ? '—' : (+f[k]).toFixed(4)) + '</td>' +
    '<td>' + (p[k] == null ? '—' : p[k] + '%') + '</td>' +
    '<td>' + (t.raw_shape && t.raw_shape[k] != null
      ? (+t.raw_shape[k]).toFixed(4) + ' <span style="color:var(--acc)">← 进相似检索</span>' : '—') + '</td></tr>').join('');
  $('#techbody').innerHTML =
    '<h4>口径</h4><table>' +
    '<tr><th>项</th><th>值</th></tr>' +
    '<tr><td>业务语言词典版本</td><td>' + esc(t.dict_version) + '</td></tr>' +
    '<tr><td>引擎版本</td><td>' + esc(t.engine_version) + '</td></tr>' +
    '<tr><td>偏离判定</td><td>' + esc(t.z_formula) + '</td></tr>' +
    '<tr><td>曲线归一</td><td>' + esc(t.curve_norm) + '</td></tr>' +
    '<tr><td>相似度度量</td><td>' + esc(t.similarity_metric) + '</td></tr>' +
    '<tr><td>分区 / 样本量</td><td>' + esc(t.partition || '—') + ' / ' + (t.partition_n || '—') +
      (t.partition_used_full_sample ? '（样本不足，回退全样本）' : '') + '</td></tr>' +
    '<tr><td>形状签名维度</td><td>' + (t.shape_dims || []).join(', ') + '</td></tr>' +
    '<tr><td>快照生成时间</td><td>' + esc(m.generated_at || '') + '</td></tr>' +
    '<tr><td>快照行数</td><td>' + (m.n_videos || '') + ' 视频-批次 / ' + (m.n_events || '') + ' 事件</td></tr>' +
    '<tr><td>来源表</td><td>' + (m.source_tables || []).join(' → ') + '</td></tr>' +
    '</table>' +
    '<h4>本视频原始特征 / 分区内百分位 / 是否进入相似检索</h4>' +
    '<table><tr><th>特征</th><th>原始值</th><th>分区内百分位</th><th>节奏签名</th></tr>' + rows + '</table>' +
    '<h4>结果变量（后续表现）</h4><table><tr><th>变量</th><th>值</th></tr>' +
    Object.keys(o).map(k => '<tr><td>' + esc(k) + '</td><td>' + (o[k] == null ? '—' : o[k]) + '</td></tr>').join('') +
    '</table>' +
    '<h4>业务语言词典对照（主视图只会出现右列）</h4>' +
    '<table><tr><th>技术指标</th><th>人话说法</th><th>主视图用法</th></tr>' +
    (t.dict_map || []).map(x => '<tr><td>' + esc(x.tech) + '</td><td>' + esc(x.label) + '</td><td>' +
      (x.display ? '主视图显示人话' : '只在技术层') + ' ｜ ' +
      (x.direction === 'evidence' ? '有方向（控龄关联）' : '中性差异（无好坏证据）') + '</td></tr>').join('') +
    '</table>' +
