<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频分析 · 弹幕节奏</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<style>
.wrap{max-width:1320px}
body.page-focus .sidebar .side-group:has(.ml){display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:2px 0 0;margin-bottom:4px}
.pagesub{background:none;border:0;border-radius:0;padding:0;margin:0;font-size:12px;color:var(--text-tertiary);letter-spacing:.02em}
.pagesub b{font-size:13px;color:var(--text);font-weight:700}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tools input{width:216px;padding:6px 9px;font-size:12.5px;background:transparent;border:1px solid var(--border-subtle);border-radius:8px;color:var(--text)}
.tools input::placeholder{color:var(--text-tertiary)}
.tools .toolbtn{background:none;border:0;border-bottom:1px solid transparent;color:var(--text-secondary);font-family:inherit;font-size:12.5px;padding:5px 1px;cursor:pointer;transition:color .15s ease,border-color .15s ease}
.tools .toolbtn:hover{color:var(--accent-ink);border-bottom-color:var(--accent-line)}
.hint{min-height:16px;font-size:12px;color:var(--text-tertiary);margin:0 0 2px}
.hero{padding:14px 0 10px;border-bottom:1px solid var(--border)}
.hero-kicker{font-size:11.5px;color:var(--text-tertiary);letter-spacing:.04em;margin-bottom:8px}
.hero-kicker::before{content:'';display:inline-block;width:16px;height:2px;background:var(--accent);margin-right:8px;vertical-align:middle}
.hero-title{font-size:clamp(22px,2.5vw,32px);line-height:1.2;font-weight:800;letter-spacing:-.02em;max-width:1180px}
.hero-facts{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--text-secondary)}
.hero-facts b{font-size:14px;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.hero-sep{color:var(--text-tertiary)}
.bili{font-size:12px;color:var(--text-tertiary);text-decoration:underline;text-underline-offset:3px}
.kn-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:12px 0 0}
.kn{background:var(--surface-soft);border-radius:10px;padding:9px 11px;min-width:0}
.kn span{display:block;font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kn b{display:block;margin-top:3px;font-size:19px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kn small{font-size:11px;color:var(--text-secondary);font-weight:600}
.sec{padding:20px 0 18px;border-bottom:1px solid var(--border-subtle)}
.sec:last-of-type{border-bottom:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:17px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:baseline;gap:8px}
.sec-head .no{font-size:10.5px;font-weight:700;color:var(--accent-ink);letter-spacing:.06em}
.sec-meta{font-size:11.5px;color:var(--text-tertiary)}
.chart-host{position:relative;min-width:0}
.chart-wrap{position:relative;height:320px;touch-action:none}
.chart-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.band-below{fill:var(--danger-soft,rgba(255,99,99,.16))}
.band-above{fill:var(--accent-soft)}
.peer-band{fill:var(--chart-fill-secondary,rgba(120,140,255,.14))}
.peer-line{fill:none;stroke:var(--text-tertiary);stroke-width:1.4;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.you-area{fill:var(--chart-fill-primary)}
.you-line{fill:none;stroke:var(--primary);stroke-width:2.2;vector-effect:non-scaling-stroke}
.overlay-line{fill:none;stroke:var(--accent-ink);stroke-width:1.8;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.base-line{stroke:var(--chart-split);stroke-width:1;vector-effect:non-scaling-stroke}
.peak-line{stroke:var(--accent-line);stroke-width:1;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.peak-dot{fill:var(--accent);stroke:var(--bg);stroke-width:1.4;vector-effect:non-scaling-stroke}
.peak-sel{fill:var(--accent-soft)}
.peak-tag{fill:var(--accent-ink);font-size:13px;font-weight:800;font-family:inherit}
.hover-line{stroke:var(--text-tertiary);stroke-width:1;vector-effect:non-scaling-stroke}
.hover-dot{fill:var(--accent);stroke:var(--bg);stroke-width:1.2}
.brush-rect{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1}
.chart-hit{fill:transparent;cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:11.5px;line-height:1.45;color:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.22);white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .08s ease}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-secondary);margin:2px 0 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend .i-you{background:var(--primary)}
.legend .i-med{background:var(--text-tertiary)}
.legend .i-band{background:var(--chart-fill-secondary,rgba(120,140,255,.2));height:10px}
.legend .i-over{background:var(--accent-ink)}
.legend .i-peak{width:2px;height:12px;background:var(--accent)}
.x-axis{position:relative;height:18px;margin-top:2px;font-size:10.5px;color:var(--text-tertiary)}
.tick{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.first{transform:none}.tick.last{transform:translateX(-100%)}
.band-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--text-secondary)}
.band-chip{border:1px solid var(--border-subtle);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.band-chip b{color:var(--accent-ink)}
.dev-list{display:grid;gap:8px}
.dev-row{display:grid;grid-template-columns:210px minmax(0,1fr) 190px;gap:14px;align-items:center;background:var(--surface-soft);border-radius:10px;padding:9px 12px}
.dev-name{font-size:13px;font-weight:700}
.dev-name small{display:block;font-weight:600;font-size:11px;color:var(--text-tertiary);margin-top:2px}
.dev-svg{display:block;width:100%;height:46px}
.dev-axis{stroke:var(--border);stroke-width:1}
.dev-med{stroke:var(--text-tertiary);stroke-width:1.4;stroke-dasharray:3 3}
.dev-dot{fill:var(--accent);stroke:var(--bg);stroke-width:1.2}
.dev-label{font-size:10.5px;fill:var(--text-tertiary);font-family:inherit}
.dev-nums{font-size:11.5px;color:var(--text-secondary);line-height:1.5}
.dev-nums b{color:var(--text);font-variant-numeric:tabular-nums}
.dev-nums .n{color:var(--text-tertiary)}
.peak-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.peak-tile{display:block;width:100%;border:0;border-radius:10px;background:var(--surface-soft);color:var(--text);font-family:inherit;text-align:left;padding:10px 11px;cursor:pointer;min-width:0;transition:background-color .15s ease}
.peak-tile:hover{background:var(--surface-hover)}
.peak-tile.on{background:var(--accent-soft)}
.pt-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.pt-time{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pt-rank{font-size:10px;color:var(--text-tertiary);border:1px solid var(--border-subtle);border-radius:999px;padding:1px 6px;white-space:nowrap}
.pt-nums{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:7px 0 6px;font-size:11px;color:var(--text-secondary)}
.pt-nums b{color:var(--text);font-variant-numeric:tabular-nums}
.pt-phrase{display:block;font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-phrase b{color:var(--accent-ink)}
.peak-panel{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px;display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:22px}
.peak-panel[hidden]{display:none}
.pp-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp-k{background:var(--surface-soft);border-radius:8px;padding:7px 9px}
.pp-k span{display:block;font-size:10.5px;color:var(--text-tertiary)}
.pp-k b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.pp-list{max-height:220px;overflow:auto;display:grid;gap:4px}
.pp-line{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;font-size:12px;color:var(--text-secondary)}
.pp-t{color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.dim-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dim-card{background:var(--surface-soft);border-radius:10px;padding:8px 10px;min-width:0}
.dim-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim-svg{display:block;width:100%;height:34px;margin-top:4px}
.dim-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-tertiary);margin-top:2px}
.dim-foot b{color:var(--text);font-variant-numeric:tabular-nums}
.sim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sim-card{background:var(--surface-soft);border-radius:10px;padding:10px 11px;min-width:0}
.sim-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sim-pct{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sim-pct small{font-size:11px;color:var(--text-tertiary);font-weight:600}
.sim-title{font-size:13px;font-weight:700;margin-top:4px;line-height:1.35}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10.5px;border:1px solid var(--border-subtle);border-radius:999px;padding:1px 7px;color:var(--text-secondary)}
.chip.diff{color:var(--accent-ink);border-color:var(--accent-line)}
.sim-outcome{font-size:11.5px;color:var(--text-secondary);margin-top:6px}
.sim-outcome b{color:var(--text)}
.sim-spark{display:block;height:42px;margin-top:6px}
.sim-actions{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.sim-actions a{font-size:11.5px;color:var(--text-tertiary);text-decoration:underline;text-underline-offset:3px}
.sim-actions button{background:none;border:1px solid var(--border-subtle);border-radius:8px;color:var(--text-secondary);font-family:inherit;font-size:11.5px;padding:3px 8px;cursor:pointer}
.sim-actions button.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.pagefoot{padding:14px 0 30px;font-size:11.5px;color:var(--text-tertiary);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.state{padding:60px 0}
.state h1{font-size:26px;margin-bottom:8px}
.loading{color:var(--text-tertiary)}
@media (max-width:1180px){
  .kn-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dim-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .peak-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .dev-row{grid-template-columns:170px minmax(0,1fr)}
  .dev-nums{grid-column:1 / -1;display:flex;gap:14px}
  .sim-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dim-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .wrap{max-width:none;padding:0 14px}
  .kn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .peak-grid{grid-template-columns:1fr}
  .dim-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sim-grid{grid-template-columns:1fr}
  .dev-row{grid-template-columns:1fr;gap:8px}
  .peak-panel{grid-template-columns:1fr;gap:12px}
  .chart-wrap{height:260px}
  .hero{padding-top:8px}
  .sec{padding:16px 0 14px}
}

/* --- fix: readable axes, thin bands, single-chart rows --- */
.chart-grid{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:stretch;gap:0}
.y-axis{position:relative;height:320px;font-size:11.5px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
.y-axis .yt{position:absolute;right:8px;transform:translateY(-50%);white-space:nowrap}
.y-axis .yu{position:absolute;right:8px;top:-2px;font-size:10.5px;color:var(--text-tertiary)}
.band-below{fill:var(--danger,#d9534f)!important;opacity:.62}
.band-above{fill:var(--accent)!important;opacity:.42}
.band-mark{pointer-events:none}
.dev-chart{border-top:1px solid var(--border-subtle)}
.dev-axis-head{display:grid;grid-template-columns:200px minmax(0,1fr) 220px;gap:16px;align-items:center;padding:6px 0 4px;font-size:11px;color:var(--text-tertiary)}
.dev-scale{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.dev-row{background:none!important;border-radius:0!important;border-bottom:1px solid var(--border-subtle);grid-template-columns:200px minmax(0,1fr) 220px!important;gap:16px!important;padding:10px 0!important}
.dev-name{font-size:13.5px!important}
.dev-name small{font-size:11.5px!important}
.dev-svg{height:44px!important}
.dev-nums{font-size:12.5px!important;line-height:1.6!important}
.dev-label{font-size:11.5px!important}
.peak-table{border-top:1px solid var(--border-subtle)}
.peak-head,.peak-row{display:grid;grid-template-columns:94px minmax(150px,1.25fr) 76px 84px 70px minmax(140px,1.25fr) 44px;gap:12px;align-items:center}
.peak-head{font-size:11.5px;color:var(--text-tertiary);padding:7px 8px;border-bottom:1px solid var(--border-subtle)}
.peak-row{width:100%;border:0;border-bottom:1px solid var(--border-subtle);background:none;color:var(--text);font-family:inherit;text-align:left;padding:11px 8px;cursor:pointer;font-size:12.5px}
.peak-row:hover{background:var(--surface-soft)}
.peak-row.on{background:var(--accent-soft)}
.pr-time{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-share{display:flex;flex-direction:column;gap:3px;min-width:0}
.pr-bar{display:block;height:7px;background:var(--surface-hover);border-radius:99px;overflow:hidden}
.pr-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pr-pct{font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.pr-num{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.pr-num b{color:var(--text)}
.pr-phrase{font-size:12.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-phrase b{color:var(--accent-ink)}
.pr-rank{font-size:11.5px;color:var(--text-tertiary);text-align:right;white-space:nowrap}
.dims-chart{border-top:1px solid var(--border-subtle)}
.dim-head,.dim-row{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:14px;align-items:center}
.dim-head{font-size:11.5px;color:var(--text-tertiary);padding:5px 0 3px;border-bottom:1px solid var(--border-subtle)}
.dim-row{padding:1.5px 0!important;border-bottom:1px solid var(--border-subtle);font-size:12.5px}
.dim-row .dev-svg{height:23px!important}
.dim-name{font-size:12.5px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim-value{text-align:right;font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.dim-value b{color:var(--text)}
.sim-spark{height:78px!important}
.sim-card{padding:12px!important}
.sim-title{font-size:13.5px!important}
.sim-outcome{font-size:12px!important}
.chip{font-size:11.5px!important}
.sim-actions a,.sim-actions button{font-size:12px!important}
@media (max-width:900px){
  .dev-axis-head,.dev-row{grid-template-columns:150px minmax(0,1fr)!important}
  .dev-nums{grid-column:1 / -1!important;display:flex!important;gap:16px!important;font-size:12.5px!important}
}
@media (max-width:760px){
  .layout{display:block}
  .sidebar{display:none!important}
  .main{padding:12px 12px 40px}
  .chart-grid{grid-template-columns:44px minmax(0,1fr)}
  .y-axis{height:260px;font-size:10.5px}
  .y-axis .yt{right:3px}
  .dev-axis-head{display:none}
  .dev-row{grid-template-columns:1fr!important;gap:6px!important;padding:9px 0!important}
  .dev-nums{display:flex!important;gap:14px!important;flex-wrap:wrap}
  .peak-head{display:none}
  .peak-row{grid-template-columns:1fr 44px;gap:4px 8px;padding:11px 2px}
  .pr-time{grid-column:1}
  .pr-rank{grid-column:2;grid-row:1}
  .pr-share{grid-column:1 / -1}
  .pr-num,.pr-phrase{grid-column:1 / -1}
  .dim-head{display:none}
  .dim-row{grid-template-columns:92px minmax(0,1fr) 66px;gap:8px}
  .dim-name{font-size:12px!important}
  .dim-value{font-size:11.5px}
}


/* --- wiring: backend verdict / actions / notes --- */
.verdict{margin:10px 0 0;padding:3px 0 3px 12px;border-left:3px solid var(--accent-line)}
.verdict.warn{border-left-color:var(--accent)}
.verdict.ok{border-left-color:var(--primary)}
.vheadline{font-size:18px;line-height:1.42;font-weight:800;letter-spacing:-.01em;max-width:1180px}
.vdetail{font-size:12.5px;line-height:1.5;color:var(--text-secondary);margin-top:4px;max-width:1180px}
.vtag{display:inline-block;margin-top:5px;font-size:11px;color:var(--accent-ink);border:1px solid var(--accent-line);border-radius:999px;padding:1px 8px}
.sec-note{font-size:12.5px;line-height:1.5;color:var(--text-secondary);margin:-2px 0 8px;max-width:1180px}
.sec-note .sub{color:var(--text-tertiary)}
.dev-human{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.35}
.dev-note{grid-column:1 / -1;grid-row:1;font-size:11.5px;line-height:1.45;color:var(--text-tertiary);margin:0 0 4px}
.dev-row > .dev-name,.dev-row > .dev-svg,.dev-row > .dev-nums{grid-row:2}
.actions{margin-top:14px;border-top:1px solid var(--border-subtle);padding-top:11px;display:grid;gap:8px}
.act{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:12.5px;line-height:1.5}
.act .n{font-size:11px;font-weight:800;color:var(--accent-ink);line-height:1.7}
.act .basis{display:block;font-size:11.5px;color:var(--text-tertiary);margin-top:2px}
.act .reflink{display:inline-block;font-size:11.5px;color:var(--text-tertiary);text-decoration:underline;text-underline-offset:3px;margin-top:2px}
.caveat{font-size:11.5px;line-height:1.45;color:var(--text-tertiary);margin-top:7px}
.sim-like{font-size:12px;line-height:1.45;color:var(--text-secondary);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

</style>
</head>
<body class="page-focus">
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <main class="main">
    <div class="wrap" id="page">
      <div class="topbar">
        <p class="pagesub"><b>视频分析</b> · 弹幕节奏 · 高峰 · 同类对比</p>
        <div class="tools">
          <input id="q" aria-label="输入 BV 号或标题" placeholder="输入 BV 号或标题" autocomplete="off">
          <button type="button" class="toolbtn" id="rand">随机一条</button>
          <button type="button" class="toolbtn" id="fav" hidden>收藏</button>
          <button type="button" class="toolbtn" id="shot">存图</button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
      <div id="content"><div class="loading">正在加载…</div></div>
    </div>
  </main>
</div>
<script src="vendor/html2canvas.min.js"></script>
<script src="v3nav.js?v=20261021"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return ESC[c]})}
function num(v){return (typeof v==='number'&&isFinite(v))?v:null}
function numOr(v,d){var x=num(v);return x==null?d:x}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fmtN(n){if(n==null||isNaN(n))return '—';return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function fmt1(n){if(n==null||isNaN(n))return '—';return (Math.round(n*10)/10).toFixed(1)}
function fmt2(n){if(n==null||isNaN(n))return '—';return (Math.round(n*100)/100).toFixed(2)}
function fmtTime(sec){if(sec==null||!isFinite(sec))return '—';sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h)return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');return m+':'+String(s).padStart(2,'0')}
var state={idx:[],diag:null,hl:null,video:null,curve:null,peaks:[],devs:[],dims:[],bench:[],live:false,sel:-1,zoom:{i0:0,i1:100},overlay:null,overlayOn:false};

function hint(m){var el=$('#hint');if(el)el.textContent=m||''}
function setContent(h){var el=$('#content');if(el)el.innerHTML=h}
function api(path){return fetch(path,{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok||(j&&j.code!=null&&j.code!==0)){var e=new Error((j&&(j.detail||j.error))||('HTTP '+r.status));e.status=r.status;throw e}return j.data})})}
function apiFull(path){return fetch(path,{cache:'no-store',credentials:'same-origin'}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{ok:r.ok,status:r.status,j:j}})})}
function readCard(r){return (r&&r.ok&&r.j&&r.j.code===0&&r.j.data)?r.j.data:null}

function boot(){
  var q=$('#q'),rand=$('#rand'),shot=$('#shot'),fav=$('#fav');
  if(q){
    q.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();runSearch(q.value)}});
    q.addEventListener('input',function(){hint('')});
  }
  if(rand)rand.addEventListener('click',randomOne);
  if(fav)fav.addEventListener('click',toggleFav);
  if(shot){if(window.html2canvas)shot.addEventListener('click',saveImage);else shot.hidden=true}
  window.addEventListener('popstate',route);
  api('/api/diagnosis/index').then(function(rows){state.idx=(rows||[]).filter(function(x){return x&&x.bvid})}).catch(function(){state.idx=[]}).then(route);
}
function route(){var b=(new URLSearchParams(location.search)).get('bvid');b=(b||'').trim();if(!b){emptyState();return}if(state.idx.length&&!hasInLib(b)){loadLive(b);return}load(b)}
function hasInLib(b){return state.idx.some(function(x){return x.bvid===b})}
function go(b){if(!b)return;history.pushState(null,'','?bvid='+encodeURIComponent(b));if(state.idx.length&&!hasInLib(b))loadLive(b);else load(b)}
function randomOne(){if(!state.idx.length){hint('还没有可用视频');return}go(state.idx[Math.floor(Math.random()*state.idx.length)].bvid)}
function runSearch(raw){raw=(raw||'').trim();if(!raw)return;if(/^BV[0-9A-Za-z]{10}$/.test(raw)){hint('');go(raw);return}var q=raw.toLowerCase();var hit=state.idx.find(function(x){return (x.title||'').toLowerCase().indexOf(q)>=0||(x.tname||'').toLowerCase().indexOf(q)>=0});if(hit){hint('');go(hit.bvid)}else hint('没找到；可直接粘贴 BV 号')}
function emptyState(){state.diag=null;state.hl=null;state.video=null;state.curve=null;state.peaks=[];state.devs=[];state.dims=[];state.bench=[];state.live=false;state.sel=-1;var f=$('#fav');if(f)f.hidden=true;setContent('<div class="state"><h1>看一条视频的节奏</h1><p>输入 BV 号或标题，或点「随机一条」。</p></div>')}
function errorState(t,m,b){setContent('<div class="state"><h1>'+esc(t)+'</h1><p>'+esc(m||'这次没取到数据。')+'</p><button type="button" class="btn primary" data-retry="'+esc(b||'')+'">重试</button></div>');var x=document.querySelector('[data-retry]');if(x)x.onclick=function(){if(b)load(b)}}
function loadingState(t){setContent('<div class="state"><div class="loading">'+esc(t||'正在加载…')+'</div></div>')}

function load(b){
  state.live=false;loadingState('正在加载…');
  Promise.all([apiFull('/api/video/'+encodeURIComponent(b)+'/diagnosis'),apiFull('/api/video/'+encodeURIComponent(b)+'/highlights')]).then(function(rs){
    var d=readCard(rs[0]),h=readCard(rs[1]);
    if(!d&&!h){var st=(rs[0]&&rs[0].status)||(rs[1]&&rs[1].status)||0;if(st===404){loadLive(b);return}errorState('这次没取到数据',((rs[0]&&rs[0].j&&(rs[0].j.detail||rs[0].j.error))||(rs[1]&&rs[1].j&&(rs[1].j.detail||rs[1].j.error))||'接口没有返回数据。'),b);return}
    applyCards(d,h);render();
  }).catch(function(e){errorState('这次没取到数据',(e&&e.message)||String(e),b)});
}
function loadLive(b){
  state.live=true;loadingState('正在现场采集…');
  api('/api/live_diagnose?bvid='+encodeURIComponent(b)).then(function(d){if(!d){errorState('这条视频没取到','现场采集没有返回数据。',b);return}applyCards(d,null);render()}).catch(function(e){errorState('这条视频没取到',(e&&e.message)||String(e),b)});
}
function applyCards(d,h){
  state.diag=d||null;state.hl=h||null;
  var v=(d&&d.video)?d.video:{};
  if(!v.bvid&&h)v={bvid:h.bvid,title:h.title,tname:h.tname,duration:h.duration,n_danmaku:h.n_danmaku,batch_date:h.batch_date};
  state.video=v;
  state.curve=(d&&d.curve&&d.curve.you&&d.curve.you.length)?d.curve:null;
  state.devs=(d&&d.deviations)||[];
  state.dims=(d&&d.position&&d.position.dims)||[];
  state.bench=(d&&d.benchmarks)||[];
  state.peaks=buildPeaks(h,d);
  state.sel=-1;state.zoom={i0:0,i1:100};state.overlay=null;state.overlayOn=false;
  var q=$('#q');if(q)q.value='';hint('');
}
function buildPeaks(h,d){
  var dur=num(state.video&&state.video.duration);var total=num(state.video&&state.video.n_danmaku);
  var raw=(h&&h.peaks&&h.peaks.length)?h.peaks.slice():[];
  raw.sort(function(a,b){return (num(b.score)||0)-(num(a.score)||0)});
  raw=raw.slice(0,5).sort(function(a,b){return (num(a.peak_sec)||0)-(num(b.peak_sec)||0)});
  var ranks={};
  (h&&h.highlight_positions||[]).forEach(function(x){ranks[x.start_sec+'|'+x.end_sec+'|'+x.sec]=num(x.rank)});
  var out=raw.map(function(p,i){
    var t0=num(p.start_sec),t1=num(p.end_sec),sec=num(p.peak_sec);
    if(sec==null&&t0!=null&&t1!=null)sec=(t0+t1)/2;
    var pct=dur?clamp(sec/dur*100,0,100):null;
    var i0=dur?clamp(Math.floor(t0/dur*100),0,100):0,i1=dur?clamp(Math.ceil(t1/dur*100)-1,0,100):i0;
    var share=0,peakShare=0;
    var yr=(d&&d.curve&&d.curve.you_raw)||[];
    for(var k=i0;k<=i1;k++){var x=num(yr[k])||0;share+=x;if(x>peakShare)peakShare=x}
    var count=Math.round(share*(total||0));
    var dens=state.video&&dur?(peakShare*total*6000/dur):null;
    var top=(p.top_danmaku&&p.top_danmaku[0])||null;
    return {i:i,t0:t0,t1:t1,sec:sec,pct:pct,i0:i0,i1:i1,score:num(p.score)||0,
      rank:ranks[t0+'|'+t1+'|'+sec]||(i+1),count:count,share:total?count/total:null,
      peakDensity:dens,n_repeat:num(p.n_repeat),n_rep_texts:num(p.n_rep_texts),
      phrase:top?{text:top.text,n:num(top.n)}:null,
      opening:!!p.in_opening,pctl:num(p.pctl),peers:num(p.partition_n)};
  });
  if(out.length){var top=out.slice().sort(function(a,b){return b.score-a.score})[0];out.forEach(function(p){p.top=(p===top)})}
  return out;
}

function verdictHTML(){
  var vd=state.diag&&state.diag.verdict;if(!vd||!vd.headline)return '';
  var tone=vd.tone==='warn'?' warn':(vd.tone==='ok'?' ok':'');
  var html='<div class="verdict'+tone+'"><div class="vheadline">'+esc(vd.headline)+'</div>';
  if(vd.detail)html+='<div class="vdetail">'+esc(vd.detail)+'</div>';
  if(vd.problem_5s)html+='<span class="vtag">'+esc(vd.problem_5s)+'</span>';
  return html+'</div>';
}
function heroHTML(){

  if(v.n_danmaku!=null)facts.push('<span><b>'+fmtN(v.n_danmaku)+'</b> 条弹幕</span>');
  if(v.play_text)facts.push('<span>'+esc(v.play_text)+' 播放</span>');
  if(v.batch_date)facts.push('<span>批次 '+esc(v.batch_date)+'</span>');
  var k,vv;
  var density=(v.n_danmaku!=null&&v.duration)?v.n_danmaku*60/v.duration:null;
  var peakN=state.peaks.length;
  var opening=null,mid=null;
  state.devs.forEach(function(x){if(x.label==='开场吸引力')opening=num(x.value);if(x.label==='中段留存')mid=num(x.value)});
  var peers=(state.curve&&num(state.curve.n_peers))||num(p&&p.n_peers);
  var rank=p&&num(p.rank),pct=p&&num(p.percentile);
  var ahead=p&&num(p.ahead_pct); if(ahead==null&&pct!=null)ahead=100-pct;
  var cells=[

    ['高峰',peakN?String(peakN):'—','已标出'],
    ['开场 0–5%',opening!=null?fmt1(opening*100)+'%':'—','弹幕占比'],
    ['中段 5–95%',mid!=null?fmt1(mid*100)+'%':'—','弹幕占比'],
    ['同类样本',peers?peers+'<small> 支</small>':'—',state.diag&&state.diag.position?esc(state.diag.position.scope||''):''],
    ['同类位置',rank?'第 '+rank+' <small>/ '+fmtN(peers||0)+'</small>':(pct!=null?fmt1(pct)+'%':'—'),ahead!=null?'前 '+fmt1(ahead)+'%':'']
  ];
  var kn=cells.map(function(c){return '<div class="kn"><span>'+c[0]+'</span><b>'+c[1]+'</b><small>'+esc(c[2]||'')+'</small></div>'}).join('');
  var kicker=[v.tname,v.batch_date?'批次 '+v.batch_date:''].filter(Boolean).join(' · ');
  return '<header class="hero"><div class="hero-kicker">'+esc(kicker||'视频')+(state.live?'<span class="live-tag">现场采集</span>':'')+'</div>'+
    '<h1 class="hero-title">'+esc(v.title||v.bvid||'')+'</h1>'+
    '<div class="hero-facts">'+facts.join('<span class="hero-sep">·</span>')+(v.bvid?'<a class="bili" href="https://www.bilibili.com/video/'+esc(v.bvid)+'" target="_blank" rel="noopener">B站 ↗</a>':'')+'</div>'+
    verdictHTML()+
    '<div class="kn-grid">'+kn+'</div></header>';
}

function curveSection(){
  var c=state.curve,v=state.video;
  if(!c||!c.you||c.you.length<5||!v||!v.duration)return '';
  var top=state.peaks.slice().sort(function(a,b){return b.score-a.score})[0];
  var meta=[];
  if(c.n_peers)meta.push('同类 '+c.n_peers+' 支');
  if(v.duration)meta.push('全长 '+fmtTime(v.duration));
  return '<section class="sec" id="sec-curve"><div class="sec-head"><h2><span class="no">02</span>全片节奏</h2>'+
    '<span class="sec-meta">'+meta.join(' · ')+'</span></div>'+
    (c.summary?'<div class="sec-note">'+esc(c.summary)+'</div>':'')+
    '<div class="legend"><span><i class="i-you"></i>这条视频</span><span><i class="i-med"></i>同类中位</span><span><i class="i-band"></i>25%–75% 带</span><span><i class="i-peak"></i>高峰</span><span>1× = 同类中位</span><span>纵轴 log</span>'+(state.overlayOn&&state.overlay?'<span><i class="i-over"></i>'+esc(state.overlay.title||'叠加曲线')+'</span>':'')+'</div>'+
    '<div class="chart-host">'+chartGridHTML()+'</div>'+
    bandStrip()+
  '</section>';
}
function chartGridHTML(){
  return '<div class="chart-grid"><div class="y-axis" id="yAxis"></div><div>'+
    '<div class="chart-wrap" id="chartWrap">'+mainChartSVG()+'<div class="tip" id="chartTip"></div></div>'+
    '<div class="x-axis" id="chartX"></div></div></div>';
}
function chartScale(){
  var c=state.curve,v=state.video,z=state.zoom;if(!c)return{max:1,median:0,maxVal:0};
  var f=(v&&v.n_danmaku&&v.duration)?v.n_danmaku*6000/v.duration:1;
  var you=c.you.slice(z.i0,z.i1+1).map(function(x){return (num(x)||0)*f});
  var med=c.median.slice(z.i0,z.i1+1).map(function(x){return (num(x)||0)*f});
  var maxVal=Math.max.apply(null,you.concat([0]));
  var medSorted=med.slice().sort(function(a,b){return a-b});
  var median=medSorted.length?medSorted[Math.floor(medSorted.length/2)]:0;
  return {max:Math.max(maxVal,1)*1.08,median:median,maxVal:maxVal};
}
function mainChartSVG(){
  var c=state.curve,v=state.video,z=state.zoom,i0=z.i0,i1=z.i1,span=i1-i0;
  var W=1000,H=320,T=18,B=298;
  var factor=(v&&v.n_danmaku&&v.duration)?v.n_danmaku*6000/v.duration:1;
  var top=state.peaks.slice().sort(function(a,b){return b.score-a.score})[0];
  function seg(k){var a=c[k].slice(i0,i1+1).map(function(x){return (num(x)||0)*factor});return a}
  var you=seg('you'),med=seg('median'),p25=seg('p25'),p75=seg('p75');
  var max=chartScale().max;
  if(!isFinite(max)||max<=0)max=1;
  function X(i){return (i/span)*W}
  function Y(x){return B-(Math.log1p(Math.max(x,0))/Math.log1p(max))*(B-T)}
  function path(a){return a.map(function(x,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(x).toFixed(1)}).join('')}
  var area='M0,'+B+' L'+you.map(function(x,i){return X(i).toFixed(1)+','+Y(x).toFixed(1)}).join(' L')+' L'+W+','+B+' Z';
  var band='M';
  for(var i=0;i<=span;i++)band+=(i?' L':'')+X(i).toFixed(1)+','+Y(p75[i]).toFixed(1);
  for(var j=span;j>=0;j--)band+=' L'+X(j).toFixed(1)+','+Y(p25[j]).toFixed(1);
  band+=' Z';
  var bands='';
  (c.bands||[]).forEach(function(b){
    var a=Math.max(num(b.from),i0),bb=Math.min(num(b.to),i1);
    if(!(bb>a))return;
    var x0=X(a-i0),x1=X(bb-i0);
    bands+='<rect class="band-mark '+(b.kind==='below'?'band-below':'band-above')+'" x="'+x0.toFixed(1)+'" y="4" width="'+(x1-x0).toFixed(1)+'" height="6"></rect>';
  });
  var selBand='';
  var sp=state.peaks[state.sel];
  if(sp&&sp.i1>=i0&&sp.i0<=i1){
    var a=Math.max(sp.i0,i0),b=Math.min(sp.i1,i1);
    selBand='<rect class="peak-sel" x="'+X(a-i0).toFixed(1)+'" y="'+T+'" width="'+Math.max(2,X(b-i0)-X(a-i0)).toFixed(1)+'" height="'+(B-T)+'"></rect>';
  }
  var marks='';
  state.peaks.forEach(function(p){
    var ci=Math.round(num(p.pct));
    if(ci<i0||ci>i1)return;
    var x=X(ci-i0),y=Y((num(c.you[ci])||0)*factor);
    marks+='<line class="peak-line" x1="'+x.toFixed(1)+'" y1="'+(T-6)+'" x2="'+x.toFixed(1)+'" y2="'+B+'"></line><circle class="peak-dot" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4"></circle>';
  });
  if(top&&top.pct!=null&&top.pct>=i0&&top.pct<=i1){
    marks+='<text class="peak-tag" x="'+X(top.pct-i0).toFixed(1)+'" y="'+(T-6)+'" text-anchor="middle">最高 '+fmtTime(top.sec)+'</text>';
  }
  var over='';
  if(state.overlayOn&&state.overlay&&state.overlay.curve){
    var oc=state.overlay.curve.slice(i0,i1+1).map(function(x){return (num(x)||0)*factor});
    over='<path class="overlay-line" d="'+path(oc)+'"></path>';
  }
  var aria='全片节奏'+(top?'，最高峰 '+fmtTime(top.sec):'');
  return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(aria)+'">'+
    '<line class="base-line" x1="0" y1="'+B+'" x2="'+W+'" y2="'+B+'"></line>'+
    bands+selBand+
    '<path class="peer-band" d="'+band+'"></path>'+
    '<path class="peer-line" d="'+path(med)+'"></path>'+
    '<path class="you-area" d="'+area+'"></path>'+
    '<path class="you-line" d="'+path(you)+'"></path>'+over+marks+
    '<line id="hoverLine" class="hover-line" x1="0" y1="'+T+'" x2="0" y2="'+B+'" visibility="hidden"></line>'+
    '<circle id="hoverDot" class="hover-dot" r="3.5" visibility="hidden"></circle>'+
    '<rect id="brushRect" class="brush-rect" x="0" y="'+T+'" width="0" height="'+(B-T)+'" visibility="hidden"></rect>'+
    '<rect id="chartHit" class="chart-hit" x="0" y="0" width="'+W+'" height="'+H+'"></rect>'+
  '</svg>';
}
function drawXAxis(){
  var v=state.video,z=state.zoom,dur=num(v&&v.duration),host=$('#chartX');
  if(!host)return;var out='';
  [0,.25,.5,.75,1].forEach(function(t,i){
    var idx=Math.round(z.i0+(z.i1-z.i0)*t);
    var sec=dur?dur*idx/100:null;
    out+='<span class="tick'+(i===0?' first':(i===4?' last':''))+'" style="left:'+(t*100).toFixed(0)+'%">'+(sec==null?'—':fmtTime(sec))+'</span>';
  });
  host.innerHTML=out;
}
function drawYAxis(){
  var host=$('#yAxis');if(!host)return;
  var sc=chartScale(),H=320,T=18,B=298;
  function pct(v){var y=B-(Math.log1p(Math.max(v,0))/Math.log1p(sc.max))*(B-T);return clamp(y/H*100,0,100)}
  var items=[['0',0],['中位 '+String(Math.round(sc.median)),sc.median],['峰 '+String(Math.round(sc.maxVal)),sc.maxVal]];
  host.innerHTML='<span class="yu">条/分</span>'+items.map(function(it){return '<span class="yt" style="top:'+pct(it[1]).toFixed(1)+'%">'+it[0]+'</span>'}).join('');
}
function bandStrip(){

    return '<span class="band-chip">'+fmtTime(state.video.duration*x.from/100)+'–'+fmtTime(state.video.duration*x.to/100)+' <b>'+fmt2(x.ratio)+'×</b></span>';
  }).join('')+'</div>';

function devTrack(dev){
  var W=320,H=46,L=6,R=6,M=12,T=8,B=30;
  function X(v){return L+(v/100)*(W-L-R)}
  var pct=clamp(num(dev.pct)||0,0,100);
  return '<svg class="dev-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(dev.label)+'">'+
    '<line class="dev-axis" x1="'+L+'" y1="'+B+'" x2="'+(W-R)+'" y2="'+B+'"></line>'+
    [25,50,75].map(function(v){return '<line class="dev-axis" x1="'+X(v).toFixed(1)+'" y1="'+(T+6)+'" x2="'+X(v).toFixed(1)+'" y2="'+B+'" opacity="'+(v===50?'.9':'.45')+'"></line>'}).join('')+
    '<line class="dev-med" x1="'+X(50).toFixed(1)+'" y1="'+(T-2)+'" x2="'+X(50).toFixed(1)+'" y2="'+(B+4)+'"></line>'+
    '<circle class="dev-dot" cx="'+X(pct).toFixed(1)+'" cy="'+((T+B)/2).toFixed(1)+'" r="4.5"></circle>'+
    '<text class="dev-label" x="'+X(pct).toFixed(1)+'" y="'+(T-1)+'" text-anchor="middle">'+Math.round(pct)+'%</text>'+
  '</svg>';
}

function deviationsSection(){
  var list=state.devs;if(!list.length)return '';
  var rows=list.map(function(d){
    return '<div class="dev-row">'+
      (d.compare_text?'<div class="dev-note">'+esc(d.compare_text)+'</div>':'')+
      '<div class="dev-name">'+esc(d.label)+
        (d.human?'<div class="dev-human">'+esc(d.human)+'</div>':'')+
        '<small>同类 '+fmtN(num(d.peer_count))+' 支</small></div>'+
      devTrack(d)+
      '<div class="dev-nums">这条视频 <b>'+esc(d.you_text||fmt2(d.value))+'</b><br>同类中位 <b>'+esc(d.median_text||fmt2(d.median))+'</b> <span class="n">· '+esc(d.position_text||'')+'</span></div></div>';
  }).join('');
  return '<section class="sec" id="sec-dev"><div class="sec-head"><h2><span class="no">03</span>和同类差在哪</h2><span class="sec-meta">0–100 同类位置 · 虚线是同类中位</span></div><div class="dev-chart"><div class="dev-axis-head"><span></span><div class="dev-scale"><span>0</span><span>50</span><span>100</span></div><span></span></div>'+rows+'</div>'+actionsHTML()+'</section>';
}
function peaksSection(){
  var list=state.peaks;if(!list.length)return '';
  var maxShare=Math.max.apply(null,list.map(function(p){return p.share||0}))||1;
  var rows=list.map(function(p){
    var w=Math.max(3,Math.round((p.share||0)/maxShare*100));
    var phrase=p.phrase?'「'+esc(p.phrase.text)+'」'+(p.phrase.n?' <b>×'+fmtN(p.phrase.n)+'</b>':''):'—';
    return '<button type="button" class="peak-row'+(state.sel===p.i?' on':'')+'" data-peak="'+p.i+'">'+
      '<span class="pr-time">'+fmtTime(p.t0)+'–'+fmtTime(p.t1)+'</span>'+
      '<span class="pr-share"><span class="pr-bar"><i style="width:'+w+'%"></i></span><span class="pr-pct">'+fmt1((p.share||0)*100)+'%</span></span>'+
      '<span class="pr-num">弹幕 <b>'+fmtN(p.count)+'</b></span>'+
      '<span class="pr-num">峰值 <b>'+fmt1(p.peakDensity)+'</b>/分</span>'+
      '<span class="pr-num">复读 <b>'+fmtN(p.n_repeat)+'</b></span>'+
      '<span class="pr-phrase">'+phrase+'</span>'+
      '<span class="pr-rank">'+(p.rank?'No.'+p.rank:'')+'</span>'+
    '</button>';
  }).join('');
  var top=state.peaks.filter(function(p){return p.top})[0];
  var topNote=top?'最高峰 '+fmtTime(top.t0)+'–'+fmtTime(top.t1)+(top.phrase?' · 「'+esc(top.phrase.text)+'」'+(top.phrase.n?'×'+fmtN(top.phrase.n):''):''):'';
  return '<section class="sec" id="sec-peaks"><div class="sec-head"><h2><span class="no">04</span>高峰</h2><span class="sec-meta">最高 5 段</span></div>'+
    (topNote?'<div class="sec-note">'+topNote+'</div>':'')+
    '<div class="peak-table"><div class="peak-head"><span>时间</span><span>占全片</span><span>弹幕</span><span>峰值</span><span>复读</span><span>短语</span><span></span></div>'+rows+'</div>'+
    '<div class="peak-panel" id="peakPanel" hidden></div></section>';
}
function dimTrack(x){
  var W=220,H=34,L=5,R=5,T=7,B=24;
  function X(v){return L+(v/100)*(W-L-R)}
  var pct=clamp(num(x.pct)||0,0,100);
  return '<svg class="dev-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(x.label)+'">'+
    '<line class="dev-axis" x1="'+L+'" y1="'+B+'" x2="'+(W-R)+'" y2="'+B+'"></line>'+
    [25,50,75].map(function(v){return '<line class="dev-axis" x1="'+X(v).toFixed(1)+'" y1="'+(T+4)+'" x2="'+X(v).toFixed(1)+'" y2="'+B+'" opacity="'+(v===50?'.9':'.4')+'"></line>'}).join('')+
    '<line class="dev-med" x1="'+X(50).toFixed(1)+'" y1="'+(T-2)+'" x2="'+X(50).toFixed(1)+'" y2="'+(B+3)+'"></line>'+
    '<circle class="dev-dot" cx="'+X(pct).toFixed(1)+'" cy="'+((T+B)/2).toFixed(1)+'" r="3.8"></circle>'+
  '</svg>';
}
function dimsSection(){
  var list=state.dims;if(!list.length)return '';
  var n=(state.diag&&state.diag.position&&num(state.diag.position.n_peers))||(state.curve&&num(state.curve.n_peers));
  var rows=list.map(function(x){
    var ahead=num(x.ahead);
    return '<div class="dim-row"><div class="dim-name">'+esc(x.label)+'</div>'+dimTrack(x)+
      '<div class="dim-value">前 <b>'+fmt1(ahead)+'%</b></div></div>';
  }).join('');
  var pos=state.diag&&state.diag.position;
  var note=pos&&pos.headline?('<div class="sec-note">'+esc(pos.headline)+(pos.detail?' · <span class="sub">'+esc(pos.detail)+'</span>':'')+'</div>'):'';
  return '<section class="sec" id="sec-dims"><div class="sec-head"><h2><span class="no">05</span>同类位置</h2><span class="sec-meta">'+(n?n+' 支同类':'')+' · 虚线是同类中位</span></div>'+
    note+'<div class="dims-chart"><div class="dim-head"><span></span><div class="dev-scale"><span>0</span><span>50</span><span>100</span></div><span></span></div>'+rows+'</div></section>';
}
function sparkCompare(a,b){
  if(!a||a.length<3)return '';
  var other=(b&&b.length===a.length)?b:[];
  var W=260,H=78,T=6,B=72,max=Math.max.apply(null,a.concat(other).map(function(x){return num(x)||0}));
  if(!(max>0))max=1;
  function X(i){return i/(a.length-1)*W}function Y(v){return B-((num(v)||0)/max)*(B-T)}
  var line=a.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)}).join('');
  var area='M0,'+B+' L'+a.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' L')+' L'+W+','+B+' Z';
  var ghost=other.length?'<path fill="none" stroke="var(--text-tertiary)" stroke-width="1.2" opacity=".55" d="'+other.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)}).join('')+'"></path>':'';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><path fill="var(--chart-fill-primary)" d="'+area+'"></path>'+ghost+'<path fill="none" stroke="var(--primary)" stroke-width="1.8" d="'+line+'"></path></svg>';
}
function similarSection(){
  var list=state.bench.filter(function(x){return x&&(x.title||x.bvid)}).slice(0,3);
  if(!list.length)return '';
  var cards=list.map(function(b,i){
    var same=(b.same_labels||[]).map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('');
    var diff=b.diff_label?'<span class="chip diff">'+esc(b.diff_label)+'</span>':'';
    var outcome=b.outcome_text?'<div class="sim-outcome">'+(b.did_better?'<b>后续更强</b> · ':'')+esc(b.outcome_text)+'</div>':'';
    var like=b.like_text?'<div class="sim-like">'+esc(b.like_text)+'</div>':'';
    var on=state.overlayOn&&state.overlay&&state.overlay.bvid===b.bvid;
    return '<div class="sim-card"><div class="sim-top"><span class="sim-pct">'+fmtN(num(b.similarity_pct))+'<small>% 相似</small></span>'+(b.did_better?'<span class="pt-rank">后续更强</span>':'')+'</div>'+
      '<div class="sim-title">'+esc(b.title||b.bvid)+'</div>'+like+'<div class="chips">'+same+diff+'</div>'+outcome+
      '<div class="sim-spark">'+sparkCompare(b.curve,state.curve&&state.curve.you)+'</div>'+
      '<div class="sim-actions"><a href="?bvid='+encodeURIComponent(b.bvid||'')+'">打开这条</a><button type="button" class="'+(on?'on':'')+'" data-overlay="'+i+'">'+(on?'取消叠加':'叠加曲线')+'</button></div></div>';
  }).join('');
  return '<section class="sec" id="sec-similar"><div class="sec-head"><h2><span class="no">06</span>相似视频</h2><span class="sec-meta">叠加后可在主图对照</span></div><div class="sim-grid">'+cards+'</div></section>';
}
function footHTML(){
  var left=state.idx.length?'已采集 '+fmtN(state.idx.length)+' 支视频':'B站公开弹幕';
  if(state.video&&state.video.batch_date)left+=' · 批次 '+esc(state.video.batch_date);
  return '<footer class="pagefoot"><span>'+left+'</span><span>B站公开弹幕</span></footer>';
}
function render(){
  var h=heroHTML();
  h+=curveSection();
  h+=deviationsSection();
  h+=peaksSection();
  h+=dimsSection();
  h+=similarSection();
  h+=footHTML();
  setContent(h);bindAll();drawXAxis();drawYAxis();refreshFav();
}
function bindAll(){
  document.querySelectorAll('.peak-row[data-peak]').forEach(function(el){el.onclick=function(){setPeak(+el.getAttribute('data-peak'))}});
  document.querySelectorAll('[data-overlay]').forEach(function(el){el.onclick=function(){toggleOverlay(+el.getAttribute('data-overlay'))}});
  bindChart();
}
function bindChart(){
  var hit=$('#chartHit');if(!hit)return;
  var wrap=$('#chartWrap'),tip=$('#chartTip'),line=$('#hoverLine'),dot=$('#hoverDot'),brush=$('#brushRect');
  var down=false,x0=null,moved=false;
  function toLocalX(e){var r=hit.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)}
  function toIdx(r){return Math.round(state.zoom.i0+r*(state.zoom.i1-state.zoom.i0))}
  hit.addEventListener('pointermove',function(e){
    var r=toLocalX(e),idx=toIdx(r),c=state.curve;if(!c)return;
    var v=state.video,dur=num(v&&v.duration),factor=(v&&v.n_danmaku&&dur)?v.n_danmaku*6000/dur:1;
    var t=dur?dur*idx/100:null,d=(num(c.you[idx])||0)*factor,md=(num(c.median[idx])||0)*factor,cnt=Math.round((num(c.you_raw[idx])||0)*(v.n_danmaku||0));
    var W=1000;var px=r*W;
    line.setAttribute('x1',px);line.setAttribute('x2',px);line.setAttribute('visibility','visible');
    var sc=chartScale(),p25v=(num(c.p25[idx])||0)*factor,p75v=(num(c.p75[idx])||0)*factor;
    dot.setAttribute('cx',px);dot.setAttribute('cy',(298-(Math.log1p(Math.max(d,0))/Math.log1p(sc.max))*(298-18)));
    dot.setAttribute('visibility','visible');
    var belt=p75v>p25v?('带内 '+Math.max(0,Math.min(100,Math.round((d-p25v)/(p75v-p25v)*100)))+'%'):'带外';
    if(tip){tip.innerHTML='<b>'+fmtTime(t)+'</b> · '+fmt1(d)+' 条/分<br>同类中位 '+fmt1(md)+' 条/分<br>25–75 带 '+fmt1(p25v)+'–'+fmt1(p75v)+' · '+belt+'<br>这一格 '+fmtN(cnt)+' 条';tip.style.opacity='1';tip.style.left=(r*100)+'%';tip.style.top='8px'}
  });
  hit.addEventListener('pointerleave',function(){if(line)line.setAttribute('visibility','hidden');if(dot)dot.setAttribute('visibility','hidden');if(tip)tip.style.opacity='0'});
  hit.addEventListener('pointerdown',function(e){down=true;moved=false;x0=toLocalX(e);hit.setPointerCapture&&hit.setPointerCapture(e.pointerId)});
  hit.addEventListener('pointermove',function(e){if(!down)return;var x=toLocalX(e);if(Math.abs(x-x0)>0.02)moved=true;if(brush){brush.setAttribute('x',(Math.min(x0,x)*1000).toFixed(1));brush.setAttribute('width',(Math.abs(x-x0)*1000).toFixed(1));brush.setAttribute('visibility','visible')}});
  hit.addEventListener('pointerup',function(e){if(!down)return;down=false;var x=toLocalX(e);if(brush)brush.setAttribute('visibility','hidden');if(!moved)return;var a=Math.round(Math.min(x0,x)*(state.zoom.i1-state.zoom.i0)+state.zoom.i0),b=Math.round(Math.max(x0,x)*(state.zoom.i1-state.zoom.i0)+state.zoom.i0);if(b-a>=2){state.zoom={i0:clamp(a,0,99),i1:clamp(b,1,100)};renderCurveOnly()}});
  hit.addEventListener('dblclick',function(){state.zoom={i0:0,i1:100};renderCurveOnly()});
}
function renderCurveOnly(){
  var host=$('#sec-curve');if(!host)return;
  var oldPanel=$('#peakPanel');var open=oldPanel&&!oldPanel.hidden;
  host.querySelector('.chart-host').innerHTML=chartGridHTML();
  drawXAxis();drawYAxis();bindChart();
  if(open&&state.sel>=0){var panel=$('#peakPanel');if(panel){panel.hidden=false}}
}
function setPeak(i){
  state.sel=i;var p=state.peaks[i];if(!p)return;
  document.querySelectorAll('.peak-row').forEach(function(el){el.classList.toggle('on',+el.getAttribute('data-peak')===i)});
  renderCurveOnly();
  var panel=$('#peakPanel');if(!panel)return;
  panel.hidden=false;
  var nums='<div class="pp-nums">'+
    '<div class="pp-k"><span>区间</span><b>'+fmtTime(p.t0)+'–'+fmtTime(p.t1)+'</b></div>'+
    '<div class="pp-k"><span>弹幕</span><b>'+fmtN(p.count)+'</b></div>'+
    '<div class="pp-k"><span>占全片</span><b>'+fmt1(p.share*100)+'%</b></div>'+
    '<div class="pp-k"><span>峰值</span><b>'+fmt1(p.peakDensity)+'/分</b></div>'+
    '<div class="pp-k"><span>复读</span><b>'+fmtN(p.n_repeat)+'</b></div>'+
    '<div class="pp-k"><span>复读句</span><b>'+fmtN(p.n_rep_texts)+'</b></div>'+
    (p.pctl!=null?'<div class="pp-k"><span>同类位置</span><b>'+fmt1(p.pctl)+'%</b></div>':'')+
    (p.peers!=null?'<div class="pp-k"><span>同类样本</span><b>'+fmtN(p.peers)+'</b></div>':'')+
  '</div>';
  var phrase=p.phrase?'<div class="sim-outcome">「'+esc(p.phrase.text)+'」'+(p.phrase.n?'<b>×'+fmtN(p.phrase.n)+'</b>':'')+'</div>':'';
  panel.innerHTML='<div>'+nums+phrase+'</div><div><div class="pp-list" id="ppList"><div class="loading">正在取这一段弹幕…</div></div></div>';
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  panel.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
  if(state.live){var l=$('#ppList');if(l)l.innerHTML='<div class="pp-empty">现场采集不保留弹幕原文。</div>';return}
  if(p.t0==null||p.t1==null||!state.video||!state.video.bvid){var l2=$('#ppList');if(l2)l2.innerHTML='<div class="pp-empty">这一段没有可取的弹幕。</div>';return}
  api('/api/danmaku_at?bvid='+encodeURIComponent(state.video.bvid)+'&t0='+Number(p.t0).toFixed(1)+'&t1='+Number(p.t1).toFixed(1)+'&limit=60').then(function(d){
    var list=(d&&d.items)||[];var box=$('#ppList');if(!box)return;
    box.innerHTML=list.length?list.map(function(it){return '<div class="pp-line"><span class="pp-t">'+fmtTime(it.t)+'</span><span>'+esc(it.txt)+'</span></div>'}).join(''):'<div class="pp-empty">这一段没有弹幕。</div>';
  }).catch(function(){var box=$('#ppList');if(box)box.innerHTML='<div class="pp-empty">这一段弹幕没取到。</div>'});
}
function toggleOverlay(i){
  var b=state.bench[i];if(!b||!b.curve)return;
  if(state.overlayOn&&state.overlay&&state.overlay.bvid===b.bvid){state.overlay=null;state.overlayOn=false}
  else{state.overlay={bvid:b.bvid,title:b.title,curve:b.curve};state.overlayOn=true}
  document.querySelectorAll('[data-overlay]').forEach(function(el){var j=+el.getAttribute('data-overlay');var bb=state.bench[j];el.classList.toggle('on',!!(state.overlayOn&&state.overlay&&bb&&state.overlay.bvid===bb.bvid));el.textContent=(state.overlayOn&&state.overlay&&bb&&state.overlay.bvid===bb.bvid)?'取消叠加':'叠加曲线'});
  renderCurveOnly();
}
function refreshFav(){
  var b=$('#fav');if(!b)return;
  if(!state.video||!state.video.bvid){b.hidden=true;return}
  fetch('/api/favorites/status?bvid='+encodeURIComponent(state.video.bvid),{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){b.hidden=false;b.textContent=(j&&j.data&&j.data.favorited)?'已收藏':'收藏'}).catch(function(){b.hidden=true});
}
function toggleFav(){
  var b=$('#fav');if(!b||!state.video||!state.video.bvid)return;
  fetch('/api/favorites',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({bvid:state.video.bvid})}).then(function(r){return r.json()}).then(function(j){if(j&&j.data){b.textContent=j.data.favorited?'已收藏':'收藏';if(window.V3&&V3.toast)V3.toast(j.data.favorited?'已收藏':'已取消收藏')}}).catch(function(){});
}
function saveImage(){
  var btn=$('#shot'),node=$('#page');if(!btn||!node||!window.html2canvas)return;
  var old=btn.textContent;btn.disabled=true;btn.textContent='生成中…';
  window.html2canvas(node,{backgroundColor:getComputedStyle(document.body).backgroundColor,scale:2,useCORS:true,windowWidth:node.scrollWidth}).then(function(canvas){
    var a=document.createElement('a');a.download='视频节奏_'+((state.video&&state.video.bvid)||'video')+'.png';a.href=canvas.toDataURL('image/png');a.click();
  }).catch(function(){if(window.V3&&V3.toast)V3.toast('存图失败')}).then(function(){btn.disabled=false;btn.textContent=old});
}
boot();
})();
</script>
</body>
</html>
