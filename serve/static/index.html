<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>弹幕节奏分析 · B0 验收页（只读）</title>
<script src="vendor/echarts.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#d7dce4; --dim:#8b93a3; --acc:#4f8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding:20px; }
  h1 { font-size:18px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:140px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:20px; font-weight:600; }
  .card .v.ok { color:#4caf7d; } .card .v.bad { color:#e5534b; }
  select, input { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  #curve { background:var(--card); border:1px solid var(--line); border-radius:10px; height:320px; padding:8px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align:left; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--card); }
  tr:hover td { background:#1c212b; cursor:pointer; }
  td.t { max-width:280px; overflow:hidden; text-overflow:ellipsis; }
  #tablewrap { background:var(--card); border:1px solid var(--line); border-radius:10px; max-height:420px; overflow:auto; }
  .note { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<h1>弹幕节奏分析 · B0 验收页（只读）</h1>
<div style="margin:6px 0 12px"><a href="diagnosis.html" style="color:#2b6cff;margin-right:14px;text-decoration:none;font-size:13px;font-weight:700">★ 视频诊断卡（新）</a><a href="overview.html" style="color:#4f8cff;margin-right:14px;text-decoration:none;font-size:13px">运营总览</a><a href="rhythm.html" style="color:#4f8cff;margin-right:14px;text-decoration:none;font-size:13px">视频节奏详情</a><a href="partition.html" style="color:#4f8cff;margin-right:14px;text-decoration:none;font-size:13px">分区画像</a><span style="color:#8b93a3;font-size:13px">B0 验收页（本页）</span></div>
<div class="sub">Spark SQL 原生 L1-min：101 点密度曲线 + 8 维节奏指标 ｜ 数据源：HDFS → PG ads（幂等全量重建）</div>

<div class="row" id="anchors"></div>
<div class="row">
  <label>批次 <select id="batch" onchange="loadVideos()"></select></label>
  <span class="note" id="batchinfo"></span>
</div>
<div id="curve"></div>
<div id="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
<div class="note">口径：旧 8 维 SSOT（front_ratio=adaptive 60s→[3%,10%]；峰=严格局部极大且 ≥μ+2σ）。
  front_ratio / end_rebound 为旧项目已证"不可承结论"维度（时长泄漏 / 与后段留存数学恒等），仅作对拍基准展示。</div>

<script>
const $ = s => document.querySelector(s);
const fmt = x => x == null ? '—' : (typeof x === 'number' ? (Number.isInteger(x) ? x : x.toFixed(4)) : x);

async function api(p) { const r = await fetch(p); if (!r.ok) throw new Error((await r.json()).detail || r.status); return (await r.json()).data; }

async function init() {
  const a = await api('/api/anchors');
  const cells = [['视频批次数', a.n_rows, a.expect.n_rows], ['弹幕总量(DWD)', a.sum_danmaku, a.expect.sum_danmaku],
                 ['池 n（每bvid最新批）', a.pool_n, a.expect.pool_n], ['池内弹幕', a.pool_sum, a.expect.pool_sum]];
  $('#anchors').innerHTML = cells.map(([k, v, e]) =>
    `<div class="card"><div class="k">${k}（期望 ${e.toLocaleString()}）</div><div class="v ${v===e?'ok':'bad'}">${fmt(v).toLocaleString?.() ?? v}</div></div>`).join('');

  const bs = await api('/api/batches');
  $('#batch').innerHTML = bs.map(b => `<option value="${b.batch_date}">${b.batch_date}（${b.cadence}，${b.n_videos} 视频 / ${fmt(b.n_danmaku).toLocaleString?.() ?? b.n_danmaku} 弹幕）</option>`).join('');
  const b0 = bs[bs.length - 1];
  $('#batchinfo').textContent = `真实榜单日 ${b0.real_list_date ?? '—'} ｜ 快照 ${b0.snapshot_present ? '有' : '丢失'} ｜ 覆盖 ${b0.coverage} ｜ ${b0.known_issues ?? ''}`;
  await loadVideos();
}

let videos = [];
async function loadVideos() {
  const bd = $('#batch').value;
  videos = await api(`/api/videos?batch_date=${bd}`);
  const dims = ['danmaku_count','peak_count','main_peak_pct','peak_fwhm','cold_pct','front_ratio','mid_std','end_rebound','cv'];
  $('#tbl thead').innerHTML = '<tr><th>BVID</th><th>标题</th><th>分区</th>' + dims.map(d => `<th>${d}</th>`).join('') + '</tr>';
  $('#tbl tbody').innerHTML = videos.map((v, i) =>
    '<tr onclick="show(\'' + v.bvid + '\')"><td>' + v.bvid + '</td><td class="t">' + (v.title ?? '') + '</td><td>' + (v.tname ?? '') + '</td>'
    + dims.map(d => '<td>' + fmt(v[d]) + '</td>').join('') + '</tr>').join('');
  if (videos[0]) show(videos[0].bvid);
}

let chart = echarts.init($('#curve'));
window.addEventListener('resize', () => chart.resize());
async function show(bvid) {
  const bd = $('#batch').value;
  const v = await api(`/api/video/${bvid}?batch_date=${bd}`);
  chart.setOption({
    title: { text: `${v.title ?? v.bvid}（${v.bvid}）`, textStyle: { color: '#d7dce4', fontSize: 13 }, left: 10 },
    grid: { left: 50, right: 20, top: 40, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: v.curve.map((_, i) => i), name: '进度%（1%桶）' },
    yAxis: { type: 'value' },
    series: [{ type: 'line', data: v.curve, showSymbol: false, lineStyle: { color: '#4f8cff', width: 1.5 }, areaStyle: { opacity: .12 } }]
  }, true);
}

init().catch(e => document.body.insertAdjacentHTML('afterbegin', `<div class="card" style="border-color:#e5534b">加载失败：${e.message}</div>`));
</script>
</body>
</html>
