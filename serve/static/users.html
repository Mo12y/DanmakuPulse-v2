<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>/* 默认深色，与全站一致；切过以 localStorage 为准。放在这里避免首帧闪一下浅色 */try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<style>
.grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
.f label{display:block;font-size:13px;color:var(--text-secondary);margin:11px 0 5px}
.f input,.f select{width:100%;padding:9px 11px}
.f button{width:100%;margin-top:16px;padding:10px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
th{color:var(--text-secondary);font-weight:600;font-size:12.5px}
td.r{text-align:right}
.role{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.role.admin{background:var(--accent-soft);color: var(--accent-ink)}
.role.user{background:var(--surface-soft);color:var(--text-secondary)}
.msg{margin-top:10px;font-size:13px;font-weight:600}
.msg.ok{color:var(--success)} .msg.bad{color:var(--danger-ink)}
.mini{font-size:12px;color:var(--text-tertiary);margin-top:12px;line-height:1.7}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <div class="main">
    <div class="wrap">
      <p class="pagesub"><b>账号与角色管理</b><span class="aud">面向管理员</span></p>
  <div class="card">
    <div class="verdict">
      <span class="tone ok">● 仅管理员</span>
      <div class="vmain">
        <div class="vproblem">账号管理</div>
        <div class="vhead">系统不提供注册——账号一律由管理员创建，并指定它能看到什么。</div>
        <div class="vdetail">普通用户：诊断卡 / 市场总览 / 分区画像 / 我的收藏。管理员：额外可进 用户管理 与 原始细节（技术层）。</div>
      </div>
    </div>
    <div class="sec">
      <div class="sechead"><span class="secno">①</span><span class="sectitle">现有账号</span>
        <span class="secnote">最后一个管理员不能降级（旧版没这条保护，已补）</span></div>
      <div class="grid2">
        <div class="card f" style="padding:16px 18px">
          <div style="font-weight:700;font-size:14px">新建账号</div>
          <label for="nuName">用户名</label>
          <input id="nuName" placeholder="≤60 字符" autocomplete="off">
          <label for="nuPass">初始密码</label>
          <input id="nuPass" type="text" placeholder="≥4 位，创建后请线下告知本人" autocomplete="off">
          <label for="nuRole">角色</label>
          <select id="nuRole">
            <option value="user">普通用户（只看诊断）</option>
            <option value="admin">管理员（可管账号 + 技术页）</option>
          </select>
          <button class="btn primary" id="nuCreate">创建账号</button>
          <div class="msg" id="nuMsg"></div>
          <div class="mini">密码只存 scrypt 哈希，库里看不到明文；忘记密码只能由管理员在库里重建。</div>
        </div>
        <div class="card" style="padding:6px 4px;overflow-x:auto">
          <table>
            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>创建时间</th><th class="r">操作</th></tr></thead>
            <tbody id="rows"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="v3nav.js"></script>
<script>
var $ = function (s) { return document.querySelector(s); };
V3.ready(function (me) {
  if (!me || me.role !== 'admin') { location.href = '/403.html'; return; }
  load();
  $('#nuCreate').onclick = create;
});
function load() {
  fetch('/api/users', { credentials: 'same-origin' }).then(function (r) {
    if (r.status === 403) { location.href = '/403.html'; return null; }
    return r.json();
  }).then(function (j) {
    if (!j) return;
    var rows = j.data || [];
    $('#rows').innerHTML = rows.length ? rows.map(function (u) {
      var to = u.role === 'admin' ? 'user' : 'admin';
      return '<tr><td>' + u.id + '</td><td><b>' + V3.esc(u.username) + '</b></td>' +
        '<td><span class="role ' + u.role + '">' + (u.role === 'admin' ? '管理员' : '普通用户') + '</span></td>' +
        '<td>' + V3.esc(u.created_at) + '</td>' +
        '<td class="r"><button class="btn" data-uid="' + u.id + '" data-role="' + to + '">' +
        (to === 'admin' ? '设为管理员' : '降为普通用户') + '</button></td></tr>';
    }).join('') : '<tr><td colspan="5" class="loading">还没有账号</td></tr>';
    document.querySelectorAll('button[data-uid]').forEach(function (b) {
      b.onclick = function () { setRole(b.dataset.uid, b.dataset.role); };
    });
  });
}
function setRole(uid, role) {
  fetch('/api/users/' + uid + '/role', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ role: role })
  }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (o) {
      if (o.s === 200) { V3.toast('已更新'); load(); }
      else { V3.toast(o.j.detail || o.j.error || '更新失败'); }
    });
}
function create() {
  var body = { username: $('#nuName').value, password: $('#nuPass').value, role: $('#nuRole').value };
  fetch('/api/users', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (o) {
      var m = $('#nuMsg');
      if (o.s === 200) {
        m.className = 'msg ok'; m.textContent = '已创建：' + o.j.data.username;
        $('#nuName').value = ''; $('#nuPass').value = ''; load();
      } else {
        m.className = 'msg bad'; m.textContent = o.j.detail || o.j.error || '创建失败';
      }
    });
}
</script>
    </div>
  </div>
</div>
</body>
</html>
