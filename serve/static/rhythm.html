<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>视频节奏详情 · 弹幕互动节奏分析</title>
<link rel="icon" href="data:,">
<script src="vendor/echarts.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#d7dce4; --dim:#8b93a3; --acc:#4f8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; padding:20px; }
  h1 { font-size:18px; margin-bottom:4px; } .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .nav { margin-bottom:14px; } .nav a { color:var(--acc); margin-right:14px; text-decoration:none; font-size:13px; }
  .nav a.on { color:var(--fg); font-weight:600; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:10px; height:330px; padding:8px; margin-bottom:14px; }
  select,input { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  .badge { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:2px 10px; margin-right:8px; font-size:12px; color:var(--acc); }
  .hl { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
  .hlcard { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .hlcard .t { color:var(--acc); font-weight:600; font-size:13px; }
  .hlcard .m { color:var(--dim); font-size:12px; margin:4px 0 6px; }
  .hlcard ul { margin:0 0 8px 16px; padding:0; font-size:12.5px; color:#c6ccd6; }
  .mix { height:8px; border-radius:4px; overflow:hidden; display:flex; margin-top:6px; }
  .mix i { display:block; height:100%; }
  .warn { color:#e5c07b; font-size:12px; }
</style>
</head>
<body>
<h1>视频节奏详情</h1>
<div class="sub">密度曲线（原始/校正）· 节奏事件 · 指纹雷达（分区基准 z 化）· 双时间轴 · 高光卡片</div>
<div class="nav"><a href="overview.html">运营总览</a><a class="on" href="rhythm.html">视频节奏详情</a><a href="partition.html">分区画像</a><a href="index.html">B0 验收页</a></div>

<div class="row">
  <select id="batchSel"></select>
  <select id="videoSel" style="min-width:340px"></select>
  <span id="badges"></span>
</div>

<div class="chart" id="curve"></div>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
  <div class="chart" id="radar" style="flex:1 1 360px;height:340px"></div>
  <div class="chart" id="dual" style="flex:1 1 420px;height:340px"></div>
</div>
<h3 style="font-size:14px;margin:6px 0 10px">高光卡片（节奏事件）</h3>
<div class="hl" id="hls"></div>

<script>
const $ = id => document.getElementById(id);
async function api(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+' → '+r.status); return (await r.json()).data; }
const fmtT = s => { s=Math.round(s); const m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const MIXC = {n_pos:'#4caf7d', n_neg:'#e5534b', n_neu:'#4f8cff', n_obj:'#555b68'};
const RADAR_FEATS = ['dm_per_min','wdm_per_min','rhythm_entropy','burst_cv','w_burst_cv','early_lag_ratio',
  'color_ratio','top_mode_ratio','pos_ratio','neg_ratio','neu_ratio','no_hit_ratio','avg_text_len',
  'opening_5pct','ending_5pct','mid_ratio'];
const FEAT_ZH = {dm_per_min:'弹幕/分',wdm_per_min:'加权/分',rhythm_entropy:'节奏熵',burst_cv:'突发CV',w_burst_cv:'加权CV',
  early_lag_ratio:'早期占比',color_ratio:'彩色率',top_mode_ratio:'顶部模式',pos_ratio:'正向比',neg_ratio:'负向比',
  neu_ratio:'中性比',no_hit_ratio:'未命中比',avg_text_len:'平均长度',opening_5pct:'开场5%',ending_5pct:'结尾5%',mid_ratio:'中段比'};

async function loadBatches(){
  const rows = await api('/api/batches');
  const sel = $('batchSel');
  rows.slice().reverse().forEach(r=>{ const o=document.createElement('option'); o.value=r.batch_date; o.textContent=r.batch_date+' ('+r.cadence+')'; sel.appendChild(o); });
  const usp = new URLSearchParams(location.search);
  if (usp.get('batch_date')) sel.value = usp.get('batch_date');
  await loadVideos(sel.value);
  sel.onchange = () => loadVideos(sel.value);
  if (usp.get('bvid')) { URLV = usp.get('bvid'); }
  if (URLV) { $('videoSel').value = URLV; await loadVideo(URLV, sel.value); }
}
let URLV = null;
async function loadVideos(b){
  const rows = await api('/api/hotlist?batch_date='+b);
  const sel = $('videoSel');
  sel.innerHTML = rows.map(r=>`<option value="${r.bvid}">${r.rank_proxy}. [${r.tname||''}] ${(r.title||'').slice(0,42)}</option>`).join('');
  sel.onchange = () => loadVideo(sel.value, b);
  if (rows.length) await loadVideo(rows[0].bvid, b);
}
async function loadVideo(bvid, b){
  const [curve, fp, hls] = await Promise.all([
    api(`/api/rhythm/${bvid}?batch_date=${b}`),
    api(`/api/fingerprint/${bvid}?batch_date=${b}`).catch(()=>null),
    api(`/api/highlights/${bvid}?batch_date=${b}`).catch(()=>null),
  ]);
  $('badges').innerHTML = fp ? [
    `<span class="badge">聚类簇 ${fp.cluster_id ?? '-'}（kmeans）</span>`,
    fp.evo_type ? `<span class="badge">演化：${fp.evo_type}</span>` : '',
    `<span class="badge">轮廓 ${fp.silhouette!=null?Number(fp.silhouette).toFixed(3):'-'}</span>`,
    `<span class="badge">分区：${fp.tname||'-'}</span>`,
  ].join('') : '<span class="warn">无指纹数据</span>';

  const pts = curve.points;
  // 事件带：把 start/end 秒换算为桶坐标（用 curve 桶数=100）
  const areas = (hls||[]).map(h=>{
    const dur = fp?.duration || 1;
    const b0 = Math.min(99, Math.floor(h.start_sec/dur*100)), b1 = Math.min(99, Math.ceil(h.end_sec/dur*100));
    return [{xAxis:b0},{xAxis:b1}];
  });
  const c1 = echarts.init($('curve'), 'dark');
  c1.setOption({
    backgroundColor:'transparent',
    title:{text:`密度曲线（1% 桶）· ${bvid}`, left:8, textStyle:{fontSize:13}},
    tooltip:{trigger:'axis'}, legend:{top:0,right:8,textStyle:{fontSize:11}},
    grid:{left:44,right:16,top:36,bottom:28},
    xAxis:{type:'category', data:pts.map(p=>p.bucket), name:'位置（1%桶）'},
    yAxis:{type:'value', name:'弹幕数/桶'},
    series:[
      {name:'cnt（原始）', type:'line', showSymbol:false, lineStyle:{width:1.6, color:'#4f8cff'}, data:pts.map(p=>p.cnt),
       markArea:{silent:true, data:areas}},
      {name:'cal_cnt（校正）', type:'line', showSymbol:false, lineStyle:{width:1.4, color:'#4caf7d', type:'dashed'}, data:pts.map(p=>p.cal_cnt)},
      {name:'wcnt（加权）', type:'line', showSymbol:false, lineStyle:{width:1, color:'#e5c07b', opacity:0.7}, data:pts.map(p=>p.wcnt)},
      {name:'sent_avg（情感）', type:'line', showSymbol:false, yAxisIndex:0, lineStyle:{width:1, color:'#9b7fff', opacity:0.8}, data:pts.map(p=>p.sent_avg)},
    ]
  });
  // 事件点击联动
  c1.on('click', p=>{ if(p.componentType==='series'){ const bkt = p.dataIndex; const hit=(hls||[]).find(h=>{const dur=fp?.duration||1; const b0=Math.floor(h.start_sec/dur*100), b1=Math.ceil(h.end_sec/dur*100); return bkt>=b0&&bkt<=b1;}); if(hit) document.getElementById('hl_'+hit.event_id)?.scrollIntoView({behavior:'smooth'}); } });

  // 雷达（z_part：0=分区中位）
  const rc = echarts.init($('radar'), 'dark');
  if (fp) {
    rc.setOption({
      backgroundColor:'transparent',
      title:{text:'节奏指纹（分区基准 z 化）', left:8, textStyle:{fontSize:13}},
      tooltip:{}, radar:{indicator:RADAR_FEATS.map(f=>({name:FEAT_ZH[f], max:4, min:-4})),
        radius:'62%', center:['50%','56%'], axisName:{color:'#8b93a3', fontSize:10}},
      series:[{type:'radar', data:[{value:RADAR_FEATS.map(f=>{const v=fp[f+'_z_part']; return v==null?0:+Number(v).toFixed(2);}),
        name:'z 值', areaStyle:{opacity:0.25, color:'#4f8cff'}, lineStyle:{color:'#4f8cff'}, itemStyle:{color:'#4f8cff'}}]}]
    });
  } else { rc.clear(); }
  // 双时间轴热力
  api(`/api/dualaxis/${bvid}`).then(da=>{
    const c = echarts.init($('dual'), 'dark');
    const xs = [...Array(20).keys()], ys = ['<1h','1-6h','6-24h','1-3d','>3d'];
    const map = {}; da.forEach(r=>map[r.offset_bin+'_'+r.lag_bin]=r.cnt);
    const data = []; let mx = 1;
    xs.forEach(x=>ys.forEach((y,yi)=>{ const v = map[x+'_'+yi]||0; mx=Math.max(mx,v); data.push([x,yi,v]); }));
    c.setOption({backgroundColor:'transparent',
      title:{text:'双时间轴热力（位置 × 发送滞后）', left:8, textStyle:{fontSize:13}},
      tooltip:{formatter:p=>`位置桶 ${p.value[0]} · ${ys[p.value[1]]}：${p.value[2]} 条`},
      grid:{left:64,right:16,top:36,bottom:44},
      xAxis:{type:'category', data:xs.map(i=>(i*5)+'%')},
      yAxis:{type:'category', data:ys},
      visualMap:{min:0,max:mx,orient:'horizontal',left:'center',bottom:0,textStyle:{fontSize:10},
        inRange:{color:['#171a21','#2b3f66','#3f6fb5','#4f8cff','#9bc1ff']}},
      series:[{type:'heatmap', data, progressive:2000}]
    });
  }).catch(()=>{});

  // 高光卡片
  $('hls').innerHTML = (hls||[]).map(h=>{
    const tot = (h.n_pos||0)+(h.n_neg||0)+(h.n_neu||0)+(h.n_obj||0) || 1;
    const bar = ['n_pos','n_neg','n_neu','n_obj'].map(k=>`<i style="width:${(h[k]||0)/tot*100}%;background:${MIXC[k]}"></i>`).join('');
    const tops = (h.top_danmaku||[]).slice(0,5).map(t=>`<li>${String(t).replace(/</g,'&lt;')}</li>`).join('');
    return `<div class="hlcard" id="hl_${h.event_id}">
      <div class="t">事件 ${h.event_id} · ${fmtT(h.start_sec)} – ${fmtT(h.end_sec)}</div>
      <div class="m">融合分 ${(+h.score_fused).toFixed(3)} · 方法数 ${h.n_methods} · 同步 p ${h.sync_p!=null?(+h.sync_p).toFixed(3):'-'} · 窗口弹幕 ${h.n_window} · ${h.calibrated_on==='uncalibrated'?'未标定':'已标定'}</div>
      <div style="font-size:12px;color:#c6ccd6;margin-bottom:6px">梗概：${(h.summary||'（TextRank 摘要属 P1，当前为权重前 3 弹幕拼接）').replace(/</g,'&lt;')}</div>
      <ul>${tops}</ul>
      <div class="m">情感构成（正 ${h.n_pos||0} / 负 ${h.n_neg||0} / 中 ${h.n_neu||0} / 未命中 ${h.n_obj||0}）</div>
      <div class="mix">${bar}</div>
    </div>`;
  }).join('') || '<div class="warn">该视频无节奏事件（弹幕量 <100 或未检出）</div>';
}
loadBatches().catch(e=>{ document.body.insertAdjacentHTML('beforeend', `<div class="warn">加载失败：${e.message}</div>`); });
</script>
</body>
</html>
