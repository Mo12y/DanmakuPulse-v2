<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>/* 默认深色，与全站一致；切过以 localStorage 为准。放在这里避免首帧闪一下浅色 */try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分区画像 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<script src="vendor/echarts.min.js"></script>
<style>
#chart{height:330px;width:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin-bottom:8px}
.legend i{display:inline-block;width:22px;height:0;border-top-width:3px;border-top-style:solid;
  vertical-align:middle;margin-right:6px}
.legend .sw{display:inline-block;width:16px;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}
.chartcap{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-top:6px}
.dimrow{display:grid;grid-template-columns:104px 1fr 190px;gap:12px;align-items:center;
  padding:8px 0;font-size:13px;border-top:1px dashed var(--border)}
.dimrow:first-child{border-top:0}
.dimrow .lab{font-weight:600}
.track{position:relative;height:8px;background:var(--surface-soft);border-radius:5px}
.track b{position:absolute;left:50%;top:-3px;width:1px;height:14px;background:var(--text-tertiary)}
.track i{position:absolute;top:-3px;height:14px;border-radius:3px}
.track i.hi{background:var(--accent)}
.track i.lo{background:var(--danger-ink)}
.vs{color:var(--text-secondary);font-size:12.5px;text-align:right}
.vs b{color:var(--text)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{border:1px solid var(--border);border-radius:13px;padding:13px 15px;background:var(--card)}
.col h4{font-size:13px;margin-bottom:9px}
.col h4 span{font-weight:400;color:var(--text-tertiary);font-size:12px;margin-left:6px}
.vcard{padding:9px 0;border-top:1px dashed var(--border);cursor:pointer}
.vcard:first-of-type{border-top:0}
.vcard:hover .vt{color: var(--accent-ink)}
.vt{font-size:13px;font-weight:600;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vm{font-size:12px;color:var(--text-secondary);margin-top:3px}
@media (max-width:720px){
  .dimrow{grid-template-columns:78px 1fr;}
  .vs{display:none}
  #chart{height:260px}
}
/* ECharts 需要容器有明确高度，否则画不出来
   （本次审计发现：分区间对比图一直静默空着）*/
#cmpchart{height:280px;width:100%}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <div class="main">
    <div class="wrap">
      <p class="pagesub"><b>分区观众习惯基准</b></p>
  <div class="toolbar">
    <select id="picker" style="flex:1 1 260px"></select>
    <span class="secnote" id="picknote"></span>
  </div>
  <div class="card" id="content"><div class="loading">正在加载分区画像…</div></div>
</div>
<script src="v3chart.js"></script>
<script src="v3nav.js"></script>
<script>
var $ = function(s){ return document.querySelector(s); };
var api = function(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){ return j.data; }); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var mmss = function(s){ if(s==null) return ''; s=Math.round(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
var CHART = null, CUR = null;
V3.onTheme = function(){ drawChart(); };   // 主题由统一顶栏管，切完重画

var LIST = [];
api('/api/v3/partitions').then(function(rows){
  LIST = rows;
  $('#picker').innerHTML = rows.map(function(r){
    return '<option value="' + esc(r.tname) + '">' + esc(r.tname) + '（' + r.n_videos + ' 支' +
           (r.low_support ? '，样本少' : '') + '）</option>';
  }).join('');
  var usp = new URLSearchParams(location.search);
  var t = usp.get('t');
  if (!t || !rows.some(function(r){ return r.tname === t; })) t = rows[0].tname;
  $('#picker').value = t;
  return load(t);
}).catch(function(e){
  $('#content').innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>';
});
$('#picker').onchange = function(){ load($('#picker').value); };

function load(t){
  history.replaceState(null, '', '?t=' + encodeURIComponent(t));
  return api('/api/v3/partition/' + encodeURIComponent(t)).then(function(d){ CUR = d; render(d); });
}

function render(d){
  $('#picknote').textContent = '共 ' + LIST.length + ' 个可比分区';
  var html = '';
  html += '<div class="verdict">' +
    '<span class="tone ' + (d.low_support ? 'warn' : 'ok') + '">' + (d.low_support ? '▲ 样本少' : '● 基线可用') + '</span>' +
    '<div class="vmain">' +
      '<div class="vproblem">' + esc(d.tname) + '：' + esc(d.headline.replace('【' + d.tname + '】区 ' + d.n_videos + ' 支视频的观众习惯：', '')) + '</div>' +
      '<div class="vhead">' + esc(d.headline) + '</div>' +
      '<div class="vdetail">' + esc(d.sub) + '</div>' +
    '</div></div>';

  html += '<div class="sec"><div class="sechead"><span class="secno">①</span>' +
    '<span class="sectitle">分区节奏特征</span>' +
    '<span class="secnote">x 轴 = 播放进度 ｜ y 轴 = 该位置上的弹幕多少</span></div>' +
    '<div class="legend">' +
      '<span><i style="border-color: var(--accent-ink)"></i>' + esc(d.tname) + ' 中位</span>' +
      '<span><span class="sw" style="background:var(--chart-fill-primary);border:1px solid var(--border)"></span>这个分区中间一半视频的范围</span>' +
      '<span><i style="border-color:var(--text-tertiary);border-top-style:dashed"></i>全市场中位（对照）</span>' +
    '</div><div id="chart"></div>' +
    '<div class="chartcap" id="cap"></div></div>';

  var mxr = 0;
  d.dims.forEach(function(x){ mxr = Math.max(mxr, Math.abs(x.rel_pct)); });
  if (mxr < 10) mxr = 10;
  html += '<div class="sec"><div class="sechead"><span class="secno">②</span>' +
    '<span class="sectitle">与全市场对照</span>' +
    '<span class="secnote">' + esc(d.dims_note) + '</span></div>' +
    d.dims.map(function(x){
      var w = Math.min(50, Math.sqrt(Math.abs(x.rel_pct) / mxr) * 50);
      var left = x.rel_pct >= 0 ? 50 : 50 - w;
      return '<div class="dimrow">' +
        '<div class="lab">' + esc(x.label) + '</div>' +
        '<div class="track"><b></b><i class="' + (x.rel_pct >= 0 ? 'hi' : 'lo') + '" style="left:' + left.toFixed(1) + '%;width:' + w.toFixed(1) + '%"></i></div>' +
        '<div class="vs"><b>' + esc(x.vs_text) + '</b>' + (Math.abs(x.rel_pct) >= 5 ? '　' + esc(x.trait) : '') + '</div>' +
      '</div>';
    }).join('') + '</div>';

  html += '<div class="sec"><div class="sechead"><span class="secno">③</span>' +
    '<span class="sectitle">分区观众</span>' +
    '<span class="secnote">点任意一支进它的诊断卡</span></div><div class="cols">' +
    col('最热闹的', '这个分区里弹幕最密的', d.hottest) +
    col('最典型的', '最接近分区中位水平的', d.typical) +
    col('最特别的', '跟这个分区差别最大的', d.special) +
    '</div></div>';


  html += '<div class="sec" id="sec-compare"><div class="sechead"><span class="secno">④</span>' +
    '<span class="sectitle">分区间对比</span>' +
    '<span class="secnote">样本最足的几个分区，中位曲线叠在一张图上看</span></div>' +
    '<div id="cmpchart"></div>' +
    '<div class="chartcap" id="cmpcap"></div>' +
    '<div id="cmptable"></div></div>';

  $('#content').innerHTML = html;
  initCompare();
  document.querySelectorAll('.vcard[data-b]').forEach(function(el){
    el.onclick = function(){ location.href = 'diagnosis.html?bvid=' + el.dataset.b; };
  });
  drawChart();
  
}

function col(title, note, items){
  return '<div class="col"><h4>' + esc(title) + '<span>' + esc(note) + '</span></h4>' +
    items.map(function(v){
      return '<div class="vcard" data-b="' + esc(v.bvid) + '">' +
        '<div class="vt">' + esc(v.title) + '</div>' +
        '<div class="vm">' + esc(v.dm_per_min_text) + ' ｜ 弹幕 ' + (v.n_danmaku || 0) +
        (v.note ? ' ｜ ' + esc(v.note) : '') + '</div></div>';
    }).join('') + '</div>';
}


/* 分区间对比：把几个大区的中位曲线叠在一张图上。
   为什么要它：原来只有「本分区 vs 全市场」一条对照，看不出分区之间彼此差在哪。 */
var CMPCHART = null;
function initCompare(){
  fetch('/api/v3/partition_compare', { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ drawCompare(j.data); })
    .catch(function(e){
      var el = document.getElementById('cmpchart');
      if (el) el.innerHTML = '<div class="secnote">分区间对比暂时取不到（' + esc(e.message) + '）。</div>';
    });
}
function drawCompare(c){
  var el = document.getElementById('cmpchart');
  if (!el || !c.parts.length) return;
  if (CMPCHART) { CMPCHART.dispose(); CMPCHART = null; }
  CMPCHART = echarts.init(el, null, { renderer: 'canvas' });
  var C = dmChart();
  /* 只用 token 派生的几个色相，靠线型区分（§1#12：状态色不许编码数据） */
  var pool = [C.primary, C.accent, C.axis, C.text, C.textTertiary, C.axis];
  var dash = ['solid', 'dashed', 'dotted', 'solid', 'dashed', 'dotted'];
  CMPCHART.setOption({
    backgroundColor: 'transparent',
    grid: { left: 52, right: 18, top: 30, bottom: 44 },
    legend: { top: 0, textStyle: { color: C.textTertiary, fontSize: 12 } },
    tooltip: { trigger: 'axis', backgroundColor: C.tipBg, borderColor: C.tipBorder,
      textStyle: { color: C.text, fontSize: 12 },
      formatter: function(ps){
        return '<b>播放进度 ' + ps[0].dataIndex + '%</b><br>' + ps.map(function(p){
          return p.marker + p.seriesName + '：' + (p.value * 100).toFixed(2) + '%';
        }).join('<br>');
      } },
    xAxis: { type: 'category', data: c.parts[0].curve.map(function(_, i){ return i + '%'; }),
      axisLine: { lineStyle: { color: C.split } }, axisLabel: { color: C.textTertiary, fontSize: 11, interval: 9 },
      name: '播放进度', nameTextStyle: { color: C.textTertiary, fontSize: 11 } },
    yAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { color: C.split } },
      axisLabel: { color: C.textTertiary, fontSize: 11, formatter: function(v){ return (v * 100).toFixed(1) + '%'; } },
      name: '该位置弹幕占比', nameTextStyle: { color: C.textTertiary, fontSize: 11 } },
    series: c.parts.map(function(p, i){
      return { name: p.tname, type: 'line', data: p.curve, showSymbol: false, smooth: 0,
        lineStyle: { width: 2, color: pool[i % pool.length], type: dash[i % dash.length] },
        itemStyle: { color: pool[i % pool.length] } };
    })
  });
  if (!window.__v3resizeBound) { window.__v3resizeBound = 1;
    window.addEventListener('resize', function(){ if (CMPCHART) CMPCHART.resize(); });
  }
  document.getElementById('cmpcap').innerHTML = esc(c.sub);
  document.getElementById('cmptable').innerHTML =
    '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:12px">' +
    '<tr style="color:var(--text-secondary);font-size:12px;text-align:right">' +
    '<th style="text-align:left;padding:8px 10px">分区</th><th>样本</th><th>互动热度</th>' +
    '<th>开场吸引力</th><th>中段留存</th><th>起伏熵</th><th>偏离率</th></tr>' +
    c.parts.map(function(p){
      return '<tr style="text-align:right;border-top:1px solid var(--border-subtle)">' +
        '<td style="text-align:left;padding:8px 10px;font-weight:600">' + esc(p.tname) + '</td>' +
        '<td>' + p.n_videos + ' 支</td>' +
        '<td>' + (p.dm_per_min == null ? '—' : p.dm_per_min + ' 条/分') + '</td>' +
        '<td>' + (p.opening_5pct == null ? '—' : p.opening_5pct + '%') + '</td>' +
        '<td>' + (p.mid_ratio == null ? '—' : p.mid_ratio) + '</td>' +
        '<td>' + (p.rhythm_entropy == null ? '—' : p.rhythm_entropy) + '</td>' +
        '<td>' + (p.dev_rate == null ? '—' : p.dev_rate + '%') + '</td></tr>';
    }).join('') + '</table>' +
    '<div class="secnote" style="margin-top:8px">' + esc(c.metric_note) + '</div>';
}

function drawChart(){
  if (!CUR) return;
  var c = CUR.curve, el = $('#chart');
  if (!el) return;
  if (CHART) { CHART.dispose(); CHART = null; }
  CHART = echarts.init(el, null, {renderer:'canvas'});
  var C = dmChart();
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  var axis = C.axis, spl = C.split;
  var xs = c.median.map(function(_, i){ return i; });
  var band = c.p75.map(function(v, i){ return Math.max(0, v - c.p25[i]); });
  CHART.setOption({
    backgroundColor:'transparent',
    grid:{left:52,right:18,top:16,bottom:46},
    tooltip:{trigger:'axis', backgroundColor: C.tipBg, borderColor: C.tipBorder,
      textStyle:{color: C.text, fontSize:12},
      formatter:function(ps){
        var i = ps[0].dataIndex;
        return '<b>播放进度 ' + i + '%</b><br>' +
          esc(CUR.tname) + ' 中位：' + (c.median[i]*100).toFixed(2) + '%<br>' +
          '中间一半：' + (c.p25[i]*100).toFixed(2) + '% ~ ' + (c.p75[i]*100).toFixed(2) + '%<br>' +
          '全市场中位：' + (c.global_median[i]*100).toFixed(2) + '%';
      }},
    xAxis:{type:'category', data:xs, boundaryGap:false, name:'播放进度', nameLocation:'middle', nameGap:30,
      nameTextStyle:{color:axis,fontSize:12}, axisLine:{lineStyle:{color:spl}}, axisTick:{show:false},
      axisLabel:{color:axis,fontSize:11,interval:9,formatter:function(v){ return v + '%'; }}},
    yAxis:{type:'value', name:'弹幕多少', nameTextStyle:{color:axis,fontSize:12}, axisLine:{show:false},
      axisTick:{show:false}, axisLabel:{color:axis,fontSize:11,formatter:function(v){ return (v*100).toFixed(1)+'%'; }},
      splitLine:{lineStyle:{color:spl}}},
    series:[
      {name:'_p25', type:'line', stack:'env', data:c.p25, showSymbol:false, silent:true,
       lineStyle:{opacity:0}, areaStyle:{opacity:0}},
      {name:'中间一半', type:'line', stack:'env', data:band, showSymbol:false, silent:true,
       lineStyle:{opacity:0}, areaStyle:{color:C.band}},
      {name:'全市场中位', type:'line', data:c.global_median, showSymbol:false,
       lineStyle:{width:2,type:'dashed',color:axis}},
      {name:esc(CUR.tname) + ' 中位', type:'line', data:c.median, showSymbol:false,
       lineStyle:{width:3,color:C.primary}, itemStyle:{color:C.primary},
       areaStyle:{color:C.band}}
    ]
  });
  function segMean(arr, a, b){ var s=0; for (var i=a;i<b;i++) s += arr[i]; return s/(b-a); }
  function segSum(arr, a, b){ var s=0; for (var i=a;i<b;i++) s += arr[i]; return s; }
  var openP = segSum(c.median, 0, 5)*100, openG = segSum(c.global_median, 0, 5)*100;
  var midP = segMean(c.median, 20, 90)*100, midG = segMean(c.global_median, 20, 90)*100;
  var endP = segSum(c.median, 95, 100)*100, endG = segSum(c.global_median, 95, 100)*100;
  function cmpPct(a, b){ var r = b ? (a/b*100) : 0; return Math.round(r) + '%'; }
  // 口径说明：这是"逐桶中位数"曲线，各桶相加不等于 100%，所以一律用"相对均匀铺开的倍数"表达
  function x100(v){ return v.toFixed(2).replace(/0+$/, '').replace(/\.$/, ''); }
  var kOpen = openP / 5, kMid = midP / 1, kEnd = endP / 5;
  $('#cap').innerHTML = '<b>这个分区的节奏形状</b>：最开头（前 5%）的弹幕密度是"均匀铺开"水平的 <b>' +
    kOpen.toFixed(1) + ' 倍</b>——' + (kOpen >= 1.3 ? '属于<b>开头集中型</b>' : (kOpen <= 0.8 ? '开头偏冷' : '开头不算特别集中')) +
    '。中段每 1% 只有均匀水平的 <b>' + x100(kMid) + ' 倍</b>（越低说明中段越淡），收尾 5% 是 ' +
    x100(kEnd) + ' 倍。' +
    ' 跟全市场比：开头 ' + cmpPct(openP, openG) + '、中段 ' + cmpPct(midP, midG) +
    '、收尾 ' + cmpPct(endP, endG) + '。';
  if (!window.__v3resizeBound) { window.__v3resizeBound = 1;
    window.addEventListener('resize', function(){ if (CHART) CHART.resize(); });
  }
}
</script>
    </div>
  </div>
</div>
</body>
</html>
