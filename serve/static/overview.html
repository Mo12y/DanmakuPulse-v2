<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>/* 默认深色，与全站一致；切过以 localStorage 为准。放在这里避免首帧闪一下浅色 */try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市场总览 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<style>
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{border:1px solid var(--border);border-radius:13px;padding:14px 16px;background:var(--card)}
.stat .k{font-size:12.5px;color:var(--text-secondary)}
.stat .v{font-size:26px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .n{font-size:12px;color:var(--text-tertiary)}
.plist{border:1px solid var(--border);border-radius:13px;overflow:hidden}
.prow{display:grid;grid-template-columns:118px 54px 70px 92px 1fr 132px;gap:10px;align-items:center;
  padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);cursor:pointer;transition: background-color .12s ease, border-color .12s ease}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--accent-soft)}
.prow.head{background:var(--surface-soft);cursor:default;font-size:12px;color:var(--text-secondary);font-weight:600}
.prow.head:hover{background:var(--surface-soft)}
.pname{font-weight:700}
.psmall{color:var(--text-secondary);font-size:12.5px}
.ptrait{color:var(--text)}
.low{color:var(--text-tertiary);font-size:11.5px;background:var(--surface-soft);border-radius:6px;padding:1px 6px;margin-left:5px}
.bar{height:7px;background:var(--surface-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ocard{border:1px solid var(--border);border-radius:13px;padding:13px 15px;background:var(--card);
  cursor:pointer;transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;display:flex;flex-direction:column}
.ocard:hover{border-color: var(--accent-ink);box-shadow:var(--shadow)}
.otitle{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ometa{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.otag{font-size:12.5px;font-weight:700;color:var(--danger-ink)}
.ofoot{margin-top:auto;font-size:12px;color: var(--accent-ink);font-weight:700}
@media (max-width:860px){
  .prow{grid-template-columns:1fr 1fr;gap:6px}
  .prow.head{display:none}
  .prow .hideSm{display:none}
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <div class="main">
    <div class="wrap">
      <p class="pagesub"><b>市场参照系总览</b></p>
  <div class="card" id="content"><div class="loading">正在加载市场总览…</div></div>
</div>
<script src="v3nav.js"></script>
<script>
var $ = function(s){ return document.querySelector(s); };
var api = function(p){ return fetch(p).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){ return j.data; }); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function spark(curve, w, h, color){
  if (!curve || curve.length < 2) return '';
  var mx = 0; for (var i=0;i<curve.length;i++) mx = Math.max(mx, curve[i]);
  if (mx <= 0) mx = 1;
  var pts = [];
  for (var i=0;i<curve.length;i++) {
    pts.push((i/(curve.length-1)*w).toFixed(1) + ',' + (h - curve[i]/mx*(h-2) - 1).toFixed(1));
  }
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="vertical-align:middle">' +
         '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="1.4"/></svg>';
}


api('/api/v3/overview').then(render).catch(function(e){
  $('#content').innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>';
});

function render(d){
  var html = '';
  html += '<div class="verdict">' +
    '<span class="tone ok">● 全市场</span>' +
    '<div class="vmain">' +
      '<div class="vproblem">' + esc(d.stats[0].value) + ' 支视频，' + esc(d.stats[1].value) + ' 个可比分区</div>' +
      '<div class="vhead">' + esc(d.headline) + '</div>' +
      '<div class="vdetail">' + esc(d.sub) + '</div>' +
    '</div></div>';
  html += '<div class="sec"><div class="sechead"><span class="secno">①</span><span class="sectitle">池子规模</span></div>' +
    '<div class="statrow">' + d.stats.map(function(s){
      return '<div class="stat"><div class="k">' + esc(s.label) + '</div><div class="v">' + esc(s.value) +
             '</div><div class="n">' + esc(s.note) + '</div></div>';
    }).join('') + '</div></div>';

  var mx = 0;
  d.partitions.forEach(function(p){ mx = Math.max(mx, p.n_videos); });
  html += '<div class="sec"><div class="sechead"><span class="secno">②</span>' +
    '<span class="sectitle">各分区的观众习惯</span>' +
    '<span class="secnote">点任意一行看这个分区的画像</span></div>' +
    '<div class="plist">' +
    '<div class="prow head"><div>分区</div><div>样本</div><div class="hideSm">节奏缩略</div>' +
    '<div class="hideSm">互动热度</div><div>这个分区的观众习惯</div><div></div></div>' +
    d.partitions.map(function(p){
      return '<div class="prow" data-t="' + esc(p.tname) + '">' +
        '<div class="pname">' + esc(p.tname) + (p.low_support ? '<span class="low">样本少</span>' : '') + '</div>' +
        '<div class="psmall">' + p.n_videos + ' 支</div>' +
        '<div class="hideSm">' + spark(p.curve, 64, 20, 'var(--accent)') + '</div>' +
        '<div class="hideSm"><div class="psmall">' + esc(p.hot_med_text) + '</div>' +
          '<div class="bar"><i style="width:' + (100*p.n_videos/mx).toFixed(0) + '%"></i></div></div>' +
        '<div class="ptrait">' + esc(p.trait) + '</div>' +
        '<div><button class="btn" data-go="' + esc(p.tname) + '">看分区画像 →</button></div>' +
      '</div>';
    }).join('') + '</div></div>';

  html += '<div class="sec"><div class="sechead"><span class="secno">③</span>' +
    '<span class="sectitle">全市场最不典型的视频</span>' +
    '<span class="secnote">按"跟自己分区比"的偏离幅度排序 ｜ 点卡片进诊断卡</span></div>' +
    '<div class="ogrid">' + d.outliers.map(function(x){
      return '<div class="ocard" data-b="' + esc(x.bvid) + '">' +
        '<div class="otitle">' + esc(x.title) + '</div>' +
        '<div class="ometa">' + esc(x.tname || '') + ' ｜ ' + esc(x.level) + '</div>' +
        '<div class="otag">' + esc(x.label) + esc(x.pole) + '</div>' +
        '<div class="ofoot">看它的诊断卡 →</div>' +
      '</div>';
    }).join('') + '</div></div>';

  $('#content').innerHTML = html;
  document.querySelectorAll('.prow[data-t]').forEach(function(el){
    el.onclick = function(){ location.href = 'partition.html?t=' + encodeURIComponent(el.dataset.t); };
  });
  document.querySelectorAll('.ocard[data-b]').forEach(function(el){
    el.onclick = function(){ location.href = 'diagnosis.html?bvid=' + el.dataset.b; };
  });
  document.querySelectorAll('button[data-go]').forEach(function(el){
    el.onclick = function(ev){ ev.stopPropagation(); location.href = 'partition.html?t=' + encodeURIComponent(el.dataset.go); };
  });
  
}
</script>
    </div>
  </div>
</div>
</body>
</html>
