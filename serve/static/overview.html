<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>运营总览 · 弹幕互动节奏分析</title>
<link rel="icon" href="data:,">
<script src="vendor/echarts.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#d7dce4; --dim:#8b93a3; --acc:#4f8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; padding:20px; }
  h1 { font-size:18px; margin-bottom:4px; } .sub { color:var(--dim); font-size:12px; margin-bottom:16px; }
  .nav { margin-bottom:14px; } .nav a { color:var(--acc); margin-right:14px; text-decoration:none; font-size:13px; }
  .nav a.on { color:var(--fg); font-weight:600; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:150px; }
  .card .k { color:var(--dim); font-size:12px; } .card .v { font-size:20px; font-weight:600; }
  .chart { background:var(--card); border:1px solid var(--line); border-radius:10px; height:300px; padding:8px; margin-bottom:16px; }
  .two { display:flex; gap:12px; flex-wrap:wrap; } .two > div { flex:1 1 420px; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; } tr:hover td { background:#1d212b; }
  .warn { color:#e5c07b; font-size:12px; margin:8px 0; }
</style>
</head>
<body>
<h1>运营总览</h1>
<div class="sub">基于 Spark 的 B站热榜视频弹幕互动节奏分析系统 · B2 生产链（只读）</div>
<div class="nav"><a class="on" href="overview.html">运营总览</a><a href="diagnosis.html" style="color:#2b6cff;font-weight:700">★ 视频诊断卡</a><a href="rhythm.html">视频节奏详情</a><a href="partition.html">分区画像</a><a href="index.html">B0 验收页</a></div>

<div class="row" id="cards"></div>
<div class="two">
  <div><div id="compChart" class="chart"></div></div>
  <div><div id="evoChart" class="chart"></div></div>
</div>

<div class="row" style="align-items:center">
  <span class="k" style="color:var(--dim)">榜单批次：</span>
  <select id="batchSel"></select>
  <span class="warn" id="cadenceWarn"></span>
</div>
<div class="card" style="padding:0; overflow:auto; max-height:420px">
  <table id="hotTable"><thead><tr>
    <th>排名</th><th>bvid</th><th>标题</th><th>分区</th><th>UP主</th><th>播放</th><th>弹幕</th><th>cadence</th>
  </tr></thead><tbody></tbody></table>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n == null ? '-' : (n >= 1e4 ? (n/1e4).toFixed(1)+'万' : n);
const COLORS = ['#4f8cff','#4caf7d','#e5c07b','#e5534b','#9b7fff','#3bb3c3','#e58c4b','#c94f7c','#7f9b5a','#5a7f9b'];

async function api(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+' '+r.status); return (await r.json()).data; }

(async function main(){
  const ov = await api('/api/overview');
  $('cards').innerHTML = [
    ['最新批次', ov.latest_batch], ['当期榜单', ov.hotlist_size+' 条'],
    ['池规模（唯一 bvid）', ov.n_videos_pool], ['池弹幕总量', fmt(ov.n_danmaku_pool)],
    ['形态聚类', ov.cluster.k ? ('k='+ov.cluster.k+' · 轮廓 '+Number(ov.cluster.silhouette).toFixed(3)) : '-'],
    ['演化分型样本', ov.evo_types.reduce((s,t)=>s+t.n,0)+' 视频'],
  ].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

  // 分区构成（按批次分组堆叠）
  const batches = [...new Set(ov.composition.map(r=>String(r.batch_date)))];
  const byT = {};
  ov.composition.forEach(r=>{ byT[r.tname] = (byT[r.tname]||0) + Number(r.n); });
  const topT = Object.entries(byT).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  const series = topT.map((t,i)=>({
    name:t, type:'bar', stack:'x', barMaxWidth:44, itemStyle:{color:COLORS[i%COLORS.length]},
    data: batches.map(b=>{ const r = ov.composition.find(x=>String(x.batch_date)===b && x.tname===t); return r?Number(r.n):0; })
  }));
  const rest = batches.map(b=>ov.composition.filter(x=>String(x.batch_date)===b && !topT.includes(x.tname)).reduce((s,x)=>s+Number(x.n),0));
  if (rest.some(x=>x>0)) series.push({name:'其他', type:'bar', stack:'x', barMaxWidth:44, itemStyle:{color:'#555b68'}, data:rest});
  const c1 = echarts.init($('compChart'), 'dark');
  c1.setOption({
    backgroundColor:'transparent', title:{text:'榜单分区构成（按批次）', left:8, textStyle:{fontSize:13}},
    tooltip:{trigger:'axis'}, legend:{top:0, right:8, textStyle:{fontSize:11}},
    grid:{left:40,right:12,top:36,bottom:24}, xAxis:{type:'category',data:batches}, yAxis:{type:'value'},
    series
  });

  // 演化分型
  const c2 = echarts.init($('evoChart'), 'dark');
  c2.setOption({
    backgroundColor:'transparent', title:{text:'演化分型分布（K-means k=3）', left:8, textStyle:{fontSize:13}},
    tooltip:{trigger:'item'}, legend:{bottom:0, textStyle:{fontSize:11}},
    series:[{type:'pie', radius:['40%','68%'], center:['50%','52%'],
      label:{color:'#d7dce4', fontSize:11},
      data: ov.evo_types.map((t,i)=>({name:t.cluster_type, value:Number(t.n), itemStyle:{color:COLORS[i]}}))}]
  });

  // 批次选择 + 榜单
  const sel = $('batchSel');
  batches.slice().reverse().forEach(b=>{ const o=document.createElement('option'); o.value=b; o.textContent=b; sel.appendChild(o); });
  async function loadHot(b){
    const rows = await api('/api/hotlist?batch_date='+b);
    const cad = rows[0] ? rows[0].cadence : '';
    $('cadenceWarn').textContent = cad === 'weekly_legacy'
      ? '⚠️ weekly_legacy 批次：仅显示排名事实，跨批增速按冻结决策不计算（delta 列 NULL）' : '';
    $('hotTable').querySelector('tbody').innerHTML = rows.slice(0,150).map(r=>`<tr>
      <td>${r.rank_proxy}</td><td>${r.bvid}</td>
      <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis" title="${r.title||''}">${r.title||''}</td>
      <td>${r.tname||''}</td><td>${r.up_name||''}</td><td>${fmt(r.play)}</td><td>${fmt(r.danmaku_reported)}</td>
      <td>${r.cadence||''}</td></tr>`).join('');
  }
  sel.onchange = () => loadHot(sel.value);
  await loadHot(sel.value);
})().catch(e => { document.body.insertAdjacentHTML('beforeend', `<div class="warn">加载失败：${e.message}</div>`); });
</script>
</body>
</html>
