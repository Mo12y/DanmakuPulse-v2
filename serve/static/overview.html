<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<script>/* 默认深色，与全站一致；切过以 localStorage 为准。放在这里避免首帧闪一下浅色 */try{var _t=localStorage.getItem("v3-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市场数据总览 · 弹幕互动节奏分析系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="v3.css">
<script src="vendor/echarts.min.js"></script>
<script src="v3chart.js"></script>
<style>
/* 数据总览：KPI 行 + 图表卡片网格；只借版式，不新增业务口径 */
.dashhero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.dashhero h1{font-size:22px;letter-spacing:-.02em;margin:0 0 5px;font-weight:800}
.dashhero .sub{color:var(--text-secondary);font-size:13px;line-height:1.7;max-width:760px}
.dashhero .stamp{font-size:11.5px;color:var(--text-tertiary);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 15px;min-width:0}
.kpi.hot{background:var(--accent-soft);border-color:var(--accent-line)}
.kpi .k{font-size:11.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:25px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:5px;white-space:nowrap}
.kpi .u{font-size:12px;color:var(--text-tertiary);font-weight:500;margin-left:3px}
.kpi .n{font-size:11px;color:var(--text-tertiary);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hot .k,.kpi.hot .v{color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chartcard{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:15px 17px 12px;min-width:0}
.chartcard .ch{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
.chartcard .ct{font-size:13.5px;font-weight:700}
.chartcard .cn{font-size:11.5px;color:var(--text-tertiary)}
.chartcard .concl{font-size:14.5px;font-weight:600;line-height:1.55;margin:3px 0 7px;color:var(--text)}
.chartcard .concl b{color:var(--accent-ink)}
.chartbox{width:100%;min-width:0}
.chart-lg{height:250px}.chart-md{height:220px}.chart-sm{height:190px}
.full{grid-column:1/-1}
.tablewrap{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:15px 17px 10px;overflow:hidden}
.tablewrap .ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.tablewrap .ct{font-size:13.5px;font-weight:700}
.tablewrap .cn{font-size:11.5px;color:var(--text-tertiary)}
table.hot{width:100%;border-collapse:collapse;font-size:12.5px}
table.hot th{font-weight:600;color:var(--text-secondary);text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.hot td{padding:7px 8px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
table.hot tr:last-child td{border-bottom:0}
table.hot tr[data-b]{cursor:pointer}
table.hot tr[data-b]:hover td{background:var(--accent-soft)}
table.hot .tt{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.hot .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.hot .mini{height:6px;background:var(--surface-soft);border-radius:4px;overflow:hidden;min-width:70px}
table.hot .mini i{display:block;height:100%;background:var(--accent);border-radius:4px}
.empty{padding:45px 24px;text-align:center;color:var(--text-secondary);font-size:13px;line-height:1.8}
.note{margin-top:12px;font-size:12px;color:var(--text-tertiary);line-height:1.8}
.note details{border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-soft);padding:8px 11px}
.note summary{cursor:pointer;font-weight:600;color:var(--text-secondary)}
.note .nb{padding-top:7px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.layout{display:block}.sidebar{display:none!important}.main{padding:14px 12px 36px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.chart-lg{height:230px}.chart-md{height:210px}.dashhero h1{font-size:19px}}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="v3side" aria-label="主导航"></nav>
  <div class="main">
    <div class="wrap">
      <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">市场数据总览</h1>
      <p class="pagesub"><b>市场数据总览</b> · 批次 / 分区 / 节奏 / 异常视频</p>
      <div id="dash"><div class="empty">正在加载市场数据…</div></div>
    </div>
  </div>
</div>
<script src="v3nav.js?v=20261021"></script>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
var fmtN = function(n){ return (n==null||isNaN(n))?'—':String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,','); };
var numOr = function(v){ return (typeof v==='number'&&isFinite(v))?v:null; };
var charts = [];
function C(){ return (window.dmChart ? dmChart() : {primary:'#4A7DDF',axis:'#706D66',split:'#F0ECE3',accent:'#C93D68',text:'#292723',textTertiary:'#6C6760',tipBg:'#FFFDF9',tipBorder:'#D8D1C1',font:'sans-serif'}); }
function axisCommon(c){ return {axisLine:{lineStyle:{color:c.split}},axisTick:{show:false},axisLabel:{color:c.axis,fontSize:11},splitLine:{lineStyle:{color:c.split}}}; }
function make(id,opt){ var el=document.getElementById(id); if(!el) return; var ch=echarts.init(el,null,{renderer:'canvas'}); ch.setOption(opt); charts.push(ch); return ch; }
function disposeAll(){ charts.forEach(function(c){try{c.dispose()}catch(e){}}); charts=[]; }
function resizeAll(){ charts.forEach(function(c){try{c.resize()}catch(e){}}); }
window.addEventListener('resize',resizeAll);

function api(p){ return fetch(p,{credentials:'same-origin',cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(j){ if(j&&j.code!=null&&j.code!==0) throw new Error(j.detail||j.error||('code '+j.code)); return j.data; }); }

Promise.all([api('/api/v3/overview'), api('/api/diagnosis/index')]).then(function(a){
  render(a[0], a[1]||[]);
}).catch(function(e){
  $('#dash').innerHTML='<div class="empty">数据加载失败：'+esc(e.message)+'<br>请刷新重试；如果持续失败，多半是后端服务没起来。</div>';
});

function render(ov, idx){
  ov=ov||{}; idx=idx||[];
  var stats=ov.stats||[], parts=(ov.partitions||[]), outs=(ov.outliers||[]);
  var nVideos=idx.length;
  var nDm=idx.reduce(function(a,x){return a+(numOr(x.n_danmaku)||0);},0);
  var dmRate=idx.map(function(x){return numOr(x.dm_per_min);}).filter(function(x){return x!=null;}).sort(function(a,b){return a-b;});
  var medRate=dmRate.length?dmRate[Math.floor(dmRate.length/2)]:null;
  var statMap={}; stats.forEach(function(s){statMap[s.label]=s;});
  function kpi(k,v,u,n,hot){return '<div class="kpi'+(hot?' hot':'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+(u?'<span class="u">'+esc(u)+'</span>':'')+'</div><div class="n">'+esc(n||'')+'</div></div>';}
  var kpis='<div class="kpis">'+
    kpi('收录视频', fmtN(nVideos), '支', '当前快照', true)+
    kpi('总弹幕', fmtN(nDm), '条', '公开接口采集')+
    kpi('可比分区', (statMap['可比分区']||{}).value||parts.length, '个', '其中 '+parts.filter(function(p){return p.n_videos>=20;}).length+' 个样本 ≥20 支')+
    kpi('检出高能点', (statMap['检出高能点']||{}).value||'—', '个', '点爆点可看当时弹幕')+
    kpi('有后续追踪', (statMap['有后续追踪']||{}).value||'—', '支', '能讲“后来怎样”的样本')+
    kpi('弹幕中位', medRate==null?'—':Math.round(medRate), '条/分', '全库视频中位')+
  '</div>';

  var h=[]; h.push(kpis);

  // ① 批次趋势：柱=视频数，线=弹幕量
  var by={}; idx.forEach(function(x){ var b=String(x.batch_date||'未知'); if(!by[b]) by[b]={n:0,dm:0}; by[b].n++; by[b].dm+=(numOr(x.n_danmaku)||0); });
  var batches=Object.keys(by).sort();
  var bN=batches.map(function(b){return by[b].n;}), bD=batches.map(function(b){return by[b].dm;});
  var c=C();
  h.push('<div class="grid2">'+
    '<div class="chartcard"><div class="ch"><span class="ct">① 批次采集趋势</span><span class="cn">柱 = 视频数 ｜ 线 = 弹幕量</span></div>'+
    '<div class="concl">共 <b>'+batches.length+'</b> 个批次；最新批次 <b>'+esc(batches[batches.length-1]||'—')+'</b>。</div>'+
    '<div id="batchChart" class="chartbox chart-lg"></div></div>'+
    '<div class="chartcard"><div class="ch"><span class="ct">② 分区样本量</span><span class="cn">横向柱 = 视频数 ｜ 点行看分区</span></div>'+
    '<div class="concl">样本最足的分区是 <b>'+esc((parts.slice().sort(function(a,b){return b.n_videos-a.n_videos;})[0]||{}).tname||'—')+'</b>。</div>'+
    '<div id="partBar" class="chartbox chart-lg"></div></div>'+
  '</div>');

  // ③ 分区弹幕占比环图 + ④ 分区节奏曲线
  var topParts=parts.slice().sort(function(a,b){return b.n_videos-a.n_videos;});
  h.push('<div class="grid2">'+
    '<div class="chartcard"><div class="ch"><span class="ct">③ 分区视频占比</span><span class="cn">环图 = 当前快照的样本构成</span></div>'+
    '<div class="concl">前 8 个分区占 <b>'+Math.round(topParts.slice(0,8).reduce(function(a,p){return a+p.n_videos;},0)/Math.max(1,nVideos)*100)+'%</b> 的视频。</div>'+
    '<div id="partPie" class="chartbox chart-md"></div></div>'+
    '<div class="chartcard"><div class="ch"><span class="ct">④ 分区节奏曲线</span><span class="cn">每条线 = 该分区平均弹幕密度（101 段）</span></div>'+
    '<div class="concl">曲线越靠前、越尖，说明开场和爆点越集中。</div>'+
    '<div id="partCurves" class="chartbox chart-md"></div></div>'+
  '</div>');

  // ⑤ 分区互动热度（中位条/分）+ ⑥ 最不典型的视频
  h.push('<div class="grid2">'+
    '<div class="chartcard"><div class="ch"><span class="ct">⑤ 分区互动热度</span><span class="cn">横向柱 = 分区中位条/分 ｜ 点行看分区</span></div>'+
    '<div class="concl">热度最高的分区：<b>'+esc((parts.slice().sort(function(a,b){return (parseFloat(b.hot_med_text)||0)-(parseFloat(a.hot_med_text)||0);})[0]||{}).tname||'—')+'</b>。</div>'+
    '<div id="hotBar" class="chartbox chart-md"></div></div>'+
    '<div class="chartcard"><div class="ch"><span class="ct">⑥ 最不典型的视频</span><span class="cn">横向柱 = 偏离幅度 ｜ 点行看诊断</span></div>'+
    '<div class="concl">这些视频跟本分区“最不一样”，<b>不等于</b>好坏。</div>'+
    '<div id="outBar" class="chartbox chart-md"></div></div>'+
  '</div>');

  // ⑦ 热榜视频明细表
  var tops=idx.slice().sort(function(a,b){return (numOr(b.dm_per_min)||0)-(numOr(a.dm_per_min)||0);}).slice(0,10);
  var maxRate=tops.length?(numOr(tops[0].dm_per_min)||1):1;
  h.push('<div class="tablewrap"><div class="ch"><span class="ct">⑦ 高互动视频 Top 10</span><span class="cn">按弹幕条/分排序 ｜ 点行看诊断卡</span></div>'+
    '<table class="hot"><thead><tr><th>标题</th><th>分区</th><th class="num">弹幕</th><th class="num">条/分</th><th>批次</th></tr></thead><tbody>'+
    tops.map(function(x){return '<tr data-b="'+esc(x.bvid)+'"><td class="tt">'+esc(x.title||x.bvid)+'</td><td>'+esc(x.tname||'—')+'</td><td class="num">'+fmtN(x.n_danmaku)+'</td><td class="num"><div>'+Math.round(numOr(x.dm_per_min)||0)+'</div><div class="mini"><i style="width:'+Math.max(3,Math.round((numOr(x.dm_per_min)||0)/maxRate*100))+'%"></i></div></td><td>'+esc(x.batch_date||'—')+'</td></tr>';}).join('')+
    '</tbody></table></div>');

  // 结论 + 口径
  h.push('<div class="note"><details><summary>数据口径与未覆盖说明</summary><div class="nb">'+
    '<div>'+esc(ov.headline||'')+'</div><div>'+esc(ov.sub||'')+'</div>'+
    '<div>只覆盖已采集并跑完分析的视频，不是全站视频；分区比较只在样本 ≥20 支时使用。</div>'+
    '<div>粉丝画像、地域、留存、播放来源等 UP 主后台私有指标不在此页，公开接口拿不到。</div>'+
  '</div></details></div>');

  $('#dash').innerHTML=h.join('');
  bindTable();
  var dashData={ov:ov,parts:parts,outs:outs,batches:batches,bN:bN,bD:bD,topParts:topParts};
  window.__dashData=dashData;
  drawCharts(dashData);
}

function bindTable(){
  document.querySelectorAll('tr[data-b]').forEach(function(el){ el.onclick=function(){ location.href='diagnosis.html?bvid='+encodeURIComponent(el.dataset.b); }; });
}

function drawCharts(d){
  disposeAll();
  var c=C();
  // batch
  make('batchChart',{
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',backgroundColor:c.tipBg,borderColor:c.tipBorder,textStyle:{color:c.text,fontSize:12,fontFamily:c.font}},
    legend:{bottom:0,textStyle:{color:c.textTertiary,fontSize:11}},
    grid:{left:52,right:52,top:18,bottom:46},
    xAxis:Object.assign({type:'category',data:d.batches},axisCommon(c)),
    yAxis:[
      Object.assign({type:'value',name:'视频数'},axisCommon(c)),
      Object.assign({type:'value',name:'弹幕量',splitLine:{show:false}},axisCommon(c))
    ],
    series:[
      {name:'视频数',type:'bar',data:d.bN,barMaxWidth:26,itemStyle:{color:c.primary,borderRadius:[4,4,0,0]}},
      {name:'弹幕量',type:'line',yAxisIndex:1,data:d.bD,showSymbol:true,symbolSize:5,lineStyle:{color:c.accent,width:2},itemStyle:{color:c.accent}}
    ]
  });
  // partition bar
  var pb=d.parts.slice().sort(function(a,b){return b.n_videos-a.n_videos;}).slice(0,12).reverse();
  make('partBar',{
    backgroundColor:'transparent',
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:c.tipBg,borderColor:c.tipBorder,textStyle:{color:c.text,fontSize:12,fontFamily:c.font}},
    grid:{left:82,right:24,top:10,bottom:18},
    xAxis:Object.assign({type:'value'},axisCommon(c)),
    yAxis:Object.assign({type:'category',data:pb.map(function(p){return p.tname;})},axisCommon(c),{axisLabel:{color:c.text,fontSize:11}}),
    series:[{type:'bar',data:pb.map(function(p){return p.n_videos;}),barMaxWidth:16,itemStyle:{color:c.primary,borderRadius:[0,4,4,0]}}]
  }).on('click',function(p){ var p0=pb[p.dataIndex]; if(p0) location.href='partition.html?t='+encodeURIComponent(p0.tname); });
  // pie
  var pieTop=d.topParts.slice(0,8); var other=Math.max(0, d.topParts.reduce(function(a,p){return a+p.n_videos;},0)-pieTop.reduce(function(a,p){return a+p.n_videos;},0));
  var pieData=pieTop.map(function(p){return {name:p.tname,value:p.n_videos};}); if(other>0) pieData.push({name:'其余分区',value:other});
  var palette=[c.primary,c.accent,
    (window.dpVar?dpVar('--success'):'')||c.primary,
    (window.dpVar?dpVar('--primary-strong'):'')||c.axis,
    (window.dpVar?dpVar('--warning'):'')||c.accent,
    (window.dpVar?dpVar('--text-tertiary'):'')||c.axis,
    (window.dpVar?dpVar('--primary'):'')||c.primary,
    (window.dpVar?dpVar('--danger'):'')||c.accent,
    (window.dpVar?dpVar('--text-secondary'):'')||c.axis];
  make('partPie',{
    backgroundColor:'transparent',tooltip:{trigger:'item',backgroundColor:c.tipBg,borderColor:c.tipBorder,textStyle:{color:c.text,fontSize:12,fontFamily:c.font},formatter:function(p){return p.name+'：'+p.value+' 支（'+p.percent.toFixed(1)+'%）';}},
    legend:{bottom:0,type:'scroll',textStyle:{color:c.textTertiary,fontSize:11}},
    series:[{type:'pie',radius:['48%','72%'],center:['50%','44%'],label:{show:false},labelLine:{show:false},itemStyle:{borderColor:c.tipBg,borderWidth:2},data:pieData,color:palette}]
  });
  // partition curves
  var cp=d.topParts.slice(0,6);
  var series=cp.map(function(p,i){return {name:p.tname,type:'line',data:(p.curve||[]).map(function(v){return +(v*100).toFixed(3);}),showSymbol:false,smooth:false,lineStyle:{width:2,color:palette[i%palette.length]},itemStyle:{color:palette[i%palette.length]}};});
  make('partCurves',{
    backgroundColor:'transparent',tooltip:{trigger:'axis',backgroundColor:c.tipBg,borderColor:c.tipBorder,textStyle:{color:c.text,fontSize:12,fontFamily:c.font}},
    legend:{bottom:0,type:'scroll',textStyle:{color:c.textTertiary,fontSize:11}},
    grid:{left:46,right:18,top:16,bottom:48},
    xAxis:Object.assign({type:'category',data:(cp[0]&&cp[0].curve||[]).map(function(_,i){return i;}),boundaryGap:false},axisCommon(c),{axisLabel:{color:c.axis,fontSize:10,interval:9}}),
    yAxis:Object.assign({type:'value',name:'弹幕占比 %',nameTextStyle:{color:c.axis,fontSize:10}},axisCommon(c)),
    series:series
  });
  // hot bar
  var hp=d.parts.slice().sort(function(a,b){return (parseFloat(b.hot_med_text)||0)-(parseFloat(a.hot_med_text)||0);}).slice(0,10).reverse();
  make('hotBar',{
    backgroundColor:'transparent',tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:c.tipBg,borderColor:c.tipBorder,textStyle:{color:c.text,fontSize:12,fontFamily:c.font},formatter:function(ps){var p=hp[ps[0].dataIndex];return p.tname+'：'+(p.hot_med_text||'—');}},
    grid:{left:82,right:24,top:10,bottom:18},
    xAxis:Object.assign({type:'value',name:'条/分'},axisCommon(c)),
    yAxis:Object.assign({type:'category',data:hp.map(function(p){return p.tname;})},axisCommon(c),{axisLabel:{color:c.text,fontSize:11}}),
    series:[{type:'bar',data:hp.map(function(p){return parseFloat(p.hot_med_text)||0;}),barMaxWidth:16,itemStyle:{color:c.accent,borderRadius:[0,4,4,0]}}]
  }).on('click',function(p){var p0=hp[p.dataIndex]; if(p0) location.href='partition.html?t='+encodeURIComponent(p0.tname);});
  // outliers
  var op=d.outs.slice().sort(function(a,b){return (numOr(b.pct)||0)-(numOr(a.pct)||0);}).slice(0,8).reverse();
  make('outBar',{
    backgroundColor:'transparent',tooltip:{trigger:'axis',axisPointer:{type:'shadow'},backgroundColor:c.tipBg,borderColor:c.tipBorder,textStyle:{color:c.text,fontSize:12,fontFamily:c.font},formatter:function(ps){var o=op[ps[0].dataIndex];return String(o.title||'').slice(0,30)+'<br>'+o.label+' '+o.pole+'（第 '+Math.round(o.pct)+' 百分位）';}},
    grid:{left:100,right:30,top:10,bottom:18},
    xAxis:Object.assign({type:'value',max:100,name:'偏离幅度'},axisCommon(c)),
    yAxis:Object.assign({type:'category',data:op.map(function(o){return String(o.title||'').slice(0,8);})},axisCommon(c),{axisLabel:{color:c.text,fontSize:10}}),
    series:[{type:'bar',data:op.map(function(o){return numOr(o.pct)||0;}),barMaxWidth:15,itemStyle:{color:c.primary,borderRadius:[0,4,4,0]}}]
  }).on('click',function(p){var o=op[p.dataIndex]; if(o) location.href='diagnosis.html?bvid='+encodeURIComponent(o.bvid);});
}

window.V3=window.V3||{}; window.V3.onTheme=function(){ var d=window.__dashData; if(d) drawCharts(d); else location.reload(); };
})();
</script>
</div>
</div>
</div>
</body>
</html>
