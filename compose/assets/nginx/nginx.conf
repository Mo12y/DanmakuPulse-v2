# dm-nginx.conf -> /etc/nginx/nginx.conf（替换镜像自带的）
#
# 关键：stream 层在**同一个端口**上按首字节分流
#   首字节是 TLS 握手 (0x16 0x03) -> 127.0.0.1:8443（TLS 终止）
#   否则                          -> 127.0.0.1:8080（明文 HTTP）
# 目的：不管浏览器有没有开「始终使用安全连接」，同一个 http://ip:8088 都能打开。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    map $ssl_preread_protocol $dm_backend {
        ""        127.0.0.1:8080;
        default   127.0.0.1:8443;
    }
    server {
        listen      8088;
        listen      [::]:8088;
        proxy_pass  $dm_backend;
        ssl_preread on;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    access_log         /var/log/nginx/access.log;

    include /etc/nginx/conf.d/*.conf;
}
