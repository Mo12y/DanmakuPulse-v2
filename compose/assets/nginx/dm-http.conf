# dm-http.conf -> /etc/nginx/conf.d/default.conf
#
# 两个 http server 块共用同一份 location。
# 为什么有两个：浏览器开了「始终使用安全连接」会把 http 自动升级成 https，
# 打到只说 HTTP 的端口上就是 ERR_CONNECTION_REFUSED
# （2026-10-15 实测到 TLS 握手包撞在 8088 上被回 400）。
# 现在由 dm-nginx.conf 的 stream + ssl_preread 按首字节分流，对外仍只有一个端口 8088。

server {
    listen 8080;
    server_name _;
    # ⚠️ 必须关：nginx 默认会把 return 302 /xxx 补成绝对 URL，并用**内部监听端口**
    #    （8080 / 8443）拼进去 —— 而这两个端口没有对外发布，浏览器会直接连不上。
    #    关掉后返回相对 Location，浏览器按自己访问的地址（:8088）解析。
    absolute_redirect off;
    include /etc/nginx/dm-locations.conf;
}

server {
    listen 8443 ssl;
    server_name _;
    absolute_redirect off;   # 同上：否则 302 会指向未发布的 8443
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:2m;
    include /etc/nginx/dm-locations.conf;
}
