server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 公开资源：登录页 / 403 页 / 它们依赖的样式与脚本 ──
    # （不公开这些，未登录用户连登录页都渲染不出来）
    location = /login.html  { try_files /login.html =404; }
    location = /403.html    { try_files /403.html =404; }
    location = /v3.css      { try_files /v3.css =404; }
    location = /v3nav.js    { try_files /v3nav.js =404; }
    location = /favicon.ico { return 204; }
    location ^~ /vendor/    { try_files $uri =404; }

    # ── 登录 / 登出：必须落到应用（POST 表单不能在静态目录里处理）──
    location = /login  { proxy_pass http://fastapi:8000/login;  proxy_set_header Host $host; }
    location = /logout { proxy_pass http://fastapi:8000/logout; proxy_set_header Host $host; }

    # ── 门禁探针（internal，外部访问不到）──
    # 为什么页面门禁必须放在 nginx：页面是静态文件，FastAPI 根本看不到它们；
    # 不在这里挡，直接输 URL 就能绕过登录。判定逻辑只有一份（FastAPI 的 auth.py）。
    location = /_auth {
        internal;
        proxy_pass http://fastapi:8000/api/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /_auth_admin {
        internal;
        proxy_pass http://fastapi:8000/api/session?need=admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ── 仅管理员页面 ──
    location = /users       { auth_request /_auth_admin; error_page 401 = @to_login; error_page 403 = @to_403; try_files /users.html =404; }
    location = /rhythm.html { auth_request /_auth_admin; error_page 401 = @to_login; error_page 403 = @to_403; try_files /rhythm.html =404; }

    # ── 入口：直接进诊断卡（本系统的核心页）──
    location = / { auth_request /_auth; error_page 401 = @to_login; try_files /diagnosis.html =404; }

    # ── 其余静态页：一律要求登录 ──
    location / {
        auth_request /_auth;
        error_page 401 = @to_login;
        try_files $uri $uri/ =404;
    }

    location @to_login { return 302 /login?next=$request_uri; }
    location @to_403   { return 302 /403.html; }

    # ── API 反代：门禁在 FastAPI 里做（保证未登录/越权仍是 JSON，不被 nginx 换成 302）──
    location /api/ {
        proxy_pass http://fastapi:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

