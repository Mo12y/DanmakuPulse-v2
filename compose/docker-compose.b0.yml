# B0 最小底座（9 服务，≈4.6GB）—— DS/监控栈见 docker-compose.obs.yml（B1 叠加）
# 设计出处：docs/05-新系统重构/11_执行批次计划.md §2 B0.1（用户裁定 2026-10-12：分层起服务）
# 注意：Spark Master 768MB（client 模式 driver 同住），Worker 1.5GB；总预算不变
name: danmaku-b0

services:
  # ── HDFS（B0 单 DataNode，replication=1；B1 加 DataNode2）──
  namenode:
    image: ${HADOOP_NN_IMAGE}
    container_name: namenode
    mem_limit: 512m
    restart: unless-stopped
    ports: ["${HDFS_UI_PORT}:9870"]
    environment:
      - CLUSTER_NAME=b0
    env_file: hadoop.env
    volumes:
      - hdfs-nn:/hadoop/dfs/name
      - ./assets:/mnt/assets:ro          # ingest_raw.sh 等初始化脚本
      - ../data:/mnt/data                # 本地批次文件（灌 /raw 用）
    networks: [net]

  datanode:
    image: ${HADOOP_DN_IMAGE}
    container_name: datanode
    mem_limit: 512m
    restart: unless-stopped
    env_file: hadoop.env
    environment:
      SERVICE_NAME: datanode
    volumes:
      - hdfs-dn:/hadoop/dfs/data
    depends_on: [namenode]
    networks: [net]

  # ── PostgreSQL（Hive 元库 metastore_db + ads 库）──
  postgres:
    image: ${PG_IMAGE}
    container_name: postgres
    mem_limit: 256m
    restart: unless-stopped
    ports: ["${PG_PORT}:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [net]

  # ── Hive Metastore（自建版，B1 2026-10-12）──
  # bde2020/hive* 系列镜像两源不可得（403 / not found）；复用 danmaku-spark 镜像自带的
  # Hive 2.3.9 依赖直接起服务（探针实证）：
  #   java -cp "/opt/spark/jars/*:/opt/hms-jars/*:/opt/hms-conf" org.apache.hadoop.hive.metastore.HiveMetaStore
  # 裁剪版无 schematool → hive-site.xml 用 datanucleus.schema.autoCreateAll=true 自建 schema（幂等）。
  # /opt/hms-jars = ../lib（disruptor + pg jdbc，Makefile setup 负责下载）。
  hive-metastore:
    image: ${SPARK_IMAGE}
    container_name: hive-metastore
    mem_limit: 512m
    user: root
    restart: unless-stopped
    command: ["java", "-Xmx400m", "-cp", "/opt/spark/jars/*:/opt/hms-jars/*:/opt/hms-conf", "org.apache.hadoop.hive.metastore.HiveMetaStore"]
    volumes:
      - ./assets/hms:/opt/hms-conf:ro
      - ../lib:/opt/hms-jars:ro
    depends_on: [namenode, postgres]
    networks: [net]

  # ── Spark 3.5 standalone（master+1worker+history；B1 加 worker2）──
  spark-master:
    image: ${SPARK_IMAGE}
    container_name: spark-master
    mem_limit: 768m
    user: root
    restart: unless-stopped
    ports: ["${SPARK_UI_PORT}:8080"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}   # ads_min.py JDBC 写库用（容器内环境变量）
    volumes:
      - ./assets/spark-conf:/opt/spark/conf:ro         # core-site/hive-site（读 HDFS + HMS）
      - ../lib:/opt/spark/jars-extra:ro                # postgresql jdbc jar（JDBC 写在 executor 执行）
      - ../jobs:/opt/work/jobs:ro
      - ../config:/opt/work/config:ro
      - ../tests/goldens:/opt/goldens:ro               # 对拍基准
      - ../data-out:/opt/work/data-out                 # 对拍报告/指纹输出
      - spark-events:/opt/spark/events
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    depends_on: [namenode, hive-metastore]
    networks: [net]

  spark-worker:
    image: ${SPARK_IMAGE}
    container_name: spark-worker
    mem_limit: 1536m
    user: root
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_WEBUI_PORT: "8081"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081"]
    ports: ["${SPARK_WORKER_UI_PORT}:8081"]
    volumes:
      - ./assets/spark-conf:/opt/spark/conf:ro
      - ../lib:/opt/spark/jars-extra:ro
      - spark-events:/opt/spark/events
    depends_on: [spark-master]
    networks: [net]

  spark-history:
    image: ${SPARK_IMAGE}
    container_name: spark-history
    mem_limit: 256m
    user: root
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:/opt/spark/events -Dspark.history.ui.port=18080"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    ports: ["${SPARK_HISTORY_PORT}:18080"]
    volumes:
      - spark-events:/opt/spark/events:ro
    depends_on: [spark-master]
    networks: [net]

  # ── FastAPI（只读 API，读 PG ads 库）──
  fastapi:
    build:
      context: ../serve
      dockerfile: Dockerfile
    container_name: fastapi
    mem_limit: 256m
    restart: unless-stopped
    ports: ["${FASTAPI_PORT}:8000"]
    environment:
      ADS_PG_DSN: "host=postgres port=5432 dbname=ads user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}"
    depends_on: [postgres]
    networks: [net]

  # ── Nginx（唯一对外入口：静态页 + /api 反代）──
  nginx:
    image: nginx:alpine
    container_name: nginx
    mem_limit: 64m
    restart: unless-stopped
    ports: ["${NGINX_PORT}:80"]
    volumes:
      - ./assets/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../serve/static:/usr/share/nginx/html:ro
    depends_on: [fastapi]
    networks: [net]

volumes:
  hdfs-nn:
  hdfs-dn:
  pg-data:
  spark-events:

networks:
  net:
    driver: bridge
