# 配置中心（B0-min 子集）—— 全部可调参数集中于此（对齐 08 §0.3，后续批次只增不改语义）
# 权威算法口径 = 旧仓库 analysis/danmaku_metrics.py（SSOT），本文件值与其保持一致，
# 对拍容差分层：计数类零容差 / 浮点类 <=1e-9（Spark 分区求和 vs NumPy 顺序求和的 IEEE754 差异）

l1_min:
  n_points: 101            # 密度曲线点数（旧 SSOT N_POINTS=101）
  smooth_sigma: 1.0        # 高斯平滑 σ（scipy gaussian_filter1d, truncate=4.0 → 9-tap 核, reflect 边界）
  # 峰检测（旧 SSOT：find_peaks(height=μ+2σ, distance=n//50)；distance=2 对严格局部极大是 no-op，
  # 见 jobs/m2_l1_min.py 头注）
  peak_sigma_mult: 2.0
  # front_ratio 用旧 adaptive 口径（60s→[3%,10%] 截断）——B0 对拍基准口径，B2 切新口径前不得改
  front_window: adaptive

etl:
  # B1 2026-10-12 切换（实验 tools/probe_dedup_keys.py：旧键 (text,time_offset) 误删 4,492 行
  # 「同文同刻但 row_id 全唯一」的真实复读弹幕——3,021 组；新键 (bvid,cid,row_id) 批内零误删。
  # 对拍锚点链（m0_min→parity/replay）仍硬编码旧键 672,439 不动；本键供 m0_full 生产链：4 批 → 676,931）
  dedup_key: [bvid, cid, row_id]
  status_ok: "ok"
  min_text_len: 5                        # is_ultra_short 阈值（08 §1.3）
  ad_regex: "扫码|加微|加薇|加我|私信我|粉丝群|领资料|免费领"     # v0 保守集（08「+微/扫码/加我…params 可扩」）
  meaningless_regex: "^(打卡.*天?|有人吗|前排|沙发|签到|第一|来了|到此一游|占楼)[!！。.~～]*$"

quality:
  # 08 §0.3 质量与刷量阈值（M1/m0_full 共用）
  reconcile_warn_ratio: 0.20
  blocked_warn_ratio: 0.30
  spam_user_share: 0.05
  spam_cv: 0.10
  spam_burst: 20
  spam_video_ratio: 0.30

parity:
  float_tol: 1.0e-9        # 浮点维/曲线点容差
  int_exact: true          # peak_count / peak_fwhm / 计数锚点必须精确一致
  goldens_dir: /opt/goldens

anchors:  # 池级对账锚点（2026-10-12 一手实测，出处旧仓库 docs/00-规范/结论权威口径.md §2.9）
  n_videos_pool: 508            # 每 bvid 取最新 batch 画像
  n_rows_total: 509             # 视频批次数 = 91+118+200+100
  n_danmaku_pool: 669995        # 池内 SUM(danmaku_count)
  n_danmaku_dwd: 672439         # DWD 总行数（= 保留率 99.3364% 的分子）
  clean_retention: "0.993364"   # dwd/ods = 672439/676931

l2:
  min_danmaku: 100         # 弹幕 <100 的视频跳过 L2（08 §4 异常降级；事件表空、指纹相关列置空）

detect:                    # L2 四检测器与融合（08 §4.1/§4.2；w/θ 标定前为默认值 → calibrated_on='uncalibrated'）
  bucket_sec: 5            # 检测网格（5s 原始口径，禁平滑）
  d1_quantile: 0.70        # D1 郭可岩三点：前缀 P70 自适应阈值（最近秩）
  d1_slope: 20             # D1 三点 OLS 斜率门限（cnt/桶）
  d2_k: 2.0                # D2 孔玲玲：变化率门限 |c_{i+1}−c_{i−1}|/2
  d3_gap_min: 10           # D3 Entropy：最小峰距（桶）
  flux_win: 3              # D4 spectral flux：因果窗（桶）
  flux_delta: 1.5          # D4：局部 20 桶 mean+1.5·std 显著性
  fusion_w: [0.3, 0.3, 0.2, 0.2]   # D1/D2/D3/D4 权重（30 视频标注网格搜索标定前 = 默认值）
  fusion_theta: 0.5        # 融合分截断 θ
  merge_gap: 3             # 同法命中间隔 <3 桶合并（08 §4.1 D1 规则；各法统一）

sync:                      # 同步性（08 §4.3）
  peak_win: 2              # 事件 ±2 桶峰窗
  perm_n: 1000             # 置换检验次数（种子按 bvid+batch 固定 → 幂等）

anchor:                    # 锚词滞后校正（08 §4.5；词表在 M5 dict_anchor——本作业只读 is_anchor 打标）
  win_bucket: 6            # 事件 ±6 桶窗
  min_anchors_part: 30     # 分区级 δ 输出门槛（DoD：n_anchors ≥30 才输出）

novelty:                   # Novelty 分段（08 §4.6）
  ssm_win: 10              # SSM 特征窗（桶）
  kernel_k: 8              # 棋盘核半宽（核尺寸 2k×2k）

hawkes:                    # L3 Hawkes 拟合器（08 §5.1；时间单位=天，自 pubdate）
  min_events: 1000         # 门槛：窗口内事件数 <1000 → 跳过（08 §5.1）
  window_days: 21          # 窗口 [pubdate, min(末事件, pubdate+21d)]
  ks_p: 0.05               # 时间变换残差 KS：p>0.05 → pass；否则 method=powerlaw 降级
  bounds: {mu0: [1.0e-6, 1.0e5], eta: [-20.0, 20.0], sigma: [1.0e-6, 0.95], beta: [0.01, 5.0]}
                           # L-BFGS-B bounds；mu1=mu0+e^eta（μ1≥μ0 强制）；alpha=sigma*beta
